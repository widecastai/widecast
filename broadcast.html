<script>
(() => {
  'use strict';
  // Email broadcast (2026-10-24). Server: dashboard2.py "SOLO AGENCY — broadcast" on solo_broadcast.py. The owner writes
  // one email, ticks lead magnets and/or the whole CRM of a client, checks the numbers, presses Send; a later Send reaches
  // only the people who joined since. Same sign-in, API base, language choice and look as the library and node pages.
  const LANG_SWITCH = false;              // as the other pages (owner, 16/10): English for now, both dictionaries kept
  const Q0 = new URLSearchParams(location.search);

  // ── History steps (owner rule 2026-11-17, BACK_NAV_AUDIT_2026-11-17.md: Back returns to the very place the Boss came
  // from). Every history entry this page writes carries wcIdx (0 for the page's first entry, one more for each inner
  // view: a phone detail, an editor, an inner screen), the address of the entry before it (wcPrev) and, once left, its
  // scroll (wcY), whatever state the page's own code passes. An inner view that the back gesture leaves is closed by
  // wcPop before the page's own popstate listeners run.
  let wcPop = null;
  (() => {
    const H = window.history;
    if (!H || typeof H.pushState !== 'function') return;
    const push = H.pushState.bind(H), repl = H.replaceState.bind(H);
    const idx = () => (H.state && typeof H.state.wcIdx === 'number' ? H.state.wcIdx : 0);
    const mix = (st, i) => Object.assign({}, st && typeof st === 'object' ? st : {}, { wcIdx: i });
    try {
      H.pushState = function (st, ti, url) {
        try { H.scrollRestoration = 'manual'; } catch (e) { /* old browser */ }   // the page puts the place back itself
        repl(Object.assign(mix(H.state, idx()), { wcY: window.pageYOffset || 0 }), '');
        return push(Object.assign(mix(st, idx() + 1), { wcPrev: location.href }), ti, url);
      };
      H.replaceState = function (st, ti, url) { return repl(mix(st == null ? H.state : st, idx()), ti, url); };
      repl(mix(H.state, idx()), '');
    } catch (e) { /* history not writable */ }

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }

  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'value') el.value = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);

            h('div', { class: 'chips' }, engageChips(r), ['bounced', 'complained', 'unsubscribed'].filter((k) => num(ev[k])).map((k) => h('span', { class: 'chip', text: fmtNum(num(ev[k])) + ' ' + t(k) }))),

  // Clicks, opens (estimate) and file opens of one send (2026-11-11): each a button that lists who, latest first.
  function engageChips(r) {
    const ev = r.events || {}, sent = num(r.sent);

  function toggleWho(runId, ev) {

      if (S.who !== W) return;

  function whoList(r) {

      h('span', { class: 'small', text: fmtDay(x.at) + (num(x.count) > 1 ? ' · ' + fmtNum(num(x.count)) + '×' : '') })))),
      W.total > W.rows.length ? h('p', { class: 'small', style: 'margin-top:6px', text: t('who_more', { n: fmtNum(W.total - W.rows.length) }) }) : null);

  // A drawing keeps the page where it was while the view stays the same (owner rule 2026-11-17: Back returns to the same

  function render() {
    const y = window.pageYOffset || 0, v = S.view, m = S.mode;

  }
  function wcRenderNow() {

    else if (S.mode === 'login') app.appendChild(loginView());

    else app.appendChild(S.view === 'edit' && S.edit ? editorView() : listView());

  window.addEventListener('beforeunload', (ev) => { if (S.dirty && S.edit && (S.edit.subject || S.edit.body)) { ev.preventDefault(); ev.returnValue = ''; } });
  render();
  load();


  // ── The editor and the list (owner rule 2026-11-17): Back (the button or the phone's back gesture) returns to the list
  // at the place it was left, the item that was open marked; changes not saved yet are not dropped without asking.
  function edDirty() { return !!(S.edit && S.dirty && (str(S.edit.subject).trim() || str(S.edit.body).trim())); }
  function edLeaveOk() { return !edDirty() || window.confirm(t('wc_discard')); }
  function edMark(id) { S.wcList = { y: window.pageYOffset || 0, id: String(id || '') }; }
  function edClose() { stopPoll(); S.view = 'list'; S.edit = null; S.run = null; refreshState().then(() => { render(); edRestore(); }); syncUrl(); if (S.active && S.active.state !== 'paused') startPoll(S.active.run_id); }
  function edRestore() {
    const m = S.wcList;

    window.scrollTo(0, m.y);
    const b = [].slice.call(app.querySelectorAll('[data-uid]')).filter((x) => x.getAttribute('data-uid') === m.id)[0];

    edClose();
  }
  wcPop = () => {
    const ed = !!(history.state && history.state.wcIn === 'ed');
    if (S.view === 'edit' && !ed) {
      if (!S.wcLeaving && !edLeaveOk()) { syncUrl(); return true; }                // stays: the editor's step again

    if (S.view !== 'edit' && ed) {

  };
  // ── Ways back to the Wizard and a real Sign out (owner, 2026-11-17, WIZARD_UX_AUDIT_PLAN_2026-11-17.md 4.5). The
  // header's Wizard link shows once this browser has used the Wizard (wc_wizard_client); opened from the

  // signOut), then shows the sign-in; the sign-in form keeps its "Use another email". Nothing else on the page changes.
  function wzHref() {
    const c = (S && typeof S.client === 'string' && S.client) || Q0.get('client') || lsGet('wc_wizard_client') || '';
    const p = new URLSearchParams();
    if (/^[a-z0-9][a-z0-9_-]{0,63}$/.test(c)) p.set('client', c);

  // The page the Boss came from (owner rule 2026-11-17): a page of this site, in this tab, named in the header's

  function wcPrevPage() {
    const names = { '/wizard.html': 'Wizard', '/approve.html': 'Approvals', '/report.html': 'Report', '/nodes.html': 'Agents',
      '/content-library.html': 'Library', '/magnets.html': 'Lead magnets', '/crmstore.html': 'CRM', '/crm.html': 'CRM connections',
      '/broadcast.html': 'Email broadcast', '/group-broadcast.html': 'Post broadcast', '/communities.html': 'Communities', '/sends.html': 'Schedule & history',

    if (Q0.get('from') === 'wizard') return { url: wzHref(), name: 'Wizard', wizard: true };
    if (Q0.get('from') === 'sends') return { url: 'sends.html' + (S && S.client ? '?client=' + encodeURIComponent(S.client) : ''), name: 'Schedule & history', wizard: false };   // opened from Schedule & history (no address sent): the same page

  }
