:root{color-scheme:light;
--bg:#f5f5f2;--s1:#fdfdfb;--s2:#efefea;--s3:#e5e5df;--line:#e1e1da;--line-2:#d0d0c8;--field-ln:#8f908a;

--acc:#c6f135;--acc-hi:#b8e425;--acc-ink:#141a05;--acc-soft:#eef7cf;--acc-line:#c3dc72;--acc-tx:#46560a;--ring:#46560a;

--ok-bg:#e3f3e1;--ok-tx:#1f6a24;--ok-ln:#b8dcb4;
--err-tx:#a0261a;--shadow:0 1px 2px rgba(14,15,17,.05);
--font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
--bg:#0e0f11;--s1:#16181b;--s2:#1c1f23;--s3:#262a30;--line:#25282d;--line-2:#34373e;--field-ln:#696c74;
--tx:#eceae4;--tx-hi:#f5f3ec;--tx-2:#b9b7af;--tx-3:#8f8d87;
--acc:#c6f135;--acc-hi:#d3f65c;--acc-ink:#141a05;--acc-soft:#1c230a;--acc-line:#46540f;--acc-tx:#c6f135;--ring:#c6f135;
--hot-bg:#2b1711;--hot-tx:#ffa189;--hot-ln:#5c2c1e;--warm-bg:#2a2111;--warm-tx:#f2c76a;--warm-ln:#5b4419;--watch-bg:#151d2f;--watch-tx:#a3b8ff;--watch-ln:#2d3c64;
--ok-bg:#132514;--ok-tx:#8fd894;--ok-ln:#2b4d2d;
--err-tx:#ffa189;--shadow:none}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,p,ul,ol{margin:0}
img,svg{display:block;max-width:100%}
a{color:var(--acc-tx);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:min(100% - 32px,760px);margin-inline:auto}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--tx-hi);text-decoration:none;font-weight:600;letter-spacing:-.01em}
.brand .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#0e0f11;border:1px solid var(--line)}
.brand img{width:24px;height:24px}
.hdr-r{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-links{display:flex;gap:4px}
.hdr-links a{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:10px;color:var(--tx-2);text-decoration:none;font-size:.875rem;font-weight:500}
.hdr-links a:hover{background:var(--s2);color:var(--tx-hi)}
@media (max-width:560px){.brand>span:not(.mark){display:none}.hdr-links a{padding:0 8px}}
main{flex:1;padding:24px 0 64px;outline:none}
.foot{padding:20px 0 32px;color:var(--tx-3);font-size:.8125rem}
h1.pg{font-size:1.5rem;line-height:1.25;font-weight:600;color:var(--tx-hi);letter-spacing:-.015em}
.sub{color:var(--tx-2);margin-top:4px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.0625rem;font-weight:600;color:var(--tx-hi);line-height:1.3}
.card .hint{color:var(--tx-3);font-size:.875rem;margin-top:2px}
.note{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--s2)}
.note.warn{background:var(--warm-bg);border-color:var(--warm-ln);color:var(--warm-tx)}
.note.bad{background:var(--hot-bg);border-color:var(--hot-ln);color:var(--hot-tx)}
.note.good{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-tx)}
.note b{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--s1);color:var(--tx-hi);font:500 .9375rem/1.2 var(--font);text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--s2)}
.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed}
.btn.disabled{pointer-events:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.pri:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.dark{background:var(--tx-hi);border-color:var(--tx-hi);color:var(--bg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx-2)}
.btn.ghost:hover{background:var(--s2)}
.btn.danger{color:var(--err-tx)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem;border-radius:10px}
.btn.wide{width:100%}
label.lbl{display:block;font-size:.875rem;font-weight:600;color:var(--tx-hi);margin:14px 0 6px}
.field{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--field-ln);border-radius:12px;background:var(--bg);color:var(--tx-hi)}
textarea.field{min-height:220px;resize:vertical;line-height:1.55}
select.field{padding-right:28px}
.field:focus{outline:2px solid var(--ring);outline-offset:1px}
.small{font-size:.8125rem;color:var(--tx-3)}
.err{color:var(--err-tx);font-size:.875rem;margin-top:8px}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);background:var(--s2);color:var(--tx-2)}
.pill.wait{background:var(--warm-bg);border-color:var(--warm-ln);color:var(--warm-tx)}
.pill.sent{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-tx)}
.pill.live{background:var(--watch-bg);border-color:var(--watch-ln);color:var(--watch-tx)}
.pill.no{background:var(--hot-bg);border-color:var(--hot-ln);color:var(--hot-tx)}
.list{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0}
.item{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--s1);cursor:pointer;color:var(--tx);min-width:0}
.item:hover{background:var(--s2);border-color:var(--line-2)}
.item .t{font-weight:600;color:var(--tx-hi);overflow-wrap:anywhere}
.item .m{font-size:.8125rem;color:var(--tx-3)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-width:0}
.chk:hover{border-color:var(--line-2)}
.chk input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--acc-tx)}
.chk .t{font-weight:600;color:var(--tx-hi);overflow-wrap:anywhere}
.chk .m{font-size:.8125rem;color:var(--tx-3)}
.chks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mag{display:flex;flex-direction:column;gap:6px}.langs{display:flex;flex-wrap:wrap;gap:6px;margin-left:28px}
.chk.sub{padding:6px 10px;align-items:center;gap:8px}
.big{font-size:2.25rem;line-height:1.1;font-weight:600;color:var(--tx-hi);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin-top:12px;font-size:.9375rem}
.kv .v{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx-hi);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:.8125rem;color:var(--tx-2)}
.list li.box{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.list li.box .n{overflow-wrap:anywhere;min-width:0}
.fmenu{margin:0 0 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.fmenu .chips{margin-top:6px}
.fmenu button.chip{cursor:pointer;min-height:36px;color:var(--tx-hi);text-align:left;overflow-wrap:anywhere}
.fmenu button.chip:hover{background:var(--s3)}
.fmenu button.chip code{font-size:.75rem;color:var(--tx-2);margin-left:6px}
.bar{height:10px;border-radius:999px;background:var(--s3);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--acc-tx);border-radius:999px;transition:width .4s}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);gap:2px;flex-wrap:wrap}
.seg label{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:9px;cursor:pointer;font-size:.875rem;color:var(--tx-2)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:var(--tx-hi);font-weight:600}
.seg label:has(input:checked){background:var(--s3)}
.seg label:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:1px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:12px;background:var(--bg)}
.file .n{font-weight:600;color:var(--tx-hi);overflow-wrap:anywhere;min-width:0}
.files{display:flex;flex-direction:column;gap:8px}
.files .file{flex-wrap:nowrap;padding:10px 12px}
.files .file .n{flex:1 1 auto}
.files .file .small{flex:0 0 auto;white-space:nowrap}
.caps{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.9375rem}
.caps input{width:58px;min-height:40px;text-align:center;padding:6px}
.hist{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin-top:10px}
.hist li{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:.875rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar>i{transition:none}}
.login{max-width:420px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:var(--tx-hi);color:var(--bg);font-size:.9375rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
</style>
</head>

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
  let memSession = null;
  function session() {
    const tok = lsGet('google_auth_token') || '', mail = lsGet('google_auth_email') || '', cid = lsGet('company_id') || '';
    if (tok && mail && cid) return { user_token: tok, user_email: mail, company_id: cid };
    return memSession;
  }
  function storeSession(tok, mail, cid) {
    const ok = [lsSet('google_auth_token', tok), lsSet('google_auth_email', mail), lsSet('google_auth_timestamp', Date.now().toString()), lsSet('company_id', cid)].every(Boolean);
    lsDel('wc_client_simplified');
    memSession = ok ? null : { user_token: tok, user_email: mail, company_id: cid };
  }
  const LANG = (() => { if (!LANG_SWITCH) return 'en'; const s = lsGet(LANG_KEY); return s === 'vi' ? 'vi' : 'en'; })();
  document.documentElement.lang = LANG;
  const locale = () => (LANG === 'vi' ? 'vi-VN' : 'en-US');
  function t(key, vars) {
    let s = I18N[LANG][key];
    if (s == null) s = I18N.en[key];
    if (s == null) return key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return s;
  }
  function tn(key, n) { return n === 1 && I18N[LANG][key + '_1'] ? t(key + '_1') : t(key, { n: fmtNum(n) }); }
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'value') el.value = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      }
    }
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach((x) => add(el, x)); return; }
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  const str = (v) => (typeof v === 'string' ? v : '');
  const arr = (v) => (Array.isArray(v) ? v : []);
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const fmtNum = (n) => { try { return new Intl.NumberFormat(locale()).format(n); } catch (e) { return String(n); } };
  function fmtDay(sec) {
    const n = Number(sec);
    if (!(n > 0)) return '';

  }

  }

  // ── API
  function setHeader(headers, k, v) { if (v && /^[\x20-\x7e]*$/.test(v)) headers[k] = v; }

    const s = session(), headers = {};

  function errOf(res) {
    const d = (res && res.data) || {}, e = d.error;
