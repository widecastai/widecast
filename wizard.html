<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef5ff">
<title>Wizard | WideCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* WideCast Wizard (2026-10-29), direction A "the path": the day is a board-game trail with three stops and a flag.
   One decision per screen, big thumb-reach buttons, chunky pressable buttons; motion only around the action, never
   over what is being reviewed, and never moving on by itself. */
:root{
 --page:#cfe2fa;--bg:#eef5ff;--surface:#ffffff;--ink:#13234a;--muted:#55678c;--line:#d3e0f4;--chip:#e2ecfb;
 --primary:#2f66e8;--primary-deep:#1d47b0;--on-primary:#ffffff;--sun:#ffc53d;--sun-deep:#d99a12;
 --s-wait:#8a5a00;--s-wait-bg:#fff1cc;--s-ok:#137a50;--s-ok-bg:#d8f5e7;--s-fix:#b42c45;--s-fix-bg:#ffe1e6;
 --s-busy:#1d47b0;--s-busy-bg:#dbe6ff;--s-you:#7a3fb0;--s-you-bg:#f1e4ff;--flame:#f08a1c;
 --toast-bg:#13234a;--toast-ink:#ffffff;--focus:#ffb000;
 --f-disp:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--f-body:"Be Vietnam Pro",system-ui,sans-serif;
 --r-card:22px;--r-btn:18px;--t-dur:.55s;--t-ease:cubic-bezier(.2,1.25,.35,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--primary-deep)}
.app{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:560px){body{padding:16px 0}.app{height:min(900px,calc(100% - 0px));border-radius:34px;box-shadow:0 30px 80px -30px rgba(10,20,60,.45)}}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.mode{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px}
.mode a,.mode span{display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;font:700 14px/1 var(--f-body);min-height:40px;color:var(--muted);text-decoration:none}
.mode span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.smini{display:inline-flex;align-items:center;gap:6px;font:800 16px/1 var(--f-disp);color:var(--ink)}
.smini svg{width:20px;height:20px;color:var(--flame)}
/* the trail: three stops and the flag */
.prog{flex:none;padding:6px 22px 10px;display:grid;gap:8px}
.trail{position:relative;height:34px;display:flex;justify-content:space-between;align-items:center}
.trail .track{position:absolute;left:16px;right:16px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:repeating-linear-gradient(90deg,#b8cdee 0 10px,transparent 10px 18px)}
.trail .track i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--primary);border-radius:3px;transition:width .9s cubic-bezier(.3,1.2,.4,1)}
.stop{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #b8cdee;font:800 16px/1 var(--f-disp);color:var(--muted);transition:background .4s,border-color .4s,color .4s,transform .4s}
.stop svg{width:18px;height:18px}
.app[data-step="1"] .stop[data-n="1"],.app[data-step="2"] .stop[data-n="2"],.app[data-step="3"] .stop[data-n="3"]{border-color:var(--primary);color:var(--primary);transform:scale(1.15);box-shadow:0 0 0 6px rgba(47,102,232,.15)}
.app[data-step="2"] .stop[data-n="1"],.app[data-step="3"] .stop[data-n="1"],.app[data-step="3"] .stop[data-n="2"],.app[data-step="4"] .stop{background:var(--primary);border-color:var(--primary);color:#fff}
.app[data-step="4"] .stop.flag{background:var(--sun);border-color:var(--sun-deep);color:#3d2a00;transform:scale(1.2)}
.app[data-step="0"] .prog{visibility:hidden}
.prog p{display:flex;justify-content:space-between;gap:8px;font:700 14px/1.2 var(--f-body)}
.prog .psub{color:var(--muted);font-weight:600;text-align:right}
/* screens */
.screens{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform var(--t-dur) var(--t-ease),opacity calc(var(--t-dur)*.7) ease}
.scr.enter{transform:translateX(104%);opacity:0}
.scr.leave{transform:translateX(-30%) scale(.96);opacity:0;pointer-events:none}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.dock{flex:none;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:8px;background:var(--bg);border-top:1px solid var(--line)}
.dock .hint{text-align:center;font-size:13.5px;color:var(--muted);font-weight:600}
.gate-h{display:grid;gap:8px}
.eyebrow{font:700 12.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h{font:800 30px/1.05 var(--f-disp);text-wrap:balance;color:var(--ink)}
.h.sm{font-size:24px;line-height:1.1}
.sub{font-size:16px;color:var(--muted);line-height:1.5}
.note{font-size:13.5px;color:var(--muted);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:0;border-radius:var(--r-btn);font:700 16px/1.1 var(--f-disp);text-decoration:none;text-align:center;transition:transform .08s ease,box-shadow .08s ease,opacity .2s}
.btn.big{min-height:62px;font-size:21px;width:100%}
.btn.pr{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 0 var(--primary-deep);margin-bottom:6px}
.btn.pr:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.gh{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 #c3d4ef;margin-bottom:4px}
.btn.gh:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #c3d4ef}
.btn.ln{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 6px;box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:0;padding:0 10px}
.acts{display:grid;gap:8px}
.acts>.btn.pr{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:700 12.5px/1.2 var(--f-body);white-space:nowrap;color:var(--s-wait);background:var(--s-wait-bg)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip[data-s="ok"]{color:var(--s-ok);background:var(--s-ok-bg)}
.chip[data-s="fix"]{color:var(--s-fix);background:var(--s-fix-bg)}
.chip[data-s="busy"]{color:var(--s-busy);background:var(--s-busy-bg)}
.chip[data-s="busy"]::before{animation:blink 1.1s ease-in-out infinite}
.chip[data-s="you"]{color:var(--s-you);background:var(--s-you-bg)}
.chip[data-s="mute"]{color:var(--muted);background:var(--chip)}
.chip.pop{animation:pop .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
/* top 3: stops on the trail */
.probs{display:grid;gap:14px;position:relative}
.probs::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;border-left:4px dashed #b8cdee;z-index:0}
.prob{position:relative;text-align:left;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-card);padding:16px 16px 14px 66px;display:grid;gap:7px;width:100%;box-shadow:0 5px 0 #d3e0f4}
.prob:nth-child(2){margin-left:10px;width:calc(100% - 10px)}
.prob .rank{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 20px/1 var(--f-disp);background:#fff;border:3px solid #b8cdee;color:var(--ink);z-index:1}
.prob .tag{justify-self:start;font:800 11.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--sun);color:#3d2a00}
.prob .ptitle{font:700 19px/1.25 var(--f-disp);text-wrap:balance}
.prob .sig{font-size:13.5px;line-height:1.45;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.prob .meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.prob .meter i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.prob .lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--s-ok)}
.prob .lock svg{width:16px;height:16px}
.prob[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 5px 0 var(--primary-deep)}
.prob[aria-pressed="true"] .rank{background:var(--primary);border-color:var(--primary);color:#fff}
.flagline{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font:700 14px/1.2 var(--f-body);color:var(--muted);padding-left:16px}
.flagline i{width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;color:#3d2a00;flex:none;box-shadow:0 4px 0 var(--sun-deep)}
.flagline svg{width:20px;height:20px}
.upd{font-size:13.5px;color:var(--muted)}
.langrow{display:flex;justify-content:center;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.langrow .btn.ln{min-height:32px;font:600 13.5px var(--f-body)}
/* bundle */
.item{background:var(--surface);border-radius:var(--r-card);padding:16px;display:grid;gap:12px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);transition:border-color .3s,opacity .3s}
.item[data-s="ok"]{border-color:#9fdcc0;box-shadow:0 5px 0 #9fdcc0}
.item[data-s="mute"]{opacity:.7}
.item>header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font:800 13px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ttl{font:700 18px/1.3 var(--f-disp)}
.txt{font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ta{width:100%;min-height:150px;border:2px dashed var(--s-fix);border-radius:12px;padding:10px;background:var(--s-fix-bg);font-size:16px;line-height:1.5;resize:vertical}
.pic{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--chip);display:block}
.quote{border-left:4px solid var(--line);padding:10px 12px;background:var(--chip);border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.5;display:grid;gap:4px;overflow-wrap:anywhere}
.quote .who{font-weight:700;font-size:13px;color:var(--ink)}
.self{display:grid;gap:8px;background:var(--s-you-bg);color:var(--s-you);padding:12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.45}
.places{display:flex;flex-wrap:wrap;gap:8px}
.place{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:700 14px/1 var(--f-body)}
.place[aria-pressed="true"]{border-color:var(--primary);background:var(--s-busy-bg);color:var(--primary-deep)}
.place:disabled{opacity:.5}
.vsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:700 12.5px/1 var(--f-body)}
.vsteps span{padding:6px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.vsteps span.now{background:var(--primary);color:var(--on-primary)}
.vsteps span.done{background:var(--s-ok-bg);color:var(--s-ok)}
.vsteps em{font-style:normal;color:var(--muted)}
.err{color:var(--s-fix);font-size:14px;font-weight:600}
.missing{opacity:.75}
/* waiting */
.wait-hero{display:grid;justify-items:center;gap:20px;text-align:center;padding-top:18px}
.status-line{font:800 27px/1.18 var(--f-disp);text-wrap:balance}
.walker{width:130px;height:130px;border-radius:50%;background:#dbe6ff;position:relative;display:grid;place-items:center}
.walker::before{content:"";position:absolute;inset:10px;border-radius:50%;border:4px dashed #9fb8ec}
.walker i{position:absolute;inset:0;animation:spin 3.2s linear infinite}
.walker i::after{content:"";position:absolute;left:50%;top:4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--primary);box-shadow:0 3px 0 var(--primary-deep)}
.walker svg{width:44px;height:44px;color:var(--primary)}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.mini li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;border:1px solid var(--line);text-align:left}
.calm{font-size:15px;color:var(--muted);max-width:32ch}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sun);color:#3d2a00;border-radius:14px;padding:8px 8px 8px 14px;font-weight:700;font-size:14.5px}
.banner .btn{min-height:40px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--sun-deep);margin:0 0 3px}
/* gates */
.vid{display:block;width:min(64%,240px);aspect-ratio:9/16;max-width:100%;margin:0 auto;border-radius:20px;background:#0b1430}
.cardline{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-card);padding:16px;display:grid;gap:10px}
/* results */
.res-hero{position:relative;text-align:center;display:grid;gap:8px;padding:16px 0 4px}
.res-hero canvas{position:absolute;left:-20px;top:-10px;width:calc(100% + 40px);height:calc(100% + 20px);pointer-events:none}
.streak{display:grid;gap:12px;background:var(--surface);border-radius:var(--r-card);padding:16px;border:3px solid var(--line)}
.streak .big{display:flex;align-items:baseline;gap:10px}
.streak .big b{font:800 46px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.streak .big span{font:700 17px/1.2 var(--f-disp)}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week li{display:grid;justify-items:center;gap:6px;font:700 12px/1 var(--f-body);color:var(--muted)}
.week li i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e2ecfb;border:3px solid #c9d8f0;font-style:normal;font-weight:800}
.week li[data-s="done"] i{background:var(--primary);border-color:var(--primary);color:#fff}
.week li[data-s="rest"] i{background:#fff;border-style:dashed}
.week li[data-s="today"] i{background:#fff;border-color:var(--sun-deep)}
.week li[data-s="today-done"] i{background:var(--sun);border-color:var(--sun-deep);color:#3d2a00;animation:pop .6s cubic-bezier(.2,1.7,.4,1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line);display:grid;gap:4px}
.stat b{font:800 32px/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--primary)}
.stat span{font-size:13.5px;color:var(--muted);line-height:1.35}
.work{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;display:grid;gap:6px}
.clients{display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--toast-bg);color:var(--toast-ink);padding:12px 16px;border-radius:14px;font:600 14.5px/1.35 var(--f-body);max-width:min(92vw,420px);z-index:50;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .scr,.scr.enter,.scr.leave{transform:none!important;transition:opacity .01s!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div class="app" id="app" data-step="0">
  <header class="top">
    <nav class="mode" aria-label="Two views of one queue"><span id="m-wiz" aria-current="page">Wizard</span><a id="m-adv" href="approve.html">Advance</a></nav>
    <span class="smini" id="smini" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.6 2.2c.5 3-1 4.6-2.5 6.3-1.4 1.6-2.9 3.3-2.9 6A5.4 5.4 0 0 0 12.6 20a5.6 5.6 0 0 0 5.6-5.6c0-2.6-1.3-4.4-2.4-5.6-.2 1.5-.9 2.6-2 3.1.6-3.4-.2-7-1.2-9.7Z"/></svg><span id="smini-n">0</span></span>
  </header>
  <div class="prog" aria-hidden="true">
    <div class="trail"><span class="track"><i></i></span><span class="stop" data-n="1">1</span><span class="stop" data-n="2">2</span><span class="stop" data-n="3">3</span><span class="stop flag" data-n="4"><svg viewBox="0 0 24 24"><path d="M6 21V4m0 1h11l-2.5 4L17 13H6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span></div>
    <p><span id="plabel"></span><span class="psub" id="psub"></span></p>
  </div>
  <main class="screens" id="screens"></main>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';

  // The EN/VI switch, as on approve.html (owner, 16/10: English only for now). Both dictionaries stay in place.
  const LANG_SWITCH = false;

  const Q0 = new URLSearchParams(location.search);
  const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const API_ORIGIN = (() => {
    const raw = IS_LOCAL ? Q0.get('api') : '';
    if (!raw) return '';
    try {
      const u = new URL(raw);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.origin : '';
    } catch (e) { return ''; }
  })();
  const DEV = Q0.get('dev') === '1';
  const BASE = API_ORIGIN + '/app/dashboard' + (DEV ? '2' : '');
  const LANG_KEY = 'wc_report_lang'; // shared with report.html so one choice covers both pages
  const REFRESH_MS = 30000;
  const CLIENT_RE = /^[a-z0-9][a-z0-9_-]{0,63}$/;
  const BODY_MAX = 20000;     // solo_approvals: body_text and script_text
  const TITLE_MAX = 200;      // solo_approvals: title
  const CAPTION_MAX = 5000;   // the bridge refuses a longer caption when it approves a script
  const SCRIPT_RAW_MAX = 500; // production.go productionScriptHardMax: words counting links
  const CONFLICTS = ['stale_item', 'not_awaiting', 'already_decided'];
  const WRITING = ['picked', 'writing', 'image_pending'];
  const STOPPED = ['failed', 'needs_check', 'partial'];

  const I18N = {
    en: {
      title: 'Wizard | WideCast', mode_label: 'Two views of one queue',
      p_step1: 'Step 1/3 · Pick a problem', p_step2w: 'Step 2/3 · Writing the bundle', p_step2: 'Step 2/3 · Approve the bundle',
      p_step3: 'Step 3/3 · The video', p_done: 'Done for today',
      p_left3: '3 steps left', p_left2: '2 steps left', p_left1: '1 step left', p_left0: 'See you tomorrow',
      loading: 'Loading your day…',
      login_h: 'Sign in first', login_p: 'Sign in on the Approvals page, then come back here.',
      owner_only: 'This page is for the account owner. Sign in as the owner on the Approvals page.',
      open_adv: 'Open Approvals',
      off_h: 'The Wizard is not on for this account yet', off_p: 'Everything waits in Approvals, as before.',
      clients_h: 'Which business today?', clients_p: 'Pick one. You can switch any time.',
      top_eyebrow: 'Today · {d}', top_h: 'What is your audience asking most today?',

      h('h1', { class: 'status-line', text: waitLine(b) }),
      h('ul', { class: 'mini' }, rows.map((r) => h('li', null, h('span', { text: t(r[0]) }), stateChip(r[2], r[1])))),
      h('p', { class: 'calm', text: t('w_calm') })),
    btn(t('close_call'), 'pr big', closeApp));
  }
  function scrScenes() {
    const v = bundle(S.data).video, c = cardOf(v) || {};
    const watch = safeUrl(str(c.review_url)) || safeUrl(str(c.widecast_url));
    const k = ik(v);
    return section('scenes', [h('div', { class: 'gate-h' }, h('span', { class: 'eyebrow', text: t('sc_eyebrow') }), vsteps(2),
      h('h1', { class: 'h', text: t('sc_h') })),
    h('div', { class: 'cardline' }, h('p', { class: 'ttl', text: str(c.title) }),
      watch ? h('a', { class: 'btn gh', href: watch, target: '_blank', rel: 'noopener noreferrer', text: t('sc_view') }) : null),
    h('p', { class: 'note', text: t('sc_note') }), cardUi(v).err ? h('p', { class: 'err', text: cardUi(v).err }) : null],
    [btn(S.busy === k ? t('busy_h') : t('sc_ok'), 'pr big', () => decideProd(v, 'approve'), { disabled: S.busy !== '' }),
      watch ? h('a', { class: 'btn gh', href: watch, target: '_blank', rel: 'noopener noreferrer', text: t('sc_fix') }) : null]);
  }
  function scrPublish() {
    const v = bundle(S.data).video, c = cardOf(v) || {};
    const u = cardUi(v), k = ik(v);
    const src = safeUrl(str(c.video_url));
    return section('publish', [h('div', { class: 'gate-h' }, h('span', { class: 'eyebrow', text: t('pu_eyebrow') }), vsteps(3),
      h('h1', { class: 'h', text: t('pu_h') })),
    src ? h('video', { class: 'vid', src: src, controls: true, playsinline: true, preload: 'metadata' }) : null,
    h('p', { class: 'ttl', text: str(c.title) }), placesRow(v, u), u.err ? h('p', { class: 'err', text: u.err }) : null],
    [btn(S.busy === k ? t('busy_h') : t('pu_ok'), 'pr big', () => decideProd(v, 'approve'), { disabled: S.busy !== '' }),
      btn(t('pu_later'), 'ln', () => skipProd(v), { disabled: S.busy !== '' })]);
  }
  function scrProblem() {
    const b = bundle(S.data);
    const it = [b.video, b.post].find((x) => x && STOPPED.indexOf(x.state) >= 0) || b.video || b.post;
    const r = obj(it && it.row) || {};
    return section('problem', [h('div', { class: 'gate-h' }, h('h1', { class: 'h', text: t('pr_h') }),
      h('p', { class: 'sub', text: str(r.plain) || str(r.status_line) })),
    h('ul', { class: 'mini' }, [['k_post', b.post], ['k_video', b.video]].filter((x) => x[1]).map((x) => h('li', null, h('span', { text: t(x[0]) }), stateChip('p', x[1]))))],
    [r.can_retry ? btn(t('pr_retry'), 'pr big', () => decideRow(it, 'retry'), { disabled: S.busy !== '' }) : null,
      h('a', { class: 'btn gh', href: advHref(), text: t('open_adv') })]);
  }
  function scrAdvance() {
    return section('advance', h('div', { class: 'gate-h' }, h('h1', { class: 'h', text: t('adv_h') }), h('p', { class: 'sub', text: t('adv_p') })),
      h('a', { class: 'btn pr big', href: advHref(), text: t('open_adv') }));
  }

  // ── The round's result: the streak (days walked, never approvals), views and comments, the day's work.
  function enterResults() {
    const d = S.data;
    if (d && d.client && !d.done_today && S.doneSent !== d.day) {
      S.doneSent = d.day;
      api('/solo/wizard/day', { client: S.client, action: 'done', tz: tz() }).then(() => loadResults(true), () => loadResults(true));
    } else if (!S.res || S.res.day !== (d && d.day)) loadResults(false);
  }
  function loadResults(fresh) {
    return api('/solo/wizard/results', { client: S.client, tz: tz() }).then((res) => {
      if (!(res.ok && res.data && res.data.enabled)) return;
      S.res = res.data;
      if (S.data && fresh) { S.data.streak = res.data.streak; S.data.done_today = true; paintChrome(); }
      if (S.screen === 'results' || S.screen === 'none') { go(S.screen, false); if (S.screen === 'results' && fresh && !S.fx) { S.fx = true; confetti(); } }
    }, () => {});
  }
  function resultsBlock() {
    const r = S.res, sd = (r && obj(r.streak)) || (S.data && obj(S.data.streak)) || { days: 0, week: [] };
    const week = arr(sd.week).filter(obj).map((w) => {
      const s = w.state === 'today' && (sd.today_done || (S.data && S.data.done_today)) ? 'today-done' : str(w.state);
      return h('li', { 'data-s': s }, h('i', { text: s === 'done' || s === 'today-done' ? '✓' : '·' }), weekday(w.date));
    });
    const days = Number(sd.days) || 0;
    const kids = [h('div', { class: 'streak' },
      h('div', { class: 'big' }, h('b', { text: fmtNum(days) }), h('span', { text: days === 1 ? t('r_days_1') : t('r_days') })),
      week.length ? h('ol', { class: 'week', 'aria-label': t('week_aria') }, week) : null,
      sd.paused ? h('p', { class: 'note', text: t('r_paused') }) : null,
      h('p', { class: 'note', text: t('r_streak_note') }))];
    if (r) {
      kids.push(h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', { text: r.views_7d == null ? '·' : fmtNum(r.views_7d) }), h('span', { text: t('r_views') })),
        h('div', { class: 'stat' }, h('b', { text: r.comments_7d == null ? '·' : fmtNum(r.comments_7d) }), h('span', { text: t('r_replies') }))));
      const one = Number(r.scans) === 1;
      const work = r.posts_scanned != null && r.junk_filtered != null
        ? t(one ? 'r_work_1' : 'r_work', { p: fmtNum(r.posts_scanned), s: fmtNum(r.scans), j: fmtNum(r.junk_filtered) })
        : t(one ? 'r_work_some_1' : 'r_work_some', { s: fmtNum(r.scans), i: fmtNum(r.ideas) });
      kids.push(h('div', { class: 'work' }, h('span', { text: work }), h('span', { text: t('r_tomorrow') })));
      kids.push(h('a', { class: 'btn ln', href: advHref(), text: t('r_adv') }));
    }
    return kids;
  }
  function scrResults() {
    const quiet = arr(S.data && S.data.problems).length < 2;
    return section('results', [h('div', { class: 'res-hero' }, h('canvas', { id: 'fx', 'aria-hidden': 'true' }),
      h('span', { class: 'eyebrow', text: t('r_eyebrow') }), h('h1', { class: 'h', text: quiet ? t('r_h_quiet') : t('r_h') })),
    resultsBlock()],
    [btn(t('r_bye'), 'pr big', () => { leave(); toast(t('r_bye_t')); }),
      arr(S.data && S.data.problems).some((p) => obj(p) && !p.locked) ? btn(t('r_more'), 'ln', () => {
        api('/solo/wizard/day', { client: S.client, action: 'back', tz: tz() }).then(() => { S.sel = -1; load(true); });
      }) : null]);
  }
  // Only inside the results header, where nothing waits for a review; never on a busy phone setting.
  function confetti() {
    const c = document.getElementById('fx');
    if (!c || RM || typeof c.getContext !== 'function') return;
    const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const x = c.getContext('2d');
    if (!x || !r.width) return;
    c.width = r.width * dpr; c.height = r.height * dpr; x.scale(dpr, dpr);
    const colors = ['#2f66e8', '#ffc53d', '#1c9a66', '#d9435a'];
    const P = [];
    for (let i = 0; i < 70; i++) P.push({ x: r.width / 2, y: r.height * 0.55, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 7 - 3, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: colors[i % 4], s: 4 + Math.random() * 5 });
    let n = 0;
    (function f() {
      n++;
      x.clearRect(0, 0, r.width, r.height);
      P.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.985; p.a += p.va;
        x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - n / 85); x.fillStyle = p.c;
        x.beginPath();
        for (let i = 0; i < 5; i++) { const a = i * 1.2566 - 1.5708; x.lineTo(Math.cos(a) * p.s, Math.sin(a) * p.s); const q = a + 0.6283; x.lineTo(Math.cos(q) * p.s * 0.45, Math.sin(q) * p.s * 0.45); }
        x.closePath(); x.fill(); x.restore();
      });
      if (n < 85) window.requestAnimationFrame(f); else x.clearRect(0, 0, r.width, r.height);
    })();
  }

  // ── Open and closed: the server hears "open" with every load while the page is visible (so a call-back notice
  // waits), and "left" when it is hidden (so the next decision calls the Boss back).
  function leave() {
    if (!S.client || !session()) return;
    api('/solo/wizard/day', { client: S.client, action: 'left', tz: tz() }, true).catch(() => {});
  }
  function tick() {
    if (document.visibilityState === 'hidden' || S.editing() || S.loading) return;
    load(false);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') leave();
    else if (Date.now() - S.lastLoad > 15000) load(false);
  });
  window.addEventListener('pagehide', leave);

  const want0 = Q0.get('client');
  S.client = want0 && CLIENT_RE.test(want0) ? want0 : (lsGet('wc_wizard_client') || '');
  document.documentElement.lang = LANG;
  document.getElementById('m-wiz').textContent = 'Wizard';
  document.querySelector('nav.mode').setAttribute('aria-label', t('mode_label'));
  go(session() ? 'loading' : 'login', false);
  if (session()) load(true);
  S.timer = setInterval(tick, REFRESH_MS);
})();
</script>
