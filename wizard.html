<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef5ff">
<title>Wizard | WideCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* WideCast Wizard (2026-10-29), direction A "the path": the day is a board-game trail with three stops and a flag.
   One decision per screen, big thumb-reach buttons, chunky pressable buttons; motion only around the action, never
   over what is being reviewed, and never moving on by itself. */
:root{
 --page:#cfe2fa;--bg:#eef5ff;--surface:#ffffff;--ink:#13234a;--muted:#55678c;--line:#d3e0f4;--chip:#e2ecfb;
 --primary:#2f66e8;--primary-deep:#1d47b0;--on-primary:#ffffff;--sun:#ffc53d;--sun-deep:#d99a12;
 --s-wait:#8a5a00;--s-wait-bg:#fff1cc;--s-ok:#137a50;--s-ok-bg:#d8f5e7;--s-fix:#b42c45;--s-fix-bg:#ffe1e6;
 --s-busy:#1d47b0;--s-busy-bg:#dbe6ff;--s-you:#7a3fb0;--s-you-bg:#f1e4ff;--flame:#f08a1c;
 --toast-bg:#13234a;--toast-ink:#ffffff;--focus:#ffb000;
 --f-disp:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--f-body:"Be Vietnam Pro",system-ui,sans-serif;
 --r-card:22px;--r-btn:18px;--t-dur:.55s;--t-ease:cubic-bezier(.2,1.25,.35,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--primary-deep)}
.app{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;isolation:isolate}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.mode{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px}
.mode a,.mode span,.mode button{display:inline-flex;align-items:center;padding:0 14px;border:0;border-radius:999px;font:700 14px/1 var(--f-body);min-height:40px;color:var(--muted);text-decoration:none;background:none}
.mode span,.mode button{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.smini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:0;border-radius:999px;background:none;font:800 16px/1 var(--f-disp);color:var(--ink)}
.smini:hover,.menub:hover{background:var(--chip)}
.tright{display:inline-flex;align-items:center;gap:6px}
.menub{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:700 14px/1 var(--f-body)}
.menub svg{width:20px;height:20px}
.crow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));padding:0 4px 0 12px;border-radius:12px;background:var(--chip);font:600 14px/1.2 var(--f-body);color:var(--muted)}
.crow b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crow span{display:flex;gap:6px;min-width:0}
.crow .btn.ln{min-height:40px;font:700 14px var(--f-body)}
.dayb{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 0 12px;border-radius:12px;background:var(--chip);font:600 14px/1.2 var(--f-body);color:var(--muted)}
.dayb>span{display:flex;flex-wrap:wrap;gap:0 6px;min-width:0;padding:6px 0}.dayb b{color:var(--ink);font-weight:700}
.dayb .btn.ln{min-height:40px;font:700 14px var(--f-body);white-space:nowrap}
.week li.on i{outline:3px solid var(--primary);outline-offset:2px}
.rptabs{display:flex;flex-wrap:wrap;gap:6px}
.ps-tgn{display:block;font:600 12px/1.3 var(--f-body);color:var(--muted)}.ps-need{color:#8a5a00}
.ps-done{cursor:default;position:relative;isolation:isolate}.ps-done .vlink{margin-left:8px;font-size:13px}
.ps-nm1{display:flex;align-items:baseline;flex-wrap:wrap}.ps-nm .ps-nm1 span{font:inherit;color:inherit}
.where{display:grid;gap:4px}.where .mini li[data-s="fail"] .note{color:var(--bad,#b42c45)}
.vscript summary{cursor:pointer;font:700 14px/1.3 var(--f-body);color:var(--muted)}.vscript .txt{margin-top:6px}
.rpt{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:700 14px/1 var(--f-body)}
.rpt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rpt b{font-weight:800;opacity:.8}
.item .rpk{display:inline-flex;align-items:baseline;gap:8px;min-width:0}
.item .rpday{font:600 12.5px/1.2 var(--f-body);color:var(--muted)}
.item[data-s="fix"]{border-color:#f1b4c0;box-shadow:0 5px 0 #f1b4c0}
.cbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.cbtn .chip{flex:none}
.smini svg{width:20px;height:20px;color:var(--flame)}
/* the trail: three stops and the flag */
.prog{flex:none;padding:6px 22px 10px;display:grid;gap:8px}
.trail{position:relative;height:34px;display:flex;justify-content:space-between;align-items:center}
.trail .track{position:absolute;left:16px;right:16px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:repeating-linear-gradient(90deg,#b8cdee 0 10px,transparent 10px 18px)}
.trail .track i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--primary);border-radius:3px;transition:width .9s cubic-bezier(.3,1.2,.4,1)}
.stop{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #b8cdee;font:800 16px/1 var(--f-disp);color:var(--muted);transition:background .4s,border-color .4s,color .4s,transform .4s}
.stop svg{width:18px;height:18px}
.app[data-step="1"] .stop[data-n="1"],.app[data-step="2"] .stop[data-n="2"],.app[data-step="3"] .stop[data-n="3"]{border-color:var(--primary);color:var(--primary);transform:scale(1.15);box-shadow:0 0 0 6px rgba(47,102,232,.15)}
.app[data-step="2"] .stop[data-n="1"],.app[data-step="3"] .stop[data-n="1"],.app[data-step="3"] .stop[data-n="2"],.app[data-step="4"] .stop{background:var(--primary);border-color:var(--primary);color:#fff}
.app[data-step="4"] .stop.flag{background:var(--sun);border-color:var(--sun-deep);color:#3d2a00;transform:scale(1.2)}
.app[data-step="0"] .prog{display:none}
.prog p{display:flex;justify-content:space-between;gap:8px;font:700 14px/1.2 var(--f-body)}
.prog .psub{color:var(--muted);font-weight:600;text-align:right}
/* screens */
.screens{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform var(--t-dur) var(--t-ease),opacity calc(var(--t-dur)*.7) ease}
.scr.enter{transform:translateX(104%);opacity:0}
.scr.leave{transform:translateX(-30%) scale(.96);opacity:0;pointer-events:none}
.scr.back.enter{transform:translateX(-30%) scale(.96);opacity:0}
.scr.back.leave{transform:translateX(104%);opacity:0;z-index:2}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.dock{flex:none;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:8px;background:var(--bg);border-top:1px solid var(--line)}
.dock .hint{text-align:center;font-size:13.5px;color:var(--muted);font-weight:600}
.gate-h{display:grid;gap:8px}
.eyebrow{font:700 12.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h{font:800 30px/1.05 var(--f-disp);text-wrap:balance;color:var(--ink)}
.h.sm{font-size:24px;line-height:1.1}
.sub{font-size:16px;color:var(--muted);line-height:1.5}
.note{font-size:13.5px;color:var(--muted);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:0;border-radius:var(--r-btn);font:700 16px/1.1 var(--f-disp);text-decoration:none;text-align:center;transition:transform .08s ease,box-shadow .08s ease,opacity .2s}
.btn.big{min-height:62px;font-size:21px;width:100%}
.btn.pr{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 0 var(--primary-deep);margin-bottom:6px}
.btn.pr:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.gh{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 #c3d4ef;margin-bottom:4px}
.btn.gh:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #c3d4ef}
.btn.ln{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 6px;box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:0;padding:0 10px}
.acts{display:grid;gap:8px}
.acts>.btn.pr{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:700 12.5px/1.2 var(--f-body);white-space:nowrap;color:var(--s-wait);background:var(--s-wait-bg)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip[data-s="ok"]{color:var(--s-ok);background:var(--s-ok-bg)}
.chip[data-s="fix"]{color:var(--s-fix);background:var(--s-fix-bg)}
.chip[data-s="busy"]{color:var(--s-busy);background:var(--s-busy-bg)}
.chip[data-s="busy"]::before{animation:blink 1.1s ease-in-out infinite}
.chip[data-s="you"]{color:var(--s-you);background:var(--s-you-bg)}
.chip[data-s="mute"]{color:var(--muted);background:var(--chip)}
.chip.pop{animation:pop .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
/* top 3: stops on the trail */
.probs{display:grid;gap:14px;position:relative}
.probs::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;border-left:4px dashed #b8cdee;z-index:0}
.prob{position:relative;text-align:left;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-card);padding:16px 16px 14px 66px;display:grid;gap:7px;width:100%;box-shadow:0 5px 0 #d3e0f4}
.prob:nth-child(2){margin-left:10px;width:calc(100% - 10px)}
.prob .rank{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 20px/1 var(--f-disp);background:#fff;border:3px solid #b8cdee;color:var(--ink);z-index:1}
.prob .tag{justify-self:start;font:800 11.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--sun);color:#3d2a00}
.prob .ptitle{font:700 19px/1.25 var(--f-disp);text-wrap:balance}
.prob .sig{font-size:13.5px;line-height:1.45;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.prob .meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.prob .meter i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.prob .lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--s-ok)}
.prob .lock svg{width:16px;height:16px}
.prob[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 5px 0 var(--primary-deep)}
.prob.prep{opacity:.62;border-style:dashed;box-shadow:none;cursor:default}
.prob.prep .tag{background:var(--chip);color:var(--muted)}
.prob .pline{font-size:13.5px;font-weight:600;color:var(--muted)}
.prob .ago{justify-self:start;font:700 12.5px/1 var(--f-body);padding:5px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.prob[aria-pressed="true"] .rank{background:var(--primary);border-color:var(--primary);color:#fff}
.flagline{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font:700 14px/1.2 var(--f-body);color:var(--muted);padding-left:16px}
.flagline i{width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;color:#3d2a00;flex:none;box-shadow:0 4px 0 var(--sun-deep)}
.flagline svg{width:20px;height:20px}
.upd{font-size:13.5px;color:var(--muted)}
.langrow{display:flex;justify-content:center;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.langrow .btn.ln{min-height:32px;font:600 13.5px var(--f-body)}
.langrow{flex-wrap:wrap;column-gap:14px}
.langrow .lk{display:inline-flex;align-items:center;gap:4px}
.lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.lgrow .btn{min-height:34px}
.lgrow .note{flex-basis:100%;margin:0}
/* bundle */
.item{background:var(--surface);border-radius:var(--r-card);padding:16px;display:grid;gap:12px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);transition:border-color .3s,opacity .3s}
.item[data-s="ok"]{border-color:#9fdcc0;box-shadow:0 5px 0 #9fdcc0}
.item[data-s="mute"]{opacity:.7}
.item>header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font:800 13px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ttl{font:700 18px/1.3 var(--f-disp)}
.txt{font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ta{width:100%;min-height:150px;border:2px dashed var(--primary);border-radius:12px;padding:10px;background:var(--surface);font-size:16px;line-height:1.5;resize:vertical}
.pic{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--chip);display:block}
.quote{border-left:4px solid var(--line);padding:10px 12px;background:var(--chip);border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.5;display:grid;gap:4px;overflow-wrap:anywhere}
.quote .who{font-weight:700;font-size:13px;color:var(--ink)}
.self{display:grid;gap:8px;background:var(--s-you-bg);color:var(--s-you);padding:12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.45}
.places{display:flex;flex-wrap:wrap;gap:8px}
.place{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:700 14px/1 var(--f-body)}
.place[aria-pressed="true"]{border-color:var(--primary);background:var(--s-busy-bg);color:var(--primary-deep)}
.place:disabled{opacity:.5}
.vsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:700 12.5px/1 var(--f-body)}
.vsteps span{padding:6px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.vsteps span.now{background:var(--primary);color:var(--on-primary)}
.vsteps span.done{background:var(--s-ok-bg);color:var(--s-ok)}
.vsteps em{font-style:normal;color:var(--muted)}
.err{color:var(--s-fix);font-size:14px;font-weight:600}
.missing{opacity:.75}
/* waiting */
.wait-hero{display:grid;justify-items:center;gap:20px;text-align:center;padding-top:18px}
.status-line{font:800 27px/1.18 var(--f-disp);text-wrap:balance}
.walker{width:130px;height:130px;border-radius:50%;background:#dbe6ff;position:relative;display:grid;place-items:center}
.walker::before{content:"";position:absolute;inset:10px;border-radius:50%;border:4px dashed #9fb8ec}
.walker i{position:absolute;inset:0;animation:spin 3.2s linear infinite}
.walker i::after{content:"";position:absolute;left:50%;top:4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--primary);box-shadow:0 3px 0 var(--primary-deep)}
.walker svg{width:44px;height:44px;color:var(--primary)}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.mini li{display:grid;gap:4px;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;border:1px solid var(--line);text-align:left}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mact{display:inline-flex;align-items:center;gap:10px}
.views{display:flex;flex-wrap:wrap;gap:4px 16px}
.vlink{display:inline-flex;align-items:center;min-height:40px;font:700 14px/1.2 var(--f-body);color:var(--primary-deep);text-decoration:underline;text-underline-offset:3px}
.live{display:grid;gap:8px;background:var(--surface);border-radius:var(--r-card);padding:14px 16px;border:3px solid var(--line)}
.live h2{font:800 18px/1.2 var(--f-disp)}
.calm{font-size:15px;color:var(--muted);max-width:32ch}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sun);color:#3d2a00;border-radius:14px;padding:8px 8px 8px 14px;font-weight:700;font-size:14.5px}
.banner .btn{min-height:40px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--sun-deep);margin:0 0 3px}
/* gates */
.vid{display:block;width:min(64%,240px);aspect-ratio:9/16;max-width:100%;margin:0 auto;border-radius:20px;background:#0b1430}
.cardline{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-card);padding:16px;display:grid;gap:10px}
/* results */
.res-hero{position:relative;text-align:center;display:grid;gap:8px;padding:16px 0 4px}
.res-hero canvas{position:absolute;left:-20px;top:-10px;width:calc(100% + 40px);height:calc(100% + 20px);pointer-events:none}
.streak{display:grid;gap:12px;background:var(--surface);border-radius:var(--r-card);padding:16px;border:3px solid var(--line)}
.streak .big{display:flex;align-items:baseline;gap:10px}
.streak .big b{font:800 46px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.streak .big span{font:700 17px/1.2 var(--f-disp)}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week li{display:grid;justify-items:center;font:700 12px/1 var(--f-body);color:var(--muted)}
.week .wd{display:grid;justify-items:center;gap:6px;width:100%;min-height:58px;padding:4px 0;border:0;background:none;color:inherit;font:inherit}
.week button.wd{cursor:pointer}
.week button.wd:hover i{box-shadow:0 0 0 4px rgba(47,102,232,.15)}
.week li[data-s="future"]{opacity:.4}
.week li i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e2ecfb;border:3px solid #c9d8f0;font-style:normal;font-weight:800}
.week li[data-s="done"] i{background:var(--s-ok);border-color:var(--s-ok);color:#fff}
.week li[data-s="rest"] i{background:#fff;border-style:dashed}
.week li[data-s="stopped"] i{background:var(--s-fix);border-color:var(--s-fix);color:#fff}
.week li[data-s="stopped"]{color:var(--s-fix)}
.week li[data-s="today"] i{background:#fff;border-color:var(--sun-deep)}
.week li[data-s="today-done"] i{background:var(--s-ok);border-color:var(--s-ok);color:#fff;animation:pop .6s cubic-bezier(.2,1.7,.4,1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line);display:grid;gap:4px}
.stat b{font:800 32px/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--primary)}
.stat span{font-size:13.5px;color:var(--muted);line-height:1.35}
.work{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;display:grid;gap:6px}
.clients{display:grid;gap:12px}

  // view: a phone detail, an editor, an inner screen), the address of the entry before it (wcPrev) and, once left, its

  let wcPop = null;
  (() => {
    const H = window.history;
    if (!H || typeof H.pushState !== 'function') return;
    const push = H.pushState.bind(H), repl = H.replaceState.bind(H);
    const idx = () => (H.state && typeof H.state.wcIdx === 'number' ? H.state.wcIdx : 0);
    const mix = (st, i) => Object.assign({}, st && typeof st === 'object' ? st : {}, { wcIdx: i });

      H.pushState = function (st, ti, url) {
        try { H.scrollRestoration = 'manual'; } catch (e) { /* old browser */ }   // the page puts the place back itself

        S.sent[k] = { decision: 'posted', hash: hash };
        PS.posted = true;
        paintPost();
        return loadCount(true).then((cnt) => {
          const n = cnt ? Math.floor(Number(cnt.total) || 0) : 0, g = cnt ? Number(cnt.goal) || 0 : 0;
          toast(!cnt ? t('ps_posted_t0') : g ? t('ps_posted_t', { n: fmtNum(n), g: fmtNum(g) }) : t('ps_posted_tx', { n: fmtNum(n) }), 5000);
        });
      }
      PS.done = false;                                 // not made: the next Copy or Save tries again
      if (r.kind === 'auth') { closePost(); go('login', true); return undefined; }
      toast(r.kind === 'conflict' ? t('stale') : r.message);
      return undefined;
    });
    return PS.after;
  }
  // A stopped part: Try again is Retry's decision; I posted it takes it off today's path until "reopen" ships.
  function psRetry() {
    const it = PS.it;
    closePost();
    if (it) retryAll([it]);
  }
  function psStopDid() {
    const it = PS.it;
    closePost();
    if (it) stopSkip(it, true);
  }
  function psDone() {
    const it = PS.it;
    if (it) psPosted(it);
    closePost();
  }
  function closePost() {
    const d = psDlg;
    if (!d) return;
    if (typeof d.close === 'function' && d.open) d.close(); else { d.removeAttribute('open'); dropPost(d); }
  }
  function dropPost(d) {
    if (d.parentNode) d.parentNode.removeChild(d);
    if (psDlg !== d) return;
    psWatchStop(); psPgVisOff();
    clearTimeout(PS.payT); PS.pay = '';
    psDlg = null; PS.it = null; PS.set = null; PS.pg = null; PS.ac = null; PS.win = null;
    const after = PS.after;
    PS.after = null;
    if (after) after.then(() => load(true), () => load(true));
    const back = psBack;
    psBack = null;
    if (back && back.isConnected && typeof back.focus === 'function') { try { back.focus({ preventScroll: true }); } catch (e) { /* old browser */ } }
  }

  // ── Back to where I came from (owner rule 2026-11-17, BACK_NAV_AUDIT_2026-11-17.md). A screen opened from another one
  // (Show me on a ready part, the new-work banner from an inner screen, Replies, This week, a day of before) remembers
  // that screen and shows Back to it, at the place it was left; each such step is one step of the browser's history, so
  // the phone's back gesture does what Back does. A day's screen (top to results) comes back as the day is now (want).
  const INNER = ['replies', 'week'];
  function drillFrom(to) {
    const sc = screens.querySelector('.scr:not(.leave) .body');
    S.drill = { screen: S.screen, past: S.past, rp: S.rp, y: sc ? sc.scrollTop : 0, to: to, item: S.screen === 'item' ? S.itemKey : '' };
  }
  function wizPush(d) {
    S.trail.push(d);
    const day = d.to === 'past' && S.past ? str(S.past.day) : d.to === 'day' ? str(d.day) : '';
    const item = d.to === 'item' ? str(S.itemKey) : '';
    try { history.pushState({ wcIn: 'wz', n: S.hbase + S.trail.length, view: d.to, date: day, item: item }, '', d.to === 'day' ? dayUrl(d.day) : undefined); } catch (e) { /* no history */ }
  }
  // A step into an earlier day, reloaded (the trail is gone): Back is the browser's own step back, to the view before.
  function dayStep() {
    const h0 = history.state;
    return !!S.day && !S.trail.length && !!h0 && h0.wcIn === 'wz' && h0.view === 'day' && Number(h0.n) > 0;
  }
  function backTop(name) {
    const e = S.trail[S.trail.length - 1];
    return e && (e.to === name || (e.to === 'day' && e.day === S.day && (STEP[name] || 0) >= 1)) ? e : null;
  }
  function backLabel(name) {
    if (name === 'login') return t('back_site');
    if (name === 'clients' && S.prevClient) return t('clients_back', { c: S.prevClient });
    const e = backTop(name);
    if (!e) return dayStep() ? t('bk_back') : t('past_back');
    if (e.screen === 'week') return t('wk_back');
    if (e.to === 'day') return e.prevDay ? t('bk_day', { d: dayLabel(e.prevDay) }) : t('past_back');
    if (e.screen === 'item') return t('bk_back');
    if (e.screen === 'replies') return t('bk_replies');
    if (e.screen === 'past') return t('bk_day', { d: dayLabel(e.past && e.past.day) });
    return INNER.indexOf(name) >= 0 ? t('past_back') : t('bk_back');
  }
  // The header's Back (top-left): to the screen this one was opened from, else (an inner screen) to today.
  function headerBack() {
    if (S.screen === 'login') { location.href = '/'; return; }                      // the site's front page
    if (S.screen === 'clients' && S.prevClient) {                                   // the business that was open
      S.client = S.prevClient; S.prevClient = ''; lsSet('wc_wizard_client', S.client); S.data = null; S.sel = -1; S.selId = '';
      freshClient();
      S.restore = S.switchFrom || null; S.switchFrom = null; S.backNext = true;
      go('loading', true); load(true); return;
    }
    if (backTop(S.screen)) { wizBack(); return; }
    if (dayStep()) { history.back(); return; }                                      // wcPop shows the step before
    const rp = S.screen === 'replies';
    goHome();
    if (rp) load(false);
  }
  function backOr(fallback) { if (backTop(S.screen)) wizBack(); else fallback(); }
  function wizBack() {
    const st = history.state;
    if (st && st.wcIn === 'wz' && Number(st.n) === S.hbase + S.trail.length) { history.back(); return; }   // wcPop shows it
    wizPopNow();
  }
  function wizPopNow() {
    const e = S.trail.pop();
    S.backNext = true;
    if (!e) { go(session() ? want(S.data) : 'login', true); return; }
    const fromDay = e.to === 'day';
    if (fromDay) {                                    // back from an earlier day: the day it was opened from, as it was
      S.day = e.prevDay || ''; S.data = e.data || null; S.res = e.res || null; S.busy = '';
      S.sel = -1; S.selId = ''; S.leftId = '';
      setUrlDay(S.day);
      paintChrome();
    }
    S.past = e.past; S.rp = e.rp;
    const fromRp = S.screen === 'replies';
    let to = e.screen;
    if (to === 'item' && e.item && S.data && partByKey(e.item)) S.itemKey = e.item;   // back to the part that was open
    else if (INNER.indexOf(to) < 0 || (to === 'past' && !S.past) || (to === 'replies' && !S.rp)) to = session() ? (S.data ? want(S.data) : 'loading') : 'login';
    go(to, true);
    if (to === 'replies') loadReplies();
    else if (fromRp && !fromDay) load(false);         // S12: what was decided on Replies shows at once
    if (fromDay && session()) load(!S.data);
    const sc = screens.querySelector('.scr:not(.leave) .body');
    if (sc && e.screen === to) sc.scrollTop = e.y;
  }
  // Home, Sign out and Switch: every inner step is left, and the history steps written for them are taken back.
  function wizUnwind() {
    const st = history.state;
    const n = st && st.wcIn === 'wz' ? Number(st.n) || 0 : 0;
    S.trail = []; S.drill = null; S.hbase = 0;
    if (n > 0) { S.skipPop = true; try { history.go(-n); } catch (e) { S.skipPop = false; } }
  }
  wcPop = () => {
    if (S.skipPop) { S.skipPop = false; setUrlDay(S.day); return true; }
    const st = history.state;
    const n = st && st.wcIn === 'wz' ? Number(st.n) || 0 : 0;
    closeMenu();
    closeConnect();
    closeShare();
    const k = n - S.hbase;
    if (k < 0) {                                       // below the page's first step: a step of the page before a reload
      S.hbase = n; S.trail = []; S.drill = null; S.past = null; S.rp = null; S.backNext = true;
      const v = st && st.wcIn === 'wz' ? { view: str(st.view), date: str(st.date), item: str(st.item) } : { view: '', date: '' };
      if (urlDay() !== S.day) {                        // that step was on another day: that day's own answer first
        S.day = urlDay(); S.data = null; S.res = null; S.busy = ''; S.restore = v.view === 'day' ? null : v;
        go(session() ? 'loading' : 'login', true);
        if (session()) load(true);
        return true;
      }
      const day = v.view === 'past' && /^\d{4}-\d{2}-\d{2}$/.test(v.date);   // restoreView opens a day by its answer
      if (!(n > 0 && session() && S.client && (restoreView(v) || day))) go(session() ? want(S.data) : 'login', true);
      return true;
    }
    if (S.trail.length > k) { while (S.trail.length > k + 1) S.trail.pop(); wizPopNow(); return true; }
    if (!S.trail.length && n === 0 && INNER.concat(['item']).indexOf(S.screen) >= 0) { S.past = null; S.rp = null; S.backNext = true; go(session() ? want(S.data) : 'login', true); }
    else if (urlDay() !== S.day && session()) {       // forward into a step of another day: that day
      S.day = urlDay(); S.data = null; S.res = null; S.busy = '';
      go('loading', true); load(true);
    }
    return true;                                       // forward into a step of before: this screen stays
  };
  function restoreView(r) {
    if (r.view === 'week') { go('week', true); loadResults(false); return true; }
    if (r.view === 'replies') {
      S.rp = { client: S.client, items: null, failed: false, busy: '', act: '', err: Object.create(null), tab: '', keep: Object.create(null), copied: Object.create(null) };
      go('replies', true); loadReplies(); return true;
    }
    if (r.view === 'past' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) { openDay(r.date, true); return true; }  // a step of before 2026-11-19
    if (r.view === 'item' && r.item && partByKey(r.item)) { S.itemKey = r.item; go('item', true); return true; }
    return false;
  }
  (() => {
    const st = history.state;
    if (st && st.wcIn === 'wz') { S.restore = { view: str(st.view), date: str(st.date), item: str(st.item) }; S.hbase = Number(st.n) || 0; }
  })();


  // ── Open and closed: the server hears "open" with every load while the page is visible (so a call-back notice
  // waits), and "left" when it is hidden (so the next decision calls the Boss back).
  function leave() {
    if (!S.client || !session()) return;
    api('/solo/wizard/day', { client: S.client, action: 'left', tz: tz() }, true).catch(() => {});
  }
  function tick() {
    if (document.visibilityState === 'hidden' || S.editing() || S.loading) return;
    load(false);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') leave();
    else if (Date.now() - S.lastLoad > 15000) load(false);
  });
  window.addEventListener('pagehide', leave);

  const want0 = Q0.get('client');
  // Opened without ?client (a notice for several clients, a bookmark): the server opens the only client, or the picker
  // with the waiting ones marked; the last client is never reused silently, its decision may belong to another one.
  S.client = want0 && CLIENT_RE.test(want0) ? want0 : '';
  S.day = urlDay();                                     // 2026-11-19: a notice of another day opens that day
  document.getElementById('crow-b').addEventListener('click', switchClient);
  document.getElementById('m-wiz').addEventListener('click', goHome);
  document.getElementById('smini').addEventListener('click', openWeek);
  document.getElementById('menub').addEventListener('click', openMenu);
  document.getElementById('wbk').addEventListener('click', headerBack);
  document.documentElement.lang = LANG;
  document.getElementById('m-wiz').textContent = 'Wizard';
  document.querySelector('nav.mode').setAttribute('aria-label', t('mode_label'));
  go(session() ? 'loading' : 'login', false);
  if (session()) load(true);
  S.timer = setInterval(tick, REFRESH_MS);
})();
</script>
</body>
