# Playground — GET /v1/search (read, free). Synchronous, no polling.
endpoint:
  method: GET
  path: /v1/search
title: Search content
description: |
  Read-only, free. Search the account's content by keywords.
fields:
  - { name: q, type: text, label: "q — search keywords", required: true, placeholder: "real estate marketing" }
  - { name: limit, type: text, label: "limit (1–50)", required: false, placeholder: "10" }
poll_after_create:
  enabled: false
use_cases:
  - id: search
    title: "🔎 Search by keyword"
    description: "Find content whose body matches the keywords."
    request:
      q: "marketing tips"
      limit: 10
