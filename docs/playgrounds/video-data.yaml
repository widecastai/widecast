# Playground — POST /v1/video_data (SYNCHRONOUS, FREE).
# Reads structured scene data for a topic_id — data-first audit entry point.

endpoint:
  method: POST
  path: /v1/video_data

title: Read structured scene data (data-first audit/edit entry point)
description: |
  Synchronous, free. First step for data-first scene audit/edit — call
  this BEFORE /v1/modify_scene or /v1/scene_inspector. Returns full
  annotated segment dicts with stable-identity fields, Remotion spec
  metadata, and coordinate-space hints (720×1280 canvas vs 280×498
  legacy editor preview). `voice_file` is the stable per-scene UID;
  `segment.id` is only current display/order.

fields:
  - name: video_id
    type: text
    label: "video_id (topic_id — accepts widecast..., gubo..., or current ids)"
    required: true
    placeholder: "widecastABCDEFGHIJKL"

poll_after_create:
  enabled: false

use_cases:
  - id: read-video
    title: "📜 Audit a video — list every scene + Remotion spec status"
    description: "Paste a topic_id (the id returned by /v1/create_video) to see scene_identity, every scene's voice_file (stable UID), current mediaUrl/mediaType, narrator config, and remotion_spec_url (cache-busted) + remotion_spec_state (ready/missing/disabled). Spec content is NOT inlined — fetch remotion_spec_url only when state is ready and you need object boxes."
    request:
      video_id: "widecastABCDEFGHIJKL"
