# Playground — GET /v1/account (read, free). Synchronous, no polling.
endpoint:
  method: GET
  path: /v1/account
title: Account info
description: |
  Read-only, free. Your account profile, remaining credits, and connected platforms.
fields: []
poll_after_create:
  enabled: false
use_cases:
  - id: account
    title: "👤 Account info"
    description: "No params — returns plan, credits, industry, and connected platforms."
    request: {}
