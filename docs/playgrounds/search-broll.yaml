# Playground — POST /v1/search_broll (SYNCHRONOUS, FREE).
# Two modes: kind="video" (Pexels/Pixabay/Shutterstock stock CLIPS) or
# kind="image" (Google real PHOTOS). Returns a numbered thumbnail list the
# AI-agent flow can relay directly to the user as a picker.

endpoint:
  method: POST
  path: /v1/search_broll

title: Search stock B-roll (video clips or real photos)
description: |
  Synchronous, free. Search stock B-roll for a keyword. Use **kind=video**
  for stock clips (Pexels/Pixabay/Shutterstock — same engine as the
  broll.js Stock tab) or **kind=image** for real photos (Google — broll.js
  Photos tab). Returns a list with each result labeled by `number` so an
  AI agent can render a numbered thumbnail list for the user to pick by
  number.

  **Special**: when `keyword` is the exact single word `"grid"`
  (case-insensitive) AND `kind="video"`, the server skips
  Pexels/Pixabay/Shutterstock and returns WideCast's curated internal
  grid-background video list in the SAME `results[]` shape. Phrases like
  `"grid background"` still hit normal stock search.

fields:
  - name: keyword
    type: text
    label: "Keyword (1-3 words work best)"
    required: true
    placeholder: "umbrella rain"
  - name: kind
    type: select
    label: "kind — video (stock clips) or image (real photos)"
    required: true
    options: ["video", "image"]
  - name: ratio
    type: select
    label: "Ratio (only meaningful for kind=video)"
    options: ["portrait", "landscape", "square"]
  - name: limit
    type: text
    label: "Max results (1-20)"
    placeholder: "10"

poll_after_create:
  enabled: false

use_cases:
  - id: video-portrait
    title: "🎬 Stock video clips (portrait)"
    description: "Search Pexels + Pixabay + Shutterstock for portrait-ratio video clips matching a keyword. Returns up to `limit` results, each pre-numbered for an agent to render as a thumbnail picker."
    request:
      keyword: "umbrella rain"
      kind: "video"
      ratio: "portrait"
      limit: 10
  - id: real-photos
    title: "🖼️ Real photos (Google search)"
    description: "Search Google image search for real photos matching a keyword — best when the user wants a SPECIFIC real-world asset (landmark, product, person in the news)."
    request:
      keyword: "Eiffel Tower morning"
      kind: "image"
      limit: 8
  - id: curated-grid
    title: "🪟 Curated WideCast grid backgrounds (special `keyword=\"grid\"`)"
    description: "Single word `\"grid\"` + `kind=\"video\"` triggers the curated internal grid-background list — same result shape as normal stock search. Picked URL → /v1/modify_scene `field_name=\"mediaUrl\"` like any other clip. Note: `\"grid background\"` (multi-word) still hits normal stock search."
    request:
      keyword: "grid"
      kind: "video"
