# Playground — GET /v1/recommendations (read, free). Synchronous, no polling.
endpoint:
  method: GET
  path: /v1/recommendations
title: Recommended ideas
description: |
  Read-only, free. Recommended video ideas for an industry. `industry` falls
  back to your account industry. May be slow (LLM fallback when the catalog is empty).
fields:
  - { name: industry, type: text, label: "industry (optional)", required: false, placeholder: "Real Estate" }
  - { name: page, type: text, label: "page", required: false, placeholder: "0" }
poll_after_create:
  enabled: false
use_cases:
  - id: recommend
    title: "💡 Recommended ideas"
    description: "Get recommended ideas for an industry."
    request:
      industry: "Real Estate"
      page: 0
