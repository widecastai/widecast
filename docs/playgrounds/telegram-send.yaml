# Playground — POST /v1/telegram/send (SYNCHRONOUS, no credit).
# Self-notify: the request body never names a recipient — the chat_id is
# resolved server-side from the API key's connected Telegram account.

endpoint:
  method: POST
  path: /v1/telegram/send

title: Send a Telegram notification (self-notify)
description: |
  Synchronous, no credit. Push a notification to YOUR OWN connected
  Telegram chat. Requires `Connect Telegram` to have been completed at
  https://widecast.ai/#setup; if not, the response is `400
  telegram_not_connected` + the setup URL in details.

fields:
  - name: message
    type: textarea
    label: "Message (≤ 4000 bytes; ≤ 1024 bytes if photo/video set)"
    required: true
    placeholder: "Your video is ready to review!"
  - name: parse_mode
    type: select
    label: "Parse mode (optional)"
    options: ["", "HTML", "Markdown", "MarkdownV2"]
  - name: photo_url
    type: text
    label: "Photo URL (optional, mutually exclusive with video URL)"
    placeholder: "https://example.com/preview.jpg"
  - name: video_url
    type: text
    label: "Video URL (optional, mutually exclusive with photo URL)"
    placeholder: "https://example.com/clip.mp4"

poll_after_create:
  enabled: false

use_cases:
  - id: text
    title: "💬 Plain text notification"
    description: "Just push a text message to the user's own Telegram chat. The simplest mode — no formatting, no attachments."
    request:
      message: "Your video is ready to review! Open the dashboard to pick scenes."
  - id: html
    title: "✨ HTML-formatted message"
    description: "Use a small subset of HTML tags (`b`, `i`, `u`, `s`, `code`, `pre`, `a`) for emphasis or links. Other tags are stripped server-side."
    request:
      message: "<b>Render finished</b>\nOpen <a href='https://widecast.ai/'>WideCast</a> to publish."
      parse_mode: "HTML"
