# Playground — POST /v1/production_plan/add (SYNCHRONOUS, no credit).
# Queue a new idea/topic into the account's production plan. The account is
# resolved server-side from the API key — no company/user field in the body.

endpoint:
  method: POST
  path: /v1/production_plan/add

title: Add an idea to the production plan
description: |
  Synchronous, no credit. Queue a new idea/topic into the account's
  production plan (readable via GET /v1/production_plan). Use after
  /v1/collect_ideas or /v1/foundation_videos surfaces ideas, or whenever the
  user wants to save an idea to work on later. The entry lands with
  workflow_phase="queued" (or "ab_roll" when source="template" + a template
  is given). idea_text is required; topic_id auto-generates when omitted;
  industry falls back to the account's saved industry.

fields:
  - name: idea_text
    type: textarea
    label: "Idea text (required — the idea/topic line)"
    required: true
    placeholder: "Why estate planning matters for young families"
  - name: description
    type: textarea
    label: "Description (optional notes)"
    placeholder: "Hook on the 40% who die intestate; CTA to book a consult."
  - name: industry
    type: text
    label: "Industry (optional — falls back to account industry)"
    placeholder: "estate planning"
  - name: source
    type: text
    label: "Source (optional, default 'idea')"
    placeholder: "idea"
  - name: week_start
    type: text
    label: "week_start (optional unix seconds; defaults to now)"
    placeholder: "1782900000"
  - name: topic_id
    type: text
    label: "topic_id (optional — auto-generated if empty)"
    placeholder: ""
  - name: recommended
    type: boolean
    label: "recommended (badge this idea as your top pick in the plan list)"
  - name: scripts
    type: json
    label: "scripts[] — optional script attach: 1-5 {format, text}, formats VE/QA/POV/CS/MB unique, each text 80-1000 words"
    rows: 8
    placeholder: |
      [
        {"format": "VE", "text": "…full 80-1000 word script…"},
        {"format": "MB", "text": "…full 80-1000 word script…"}
      ]
  - name: recommended_format
    type: text
    label: "recommended_format (optional — which supplied format is the master; defaults to the first)"
    placeholder: "VE"
  - name: language
    type: text
    label: "language (optional — language of the attached scripts; defaults to account setting)"
    placeholder: "English"

poll_after_create:
  enabled: false

use_cases:
  - id: queue-idea
    title: "📝 Queue an idea into the plan"
    description: "Add a single idea. Returns {object:'production_plan_entry', added:true, topic_id, workflow_phase:'queued', industry, source, request_id}. Read it back with GET /v1/production_plan."
    request:
      idea_text: "Why estate planning matters for young families"
      description: "Hook on the 40% who die intestate; CTA to book a consult."
      source: "idea"
  - id: queue-idea-with-scripts
    title: "🎬 Queue a RECOMMENDED idea WITH pre-written scripts (Script ready)"
    description: "Script attach (A55): the idea lands already 'Script ready' — opening it in the dashboard goes straight into the Script Editor with the supplied versions selectable (no writing step, no credit). recommended:true adds a 'Recommended' badge in the plan list. Each text must be 80-1000 words; 409 topic_exists if the topic_id already has a video/script."
    request:
      idea_text: "3 estate-planning mistakes young parents make"
      recommended: true
      scripts:
        - format: "VE"
          text: "Three estate-planning mistakes I see young parents make every single week. Number one: they think a will is something you do at fifty. If you have a child and no will, a judge — not you — decides who raises them if the worst happens. Number two: they name godparents at church but never on paper. Courts do not care about ceremonies; they care about documents. Pick a guardian, write it down, tell them. Number three: they forget the beneficiary forms. Your 401k and life insurance skip the will entirely — whoever is on that form gets the money, even an ex. Twenty minutes fixes all three. Comment PLAN and I will send you the exact checklist I use with my own clients."
        - format: "MB"
          text: "You do not need a lawyer to protect your kids — you need a plan. Everyone tells young parents that estate planning means expensive attorneys and thick binders. Wrong. The three documents that matter most take one afternoon. A simple will names who raises your children — without it, a judge decides. A beneficiary check on your 401k and life insurance takes ten minutes online — and it overrides your will, which is why an ex-spouse still collects sometimes. A power of attorney means someone can pay your mortgage if you are in a hospital bed. Start with those three. A lawyer polishes a plan; the plan itself starts with you, today. Comment PLAN and I will send you the checklist my own clients use."
      recommended_format: "VE"
