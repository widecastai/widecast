# Playground manifest — POST /v1/upload_asset (SYNCHRONOUS, no credit).
# The playground UI uses the multipart variant (simpler UX); the JSON+base64
# variant is what the MCP tool dispatches through.

endpoint:
  method: POST
  path: /v1/upload_asset

title: Upload an audio / video / image / document (24-hour S3 URL)
description: |
  Synchronous, no credit. Upload an audio / video / image / document
  (HTML / PDF / Markdown) file and get back a public S3 URL valid for 24
  hours. Use the URL as `audio_url` / `video_url` on /v1/create_video,
  paste into `script_text` as an inline `![alt](url)` for images, or
  `curl <get_url>` to fetch a document body before passing it as
  blog_text / script_text. Server cap 500 MB.

fields:
  - name: file
    type: file
    label: "File (audio / video / image / HTML / PDF / Markdown, ≤500 MB)"
    required: true
    accept: "audio/*,video/*,image/*,.html,.htm,.pdf,.md,.markdown,text/html,application/pdf,text/markdown"
    placeholder: "Choose a file — uploaded as multipart/form-data."

poll_after_create:
  enabled: false

use_cases:
  - id: upload-asset
    title: "📎 Upload an asset (audio / video / image / document)"
    description: "Pick any audio (mp3 / wav / m4a), video (mp4 / mov / webm), image (jpg / png / webp), or document (html / pdf / md) file ≤ 500 MB. Click **Run** — the response carries a 24-hour public S3 URL you can pass into /v1/create_video as `audio_url` / `video_url`, paste into `script_text` as an inline `![alt](url)` for images, or `curl` the URL to read a document body for blog_text / script_text."
    request: {}
