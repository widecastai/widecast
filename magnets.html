<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<title>Your lead magnets | WideCast</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
--bg:#f5f5f2;--s1:#fdfdfb;--s2:#efefea;--s3:#e5e5df;--line:#e1e1da;--line-2:#d0d0c8;--field-ln:#8f908a;
--tx:#26272a;--tx-hi:#0e0f11;--tx-2:#4a4b47;--tx-3:#64655f;
--acc:#c6f135;--acc-hi:#b8e425;--acc-ink:#141a05;--acc-soft:#eef7cf;--acc-line:#c3dc72;--acc-tx:#46560a;--ring:#46560a;
--hot-bg:#fde7df;--hot-tx:#982b12;--hot-ln:#f3c2b2;--warm-bg:#fbefd3;--warm-tx:#774b00;--warm-ln:#ebd197;--watch-bg:#e5ebf9;--watch-tx:#2d4795;--watch-ln:#c3cff0;
--err-tx:#a0261a;--shadow:0 1px 2px rgba(14,15,17,.05);
--font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
--bg:#0e0f11;--s1:#16181b;--s2:#1c1f23;--s3:#262a30;--line:#25282d;--line-2:#34373e;--field-ln:#696c74;
--tx:#eceae4;--tx-hi:#f5f3ec;--tx-2:#b9b7af;--tx-3:#8f8d87;
--acc:#c6f135;--acc-hi:#d3f65c;--acc-ink:#141a05;--acc-soft:#1c230a;--acc-line:#46540f;--acc-tx:#c6f135;--ring:#c6f135;
--hot-bg:#2b1711;--hot-tx:#ffa189;--hot-ln:#5c2c1e;--warm-bg:#2a2111;--warm-tx:#f2c76a;--warm-ln:#5b4419;--watch-bg:#151d2f;--watch-tx:#a3b8ff;--watch-ln:#2d3c64;
--err-tx:#ffa189;--shadow:none}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;display:flex;flex-direction:column}
h1,h2,h3,p,ul,ol,dl,dd,blockquote{margin:0}
img,svg{display:block;max-width:100%}
a{color:var(--acc-tx);text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-80px;z-index:50;background:var(--acc);color:var(--acc-ink);padding:12px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:min(100% - 32px,720px);margin-inline:auto}
.ic{width:18px;height:18px;flex:none}
.ic-sm{width:16px;height:16px}

.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--tx-hi);text-decoration:none;font-weight:600;letter-spacing:-.01em}
.brand .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#0e0f11;border:1px solid var(--line)}
.brand img{width:24px;height:24px}
.hdr-r{display:flex;align-items:center;gap:4px;min-width:0}
.lang{display:inline-flex;padding:2px;border:1px solid var(--line-2);border-radius:12px;background:var(--s1)}
.lang button{min-width:44px;min-height:44px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--tx-2);font-size:.875rem;font-weight:600;letter-spacing:.02em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--tx-hi);color:var(--bg)}
.lang[hidden]{display:none}
/* Header (plan 13): the logo on the left, EN/VI on the right and, once the band has gone up, the slim row of steps
   between them; phones keep the logo's mark only */
@media (max-width:640px){.brand>span:not(.mark){display:none}}
@media (max-width:420px){.hdr-in{gap:8px}}

/* Main navigation (plan 13, 2026-10-16; the loop stepper of plan 12): a full-width band under the header, one step off
   the page (light: the light grey surface; dark: the slightly lighter one) with a 1px line above and below (the top one
   sits on the header's own line); the tiles keep their own surfaces. Scan, Report, Approve, Publish, Results and back
   to Scan, plus CRM & Library with its two links. The lit tile is the page you are on; a block that needs the Boss
   carries a red notification badge in its top-right corner (its exact count). Phones: one scrolling row of chips, the
   one that needs the Boss first. */
.stp-band{--stp-bg:var(--s2);margin-top:-1px;padding:16px 0 18px;background:var(--stp-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){.stp-band{--stp-bg:var(--s1)}}
#stp[hidden],#stp-mini[hidden]{display:none}
.stp ol{list-style:none;margin:0;padding:0}
.stp-loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stp-i{position:relative;display:flex;min-width:0}
.stp-i+.stp-i::before{content:"";position:absolute;left:-7px;top:50%;width:6px;height:6px;border-top:1.5px solid var(--tx-3);border-right:1.5px solid var(--tx-3);transform:translate(-70%,-50%) rotate(45deg)}
.stp-b{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--s1);color:var(--tx);text-decoration:none;box-shadow:var(--shadow);transition:background-color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.stp-b:hover{background:var(--s2);border-color:var(--line-2)}
.stp-b:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:14px}
.stp-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;min-width:0}
.stp-lbl{flex:0 1 auto;min-width:0;max-width:100%;font-size:.875rem;line-height:1.3;font-weight:600;color:var(--tx-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp-n{flex:none;min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;background:var(--s2);color:var(--tx-hi);font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stp-line{font-size:.75rem;line-height:1.4;color:var(--tx-3);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow-wrap:anywhere}
.stp-cur{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.stp-cur:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.stp-cur .stp-lbl{font-weight:800}
.stp-cur .stp-lbl,.stp-cur .stp-line{color:var(--acc-ink)}
.stp-cur .stp-n{background:var(--acc-ink);color:var(--acc)}
.stp-cur:focus-visible{outline-color:var(--tx-hi)}
.stp-att.stp-d1 .stp-top{padding-right:12px}.stp-att.stp-d2 .stp-top{padding-right:20px}.stp-att.stp-d3 .stp-top{padding-right:28px}.stp-att.stp-d4 .stp-top{padding-right:38px}
.stp-alert{position:absolute;top:-9px;right:-9px;z-index:1;min-width:22px;height:22px;padding:0 4px;border-radius:999px;display:inline-grid;place-items:center;background:#d92d20;color:#fff;font-size:.75rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;box-sizing:border-box;border:2px solid #fff;pointer-events:none}
.stp-alert.stp-pill{padding:0 7px}
.stp-back{position:relative;height:14px;margin:6px 10% 0;border:1.5px solid var(--line-2);border-top:0;border-radius:0 0 12px 12px}
.stp-back::before{content:"";position:absolute;left:-6px;top:-8px;border:5px solid transparent;border-bottom:8px solid var(--line-2);border-top:0}
.stp-back span{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:4px;padding:0 8px;background:var(--stp-bg,var(--bg));font-size:.75rem;line-height:1.5;color:var(--tx-3);white-space:nowrap}
.stp-back .ic{width:14px;height:14px}
.stp-cl{display:inline-block;max-width:14ch;padding:0 8px;border:1px solid var(--line-2);border-radius:999px;background:var(--s1);color:var(--tx-hi);font-size:.75rem;font-weight:600;line-height:18px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp-asset{margin-top:22px}
.stp-asset .stp-b{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 14px}
.stp-asset .stp-top{justify-content:flex-start;gap:8px}
.stp-asset .stp-line{flex:1 1 220px;-webkit-line-clamp:2;line-clamp:2}
.stp-box:hover{background:var(--s1);border-color:var(--line)}
.stp-box.stp-cur:hover{background:var(--acc);border-color:var(--acc)}
.stp-links{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.stp-go{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg);color:var(--tx-hi);font-size:.8125rem;font-weight:600;line-height:1.2;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.stp-go:hover{background:var(--s2)}
.stp-go:focus-visible,.stp-m:focus-visible{border-radius:999px}
.stp-cur .stp-go{border-color:var(--acc-ink);background:transparent;color:var(--acc-ink)}
.stp-cur .stp-go:hover{background:var(--acc-hi)}
.stp-cur .stp-go[aria-current="page"]{background:var(--acc-ink);color:var(--acc)}
.stp-chips{display:none}
/* The header's slim row (plan 13): the six steps between the logo and EN/VI once the band has gone up out of sight,
   gone again when the band is back. Its room in the header is always kept and it only fades and slides (opacity,
   transform), so nothing on the page moves. Phones: it scrolls sideways, the red badge first. */
.stp-mini{flex:1 1 0;min-width:0;display:flex;visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
.stp-mini.stp-on{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.stp-mrow{display:flex;gap:6px;min-width:0;max-width:100%;margin:0;padding:10px 10px 6px 4px;list-style:none;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stp-mrow::-webkit-scrollbar{display:none}
.stp-mrow li{flex:none;display:flex}
.stp-m{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--s1);color:var(--tx);text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.stp-m:hover{background:var(--s2)}
.stp-m .stp-lbl{font-size:.8125rem}
.stp-m.stp-cur{background:var(--acc);border-color:var(--acc)}
.stp-m.stp-cur:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.stp-m.stp-att.stp-d1{padding-right:18px}.stp-m.stp-att.stp-d2{padding-right:24px}.stp-m.stp-att.stp-d3{padding-right:32px}.stp-m.stp-att.stp-d4{padding-right:42px}
@media (max-width:599px){
  .stp-wide{display:none}
  .stp .stp-chips{display:flex;gap:10px;overflow-x:auto;margin:-12px -4px -4px;padding:12px 12px 4px 4px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .stp-chips::-webkit-scrollbar{display:none}
  .stp-chips li{flex:none;display:flex;align-items:center;scroll-snap-align:start}
  .stp-chips .stp-top{flex-wrap:nowrap}
  .stp-chips .stp-cl{line-height:30px;padding:0 10px;font-size:.8125rem}
  .stp-chips .stp-b{flex-direction:row;align-items:center;gap:8px;min-height:44px;padding:0 10px 0 14px;border-radius:999px;white-space:nowrap}
  .stp-chips .stp-att.stp-d1{padding-right:16px}  .stp-chips .stp-att.stp-d2{padding-right:22px}
  .stp-chips .stp-att.stp-d3{padding-right:30px}  .stp-chips .stp-att.stp-d4{padding-right:44px}
  .stp-chips .stp-att .stp-top{padding-right:0}
  .stp-mrow .stp-pri{order:-1}
}

main{flex:1;padding:28px 0 56px;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--s1);color:var(--tx-hi);font:500 .9375rem/1.2 var(--font);text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--s2)}
.btn-pr{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn-pr:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn:disabled{opacity:.6;cursor:default}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 12px;font-size:.875rem}
.btn-ln{border:0;background:none;min-height:44px;padding:0 6px;color:var(--acc-tx);font:500 .9375rem/1.2 var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.spin{width:16px;height:16px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.inp,.sel{display:block;width:100%;min-height:48px;padding:11px 14px;font-size:16px;color:var(--tx-hi);background:var(--s1);border:1px solid var(--field-ln);border-radius:12px}
.sel{appearance:auto}
.inp::placeholder{color:var(--tx-3)}
.inp:focus,.sel:focus{outline:2px solid var(--ring);outline-offset:1px}
.card-err{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--hot-bg);color:var(--hot-tx);font-size:.9375rem;margin-top:14px}
.state{max-width:440px;margin:24px auto 0}
.state h1{font-size:1.5rem;line-height:1.25;letter-spacing:-.02em;font-weight:600;color:var(--tx-hi)}
.state p.lead{margin-top:8px;color:var(--tx-2)}
.state .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.loading{display:flex;align-items:center;gap:10px;color:var(--tx-2);padding:40px 0}

.login{max-width:440px;margin:16px auto 0;padding:24px 20px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.login h1{font-size:1.5rem;line-height:1.25;letter-spacing:-.02em;font-weight:600;color:var(--tx-hi)}
.login .lead{margin-top:8px;color:var(--tx-2);font-size:.9375rem}
.login form{margin-top:20px}
.login label{display:block;font-size:.875rem;font-weight:600;color:var(--tx-hi);margin-bottom:6px}
.inp.code{font-size:1.5rem;letter-spacing:.45em;text-align:center;font-variant-numeric:tabular-nums;padding-left:calc(14px + .45em)}
.login .btn-pr{margin-top:14px}
.sent{padding:12px 14px;border-radius:12px;background:var(--s2);font-size:.9375rem;color:var(--tx-2)}
.sent b{color:var(--tx-hi);font-weight:600;overflow-wrap:anywhere}
.sent + label{margin-top:16px}
.err{margin-top:8px;font-size:.875rem;color:var(--err-tx)}
.note-ok{margin-top:8px;font-size:.875rem;color:var(--acc-tx)}
.login .row2{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;margin-top:10px}
.fine{margin-top:6px;font-size:.8125rem;color:var(--tx-3)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;padding:18px 0 calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:.8125rem;color:var(--tx-3);overflow-wrap:anywhere}
.foot .btn-ln{font-size:.8125rem;padding:0}
@media (min-width:768px){main{padding-top:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* A shell: begin (UX redesign A, 2026-10-18; byte-identical on every dashboard page, see ux_a/a_shell.css) */
.ax{display:flex;flex-direction:column;gap:16px}
.ax-sam{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);font-size:.875rem;line-height:1.45}
.ax-sam-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--acc)}
.ax-sam-txt{flex:1;min-width:0;color:var(--tx-2)}
.ax-sam-txt b{color:var(--tx-hi);font-weight:600}
.ax-sam-more{display:flex;flex-direction:column;gap:8px;padding:2px 0 0 18px}
.ax-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.ax-h1{margin:0;font-size:1.6rem;line-height:1.2;letter-spacing:-.02em;color:var(--tx-hi);font-weight:600}
.ax-count{color:var(--tx-3);font-size:.95rem}
.ax-top-r{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ax-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.82rem;color:var(--tx-3)}
.ax-meta a{color:var(--tx-2)}
.ax-lede{margin:0;color:var(--tx-2);font-size:.95rem;line-height:1.55}
.ax-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;position:relative}
.ax-chips::-webkit-scrollbar{display:none}
.ax-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--tx-2);font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.ax-chip[aria-pressed="true"]{background:var(--tx-hi);border-color:var(--tx-hi);color:var(--bg);font-weight:600}
.ax-chip:disabled{opacity:.5;cursor:default}
.ax-chip .ax-n{font-variant-numeric:tabular-nums}
.ax-lock{width:11px;height:11px;opacity:.75}
.ax-split{display:grid;grid-template-columns:minmax(0,236px) minmax(0,1fr);border:1px solid var(--line);border-radius:16px;background:var(--s1);overflow:clip;min-height:320px}
.ax-split.ax-wide{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.ax-list{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px;gap:2px;max-height:74vh;overflow-y:auto}
.ax-row{display:flex;align-items:flex-start;gap:10px;width:100%;padding:9px 8px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ax-row:hover{background:var(--s2)}
.ax-row[aria-current="true"]{background:var(--s3)}
.ax-row-ico{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx-2)}
.ax-row-ico svg{width:15px;height:15px}
.ax-row-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ax-row-k{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--tx-3);line-height:1.3}
.ax-row-k .ax-age{margin-left:auto;white-space:nowrap}
.ax-row-t{font-size:.86rem;font-weight:500;color:var(--tx-hi);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ax-row-s{font-size:.75rem;color:var(--tx-3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-hot{color:var(--hot-tx);font-weight:600}
.ax-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;margin-top:5px;background:var(--tx-3)}
.ax-dot.ok{background:#3fbf6f}.ax-dot.late{background:var(--warm-tx)}.ax-dot.down{background:var(--hot-tx)}
.ax-list-more{padding:8px 8px 6px 48px;font-size:.8rem;color:var(--tx-3)}
.ax-empty{padding:40px 16px;text-align:center;color:var(--tx-3);font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:12px}
.ax-det{display:flex;flex-direction:column;min-width:0}
.ax-det-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow-wrap:anywhere}
.ax-det-body a.lnk{display:inline-block;padding:7px 0}

    stpReveal(stpBox.querySelector('.stp-chips'));
    if (stpMini) {
      // the six steps, short (CRM for CRM & Library: the library is Results' page); on phones the red badge first
      const row = h('ol', { class: 'stp-mrow' });
      blocks.forEach((b) => row.appendChild(h('li', { class: stpAtt(b) ? 'stp-pri' : null },
        stpItem(b, st, cl, 'm', b.key === 'assets' ? 'crm' : b.key))));
      stpMini.setAttribute('aria-label', t('stp_mini'));
      stpPut(stpMini, [row]);
      stpMini.removeAttribute('hidden');
      stpReveal(row);
    }
    stpMiniSet();
    if (fk) { const el = document.querySelector('[data-stp="' + fk + '"]'); if (el) el.focus({ preventScroll: true }); }
  }
  // The header's slim row shows once the band has gone up out of sight and hides when the band is back in view. Its
  // room in the header is kept and it only fades and slides (opacity, transform), so nothing on the page moves.
  function stpMiniSet() {
    if (!stpMini) return;
    const on = stpOut && !!stpEl && !stpEl.hidden && !stpMini.hidden;
    if (on) stpMini.classList.add('stp-on'); else stpMini.classList.remove('stp-on');
  }
  function stpWatch() {
    if (!stpEl || !stpMini || typeof window.IntersectionObserver !== 'function') return;
    const io = new window.IntersectionObserver((entries) => {
      const e = entries[entries.length - 1];
      if (!e) return;
      const top = e.rootBounds ? e.rootBounds.top : 0;
      stpOut = !e.isIntersecting && e.boundingClientRect.bottom <= top + 1;   // gone up (never: still below)
      stpMiniSet();
    }, { rootMargin: '-' + Math.round((document.querySelector('header.hdr') || {}).offsetHeight || 0) + 'px 0px 0px 0px', threshold: 0 });
    io.observe(stpEl);
  }
  stpWatch();
  // This page's one /solo/coach/today call per page load (again only for another language, never by a search, the
  // client filter or "Show more"): the client in the address, or none and the server shows the one with the newest
  // activity. view "stepper": this page shows only the stepper, so no suggestion is recorded as shown.
  const STP_CLIENT = S.client;
  const STP = { key: '', data: null, cache: {} };
  function stpTz() {
    try {
      const z = Intl.DateTimeFormat().resolvedOptions().timeZone;
      return typeof z === 'string' && z.length <= 64 ? z : '';
    } catch (e) { return ''; }
  }
  function stpLoad() {
    const key = STP_CLIENT + '|' + LANG;
    if (STP.key === key) return;
    STP.key = key;
    if (STP.cache[key]) { STP.data = STP.cache[key]; stpRender(); return; }
    const body = STP_CLIENT ? { client: STP_CLIENT, lang: LANG, view: 'stepper' } : { lang: LANG, view: 'stepper' };
    const z = stpTz();
    if (z) body.tz = z;
    api('/solo/coach/today', body).then((res) => {
      if (STP.key !== key) return;
      const d = res && res.ok && obj(res.data) && res.data.object === 'solo_coach_suggest' && (!STP_CLIENT || res.data.client === STP_CLIENT) ? res.data : null;
      STP.data = d;                                   // null: the steps and their links, no numbers (a new sign-in asks again)
      if (d) STP.cache[key] = d;
      stpRender();
    }).catch(() => { if (STP.key === key) { STP.data = null; stpRender(); } });
  }
  function stpData() { return STP.data ? obj(STP.data.stepper) : null; }
  // Shown whenever the Boss is signed in (the sign-in form shows none of it); the client for links without an answer.
  function stpOn() { return S.mode !== 'login' && !!session(); }
  function stpClient() { return S.client; }
  // Lead magnets opens this page: stay here, at the top.
  function stpGo(ev, b, lit, tgt) {
    if (!tgt || tgt.path !== '/magnets.html') return;     // another page: the browser opens it
    ev.preventDefault();
    window.scrollTo(0, 0);
    const hd = app.querySelector('h1');
    if (hd) { hd.setAttribute('tabindex', '-1'); hd.focus({ preventScroll: true }); }
  }

  // ── Render
  function render() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-t-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.getAttribute('data-t-aria'))); });
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === LANG)));
    document.title = t('doc_title') + ' | WideCast';
    const out = [];
    if (S.mode === 'loading') out.push(h('div', { class: 'loading', role: 'status' }, spinner(), t('loading')));
    else if (S.mode === 'login') out.push(renderLogin());
    else if (S.mode === 'view') out.push(renderView());
    else out.push(h('section', { class: 'state', 'aria-labelledby': 'st-h' },
      h('h1', { id: 'st-h', text: t('err_h') }), h('p', { class: 'lead', role: 'alert', text: S.pageErr || t('err_p') }),
      h('div', { class: 'acts' }, h('button', { type: 'button', class: 'btn btn-pr', onclick: () => load() }, t('retry')))));
    app.replaceChildren.apply(app, out);
    renderFoot();
    if (S.mode === 'login' && S.login.focus) {
      S.login.focus = false;
      const f = app.querySelector(S.login.step === 1 ? '#lg-email' : '#lg-code');
      if (f) { f.focus(); if (S.login.err) f.select(); }
    }
    stpRender();                                     // the main navigation above the page
  }

  const num = (v) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : 0);
  const pct = (a, b) => (b > 0 ? Math.round(100 * a / b) + '%' : '–');
  const langOf = (code) => (str(code) ? str(code).toUpperCase() : t('other_lang'));

  // The view: the title with the client picker, what the numbers cover, the branded link, the totals, then one card per
  // magnet (its title and languages, its numbers, its leads in the CRM, its page, and its pages and languages).
  function renderView() {
    const d = S.data || {};
    const view = h('section', { class: 'mg-view', 'aria-labelledby': 'mg-h' });
    const head = h('div', { class: 'mg-head' }, h('h1', { id: 'mg-h', tabindex: '-1', text: t('h1') }));
    if (S.clients.length > 1) {
      const sel = h('select', { class: 'inp', 'aria-label': t('client_lbl'), onchange: (ev) => pickClient(ev.target.value) },
        S.clients.map((c) => h('option', { value: c, selected: c === S.client }, c)));
      head.appendChild(sel);
    }
    view.appendChild(head);
    view.appendChild(h('p', { class: 'mg-lead', text: t('lead', { d: fmtNum(num(d.days) || 30) }) }));
    const links = arr(d.links).filter(obj);
    view.appendChild(h('div', { class: 'mg-card mg-link', 'aria-label': t('link_h') },
      h('b', { text: t('link_h') + ':' }),
      links.length ? links.map((l) => h('span', null, h('span', { text: str(l.host) + ' ' }),
        h('span', { class: 'mg-pill' + (str(l.status) === 'ready' ? ' mg-ok' : ''), text: str(l.status) === 'ready' ? t('link_ready') : t('link_wait') })))
        : h('span', { text: t('link_none') })));
    const mags = arr(d.magnets).filter(obj);
    const tot = obj(d.totals) || {};
    if (mags.length) {
      view.appendChild(h('div', { class: 'mg-sum' },
        h('span', { class: 'mg-pill', text: t('tot_views', { n: fmtNum(num(tot.views)) }) }),
        h('span', { class: 'mg-pill', text: t('tot_emails', { n: fmtNum(num(tot.emails)) }) + ' · ' + pct(num(tot.emails), num(tot.views)) }),
        h('span', { class: 'mg-pill', text: t('tot_opened', { n: fmtNum(num(tot.opened)) }) }),
        h('span', { class: 'mg-pill', text: t('tot_leads', { n: fmtNum(num(tot.leads)) }) })));
      mags.forEach((m) => view.appendChild(renderMagnet(m)));
    } else {
      view.appendChild(h('section', { class: 'state' }, h('h2', { text: t('empty_h') }), h('p', { class: 'lead', text: t('empty_p') })));
    }
    return view;
  }
  function renderMagnet(m) {
    const pages = arr(m.pages).filter(obj);
    const card = h('article', { class: 'mg-card', 'data-magnet': str(m.magnet_id) });
    const st = str(m.status);
    card.appendChild(h('div', { class: 'mg-title' }, str(m.title) || str(m.magnet_id),
      arr(m.languages).filter((x) => typeof x === 'string').map((lg) => h('span', { class: 'mg-pill mg-lang', text: lg })),
      st && st !== 'live' ? h('span', { class: 'mg-pill mg-lang', text: t('st_' + st) || st }) : null));
    card.appendChild(h('div', { class: 'mg-meta', text: [str(m.magnet_id), pages.length > 1 ? t('pages_n', { n: fmtNum(pages.length) }) : '',
      num(m.leads) === 1 ? t('leads_1') : t('leads_n', { n: fmtNum(num(m.leads)) })].filter(Boolean).join(' · ') }));
    const stat = (k, v) => h('div', { class: 'mg-num' }, h('b', { text: v }), h('span', { text: t(k) }));
    card.appendChild(h('div', { class: 'mg-nums' }, stat('n_views', fmtNum(num(m.views))), stat('n_emails', fmtNum(num(m.emails))),
      stat('n_rate', pct(num(m.emails), num(m.views))), stat('n_opened', fmtNum(num(m.opened)))));
    const page = safeUrl(str(m.page_url));
    card.appendChild(h('div', { class: 'mg-acts' },
      h('a', { class: 'btn', href: pageHref('/crmstore.html', { client: S.client, magnet: str(m.magnet_id) }) }, t('leads_link')),
      // an email to this magnet's leads: broadcast.html opens a new email with this magnet already ticked
      num(m.leads) ? h('a', { class: 'btn btn-pr', href: pageHref('/broadcast.html', { client: S.client, magnet: str(m.magnet_id) }) }, t('new_email')) : null,
      page ? h('a', { class: 'btn', href: page, target: '_blank', rel: 'noopener noreferrer' }, t('open'), icon('ext', 'ic-sm')) : null));
    if (pages.length > 1) {
      const det = h('details', { class: 'mg-pages' }, h('summary', { text: t('pages_h') }));
      pages.forEach((p) => {
        const href = safeUrl(str(p.page_url));
        det.appendChild(h('div', { class: 'mg-page' },
          h('span', { class: 'mg-pill mg-lang', text: langOf(p.language) }),
          h('span', null, href ? h('a', { href: href, target: '_blank', rel: 'noopener noreferrer', text: str(p.page_url) }) : str(p.magnet_id),
            h('div', { class: 'mg-meta', text: [str(p.magnet_id), t(p.kind === 'hosted' ? 'k_hosted' : 'k_embed'), p.joined ? t('joined') : ''].filter(Boolean).join(' · ') })),
          h('span', { class: 'mg-pn', text: t('p_nums', { v: fmtNum(num(p.views)), e: fmtNum(num(p.emails)), l: fmtNum(num(p.leads)) }) })));
      });
      card.appendChild(det);
    }
    return card;
  }

  function renderLogin() {
    const L = S.login;
    const errId = 'lg-err';
    const card = h('section', { class: 'login', 'aria-labelledby': 'lg-h' },
      h('h1', { id: 'lg-h', text: t('login_h') }),
      h('p', { class: 'lead', text: L.ownerOnly ? t('login_owner_only') : (L.expired ? t('login_expired') : t('login_p')) }));
    if (L.step === 1) {
      const inp = h('input', { id: 'lg-email', class: 'inp', type: 'email', name: 'email', autocomplete: 'email', inputmode: 'email', autocapitalize: 'off', spellcheck: 'false', required: true, value: L.email, 'aria-invalid': L.err ? 'true' : null, 'aria-describedby': L.err ? errId : null, disabled: L.busy });
      inp.addEventListener('input', () => { L.email = inp.value; });
      card.appendChild(h('form', { novalidate: true, onsubmit: (ev) => { ev.preventDefault(); L.email = inp.value; sendCode(false); } },
        h('label', { for: 'lg-email', text: t('email') }), inp,
        L.err ? h('p', { id: errId, class: 'err', role: 'alert', text: L.err }) : null,
        h('button', { type: 'submit', class: 'btn btn-pr btn-block', disabled: L.busy }, L.busy ? [spinner(), t('sending')] : t('send_code'))));
    } else {
      const inp = h('input', { id: 'lg-code', class: 'inp code', type: 'text', name: 'code', inputmode: 'numeric', autocomplete: 'one-time-code', pattern: '[0-9]*', value: L.code, 'aria-invalid': L.err ? 'true' : null, 'aria-describedby': 'lg-sent' + (L.err ? ' ' + errId : ''), disabled: L.busy });
      inp.addEventListener('input', () => {
        const val = inp.value.replace(/\D/g, '').slice(0, 6);
        if (val !== inp.value) inp.value = val;
        L.code = val;
        if (val.length === 6) verifyCode();
      });
      card.appendChild(h('form', { novalidate: true, onsubmit: (ev) => { ev.preventDefault(); L.code = inp.value.replace(/\D/g, '').slice(0, 6); verifyCode(); } },
        h('p', { id: 'lg-sent', class: 'sent' }, t('code_sent') + ' ', h('b', { text: L.email })),
        h('label', { for: 'lg-code', text: t('code_lbl') }), inp,
        L.err ? h('p', { id: errId, class: 'err', role: 'alert', text: L.err }) : null,
        L.note ? h('p', { class: 'note-ok', role: 'status', text: L.note }) : null,
        h('button', { type: 'submit', class: 'btn btn-pr btn-block', disabled: L.busy }, L.busy ? [spinner(), t('verifying')] : t('verify')),
        h('div', { class: 'row2' },
          h('button', { type: 'button', class: 'btn-ln', disabled: L.busy, onclick: () => sendCode(true) }, t('resend')),
          h('button', { type: 'button', class: 'btn-ln', disabled: L.busy, onclick: () => { L.step = 1; L.err = ''; L.note = ''; L.focus = true; render(); } }, t('change_email'))),
        h('p', { class: 'fine', text: t('spam_hint') })));
    }
    return card;
  }

  function renderFoot() {
    const s = session();
    const parts = [h('span', { text: t('private_note') })];
    if (s && S.mode !== 'login') {
      parts.push(h('span', null, t('signed_in', { e: s.user_email }) + ' ', h('button', { type: 'button', class: 'btn-ln', onclick: () => showLogin(false) }, t('other_email'))));
    }
    foot.replaceChildren.apply(foot, parts);
  }

  // The EN/VI switch is in the page only when LANG_SWITCH is on; otherwise it leaves (and so does a header box it emptied).
  (() => {
    const g = document.querySelector('.lang');
    if (!g) return;
    if (LANG_SWITCH) { g.removeAttribute('hidden'); return; }
    const box = g.parentElement;
    g.remove();
    if (box && box.classList.contains('hdr-r') && !box.children.length) box.remove();
  })();
  document.querySelectorAll('.lang button').forEach((b) => {
    b.addEventListener('click', () => {
      const next = b.getAttribute('data-lang');
      if (next === LANG) return;
      LANG = next;
      lsSet(LANG_KEY, LANG);
      render();
      if (STP.key) stpLoad();                         // the steps' lines in the new language (once per language)
    });
  });

  function boot() {
    render();
    load();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script src="/office/link.js?v=1" defer></script>
</body>
