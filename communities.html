/* Communities (2026-11-11): the group posts page's look (tokens, header, sign-in), for the Boss's own groups. */
:root{color-scheme:light;
--bg:#f5f5f2;--s1:#fdfdfb;--s2:#efefea;--s3:#e5e5df;--line:#e1e1da;--line-2:#d0d0c8;--field-ln:#8f908a;
--tx:#26272a;--tx-hi:#0e0f11;--tx-2:#4a4b47;--tx-3:#64655f;
--acc:#c6f135;--acc-hi:#b8e425;--acc-ink:#141a05;--acc-soft:#eef7cf;--acc-line:#c3dc72;--acc-tx:#46560a;--ring:#46560a;
--hot-bg:#fde7df;--hot-tx:#982b12;--hot-ln:#f3c2b2;--warm-bg:#fbefd3;--warm-tx:#774b00;--warm-ln:#ebd197;--watch-bg:#e5ebf9;--watch-tx:#2d4795;--watch-ln:#c3cff0;
--ok-bg:#e3f3e1;--ok-tx:#1f6a24;--ok-ln:#b8dcb4;
--err-tx:#a0261a;--shadow:0 1px 2px rgba(14,15,17,.05);
--font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
--bg:#0e0f11;--s1:#16181b;--s2:#1c1f23;--s3:#262a30;--line:#25282d;--line-2:#34373e;--field-ln:#696c74;
--tx:#eceae4;--tx-hi:#f5f3ec;--tx-2:#b9b7af;--tx-3:#8f8d87;
--acc:#c6f135;--acc-hi:#d3f65c;--acc-ink:#141a05;--acc-soft:#1c230a;--acc-line:#46540f;--acc-tx:#c6f135;--ring:#c6f135;
--hot-bg:#2b1711;--hot-tx:#ffa189;--hot-ln:#5c2c1e;--warm-bg:#2a2111;--warm-tx:#f2c76a;--warm-ln:#5b4419;--watch-bg:#151d2f;--watch-tx:#a3b8ff;--watch-ln:#2d3c64;
--ok-bg:#132514;--ok-tx:#8fd894;--ok-ln:#2b4d2d;
--err-tx:#ffa189;--shadow:none}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,p,ul,ol{margin:0}
img,svg,video{display:block;max-width:100%}
a{color:var(--acc-tx);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:min(100% - 32px,760px);margin-inline:auto}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--tx-hi);text-decoration:none;font-weight:600;letter-spacing:-.01em}
.brand .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#0e0f11;border:1px solid var(--line)}
.brand img{width:24px;height:24px}
.hdr-r{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-links{display:flex;gap:4px}
.hdr-links a{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:10px;color:var(--tx-2);text-decoration:none;font-size:.875rem;font-weight:500}
.hdr-links a:hover{background:var(--s2);color:var(--tx-hi)}
@media (max-width:560px){.brand>span:not(.mark){display:none}.hdr-links a{padding:0 8px}}
main{flex:1;padding:24px 0 64px;outline:none}
.foot{padding:20px 0 32px;color:var(--tx-3);font-size:.8125rem}
h1.pg{font-size:1.5rem;line-height:1.25;font-weight:600;color:var(--tx-hi);letter-spacing:-.015em}
.sub{color:var(--tx-2);margin-top:4px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.0625rem;font-weight:600;color:var(--tx-hi);line-height:1.3}
.card .hint{color:var(--tx-3);font-size:.875rem;margin-top:2px}
.note{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--s2)}
.note.warn{background:var(--warm-bg);border-color:var(--warm-ln);color:var(--warm-tx)}
.note.bad{background:var(--hot-bg);border-color:var(--hot-ln);color:var(--hot-tx)}
.note.good{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-tx)}
.note b{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--s1);color:var(--tx-hi);font:500 .9375rem/1.2 var(--font);text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--s2)}
.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed}
.btn.disabled{pointer-events:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.pri:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.dark{background:var(--tx-hi);border-color:var(--tx-hi);color:var(--bg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx-2)}
.btn.ghost:hover{background:var(--s2)}
.btn.danger{color:var(--err-tx)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem;border-radius:10px}
.btn.wide{width:100%}
label.lbl{display:block;font-size:.875rem;font-weight:600;color:var(--tx-hi);margin:14px 0 6px}
.field{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--field-ln);border-radius:12px;background:var(--bg);color:var(--tx-hi)}
textarea.field{min-height:200px;resize:vertical;line-height:1.55}
select.field{padding-right:28px}
.field:focus{outline:2px solid var(--ring);outline-offset:1px}
.small{font-size:.8125rem;color:var(--tx-3)}
.err{color:var(--err-tx);font-size:.875rem;margin-top:8px}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);background:var(--s2);color:var(--tx-2)}
.pill.wait{background:var(--warm-bg);border-color:var(--warm-ln);color:var(--warm-tx)}
.pill.sent{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-tx)}
.pill.live{background:var(--watch-bg);border-color:var(--watch-ln);color:var(--watch-tx)}
.pill.no{background:var(--hot-bg);border-color:var(--hot-ln);color:var(--hot-tx)}
.list{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0}
.item{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--s1);cursor:pointer;color:var(--tx);min-width:0}
.item:hover{background:var(--s2);border-color:var(--line-2)}
.item .t{font-weight:600;color:var(--tx-hi);overflow-wrap:anywhere}
.item .m{font-size:.8125rem;color:var(--tx-3)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-width:0}
.chk:hover{border-color:var(--line-2)}
.chk input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--acc-tx)}
.chk .t{font-weight:600;color:var(--tx-hi);overflow-wrap:anywhere}
.chk .m{font-size:.8125rem;color:var(--tx-3)}
.chks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.big{font-size:2.25rem;line-height:1.1;font-weight:600;color:var(--tx-hi);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin-top:12px;font-size:.9375rem}
.kv .v{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx-hi);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--s1);color:var(--tx);font-size:.875rem;cursor:pointer}
.chip code{font-family:var(--mono);font-size:.75rem;color:var(--tx-3)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.media .m1{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);min-width:0}
.media img,.media video{width:100%;height:110px;object-fit:cover;background:var(--s3)}
.media .cap{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;font-size:.75rem;color:var(--tx-3)}
.media .cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
.grp .n{flex:1 1 auto;min-width:0}
.grp .n b{display:block;color:var(--tx-hi);overflow-wrap:anywhere}
.grp select{width:auto;min-height:36px;padding:4px 8px;border-radius:10px}
.caps{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.9375rem}
.caps input{width:64px;min-height:40px;text-align:center;padding:6px}
.tbl{width:100%;border-collapse:collapse;font-size:.875rem;margin-top:10px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--tx-2);font-weight:600}
.scroll{overflow-x:auto}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.login{max-width:420px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:var(--tx-hi);color:var(--bg);font-size:.9375rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.reach{display:flex;flex-wrap:wrap;gap:6px}
.reach .chip{text-decoration:none;color:var(--tx-2)}
.reach .chip.on{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc-tx);font-weight:600}
.dr{display:flex;flex-direction:column;gap:10px}
.drw{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:620px){.drw{grid-template-columns:1fr}}
.pic{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--s3)}
.pic.empty{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;font-size:.875rem;color:var(--tx-2)}
.drt textarea.field{min-height:220px}
.srcs{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.thumb{width:44px;height:55px;object-fit:cover;border-radius:8px;flex:none;background:var(--s3)}
.warnm{color:var(--warm-tx)!important}
h2.h2{font-size:1.0625rem;font-weight:600;color:var(--tx-hi);line-height:1.3}
</style>
</head>

  function sendCode() {

    L.email = email; L.busy = true; L.err = ''; render();
    checkUser({ email: email, user_location: '' }).then((res) => {
      L.busy = false;
      if (res.status === 200 && res.data && res.data.success) { L.step = 2; L.code = ''; }

      render();

  function formOf(c) {
    return { id: c.id, name: str(c.name), focus: str(c.focus), include: arr(c.include).join('\n'), exclude: arr(c.exclude).join('\n'),
      keywords: arr(c.keywords).join(', '), language: str(c.language) || 'en', tone: str(c.tone),
      sources: arr(c.sources).map((g) => g.key), destinations: arr(c.destinations).map((g) => g.key),
      posts_per_day: num(c.posts_per_day) || 1, window_start: num(c.window_start), window_end: num(c.window_end) || 21,
      tz: str(c.tz), buffer_days: num(c.buffer_days) || 5, status: str(c.status) || 'active' };
  }
  function newCm() { stopPoll(); S.cm = null; S.form = blankForm(); S.view = 'edit'; S.err = ''; render(); syncUrl(); }
  function openCm(id) {
    stopPoll();
    S.busy = 'open'; render();
    api('/solo/communities/get', { client: S.client, id: id }).then((res) => {
      S.busy = '';
      if (authFailed(res)) { showLogin(); return; }
      if (!res.ok || !res.data) { S.view = 'list'; render(); toast(msgOf(res)); return; }
      S.cm = res.data; S.form = formOf(res.data); S.edits = {}; S.view = 'edit'; S.err = '';
      render(); syncUrl(); maybePoll();
    }).catch(() => { S.busy = ''; render(); toast(t('net_err')); });
  }
  function reloadCm() {
    if (!S.cm || !S.cm.id) return Promise.resolve();
    return api('/solo/communities/get', { client: S.client, id: S.cm.id }).then((res) => { if (res.ok && res.data && S.cm && S.cm.id === res.data.id) S.cm = res.data; });
  }
  function maybePoll() {
    const busy = S.cm && arr(S.cm.drafts).some((d) => d.image_state === 'making');
    if (!busy) { stopPoll(); return; }
    if (pollTimer) return;
    // Only the pictures and their buttons change in place: a text being typed is never redrawn.
    pollTimer = setInterval(() => { if (document.hidden) return; reloadCm().then(() => { patchPictures(); if (!arr(S.cm && S.cm.drafts).some((d) => d.image_state === 'making')) stopPoll(); }); }, POLL_MS);
  }
  function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function patchPictures() {
    arr(S.cm && S.cm.drafts).forEach((d) => {
      const pic = document.getElementById('pic-' + d.id), busy = S.busy === 'd:' + d.id;
      if (pic && pic.getAttribute('data-st') !== d.image_state) pic.replaceWith(imageBox(d));
      const ap = document.getElementById('ap-' + d.id), np = document.getElementById('np-' + d.id);
      if (ap) ap.disabled = busy || d.image_state !== 'ready';
      if (np) np.disabled = busy || d.image_state === 'making';
    });
  }
  const lines = (v) => str(v).split('\n').map((x) => x.trim()).filter(Boolean);
  function saveForm() {
    const f = S.form;
    const body = { client: S.client, name: f.name, focus: f.focus, include: lines(f.include), exclude: lines(f.exclude),
      keywords: str(f.keywords).split(/[,\n]/).map((x) => x.trim()).filter(Boolean), language: f.language, tone: f.tone,
      sources: f.sources.slice(), destinations: f.destinations.slice(), posts_per_day: f.posts_per_day, window_start: f.window_start,
      window_end: f.window_end, tz: f.tz, buffer_days: f.buffer_days, status: f.status };
    if (f.id) body.id = f.id;
    S.busy = 'save'; S.err = ''; render();
    api('/solo/communities/save', body).then((res) => {
      S.busy = '';
      if (authFailed(res)) { showLogin(); return; }
      if (!res.ok || !res.data) { S.err = msgOf(res); render(); return; }
      toast(t('saved'));
      return refreshState().then(() => openCm(res.data.id));
    }).catch(() => { S.busy = ''; S.err = t('net_err'); render(); });
  }
  function decide(d, action, extra) {
    const body = Object.assign({ client: S.client, id: d.id, action: action }, extra || {});
    S.busy = 'd:' + d.id; render();
    api('/solo/communities/draft', body).then((res) => {
      S.busy = '';
      if (authFailed(res)) { showLogin(); return; }
      if (!res.ok) { toast(msgOf(res)); render(); return; }
      delete S.edits[d.id];
      toast(t('done_' + action));
      reloadCm().then(() => { render(); maybePoll(); });
    }).catch(() => { S.busy = ''; toast(t('net_err')); render(); });
  }
  function boxText(d) { const el = document.getElementById('t-' + d.id); return el ? el.value : (S.edits[d.id] != null ? S.edits[d.id] : str(d.text)); }
  function imageBox(d) {
    if (d.image_state === 'ready' && d.image_url) return h('img', { class: 'pic', id: 'pic-' + d.id, 'data-st': 'ready', src: d.image_url, alt: t('pic_alt', { t: str(d.topic) }), loading: 'lazy' });
    const why = d.image_state === 'making' ? t('img_making') : d.image_state === 'no_credit' ? t('img_no_credit') : t('img_failed');
    return h('div', { class: 'pic empty', id: 'pic-' + d.id, 'data-st': str(d.image_state), role: 'status' }, d.image_state === 'making' ? [spinner(), ' ', why] : why);
  }
  function draftCard(d) {
    const dest = gByKey(d.destination), busy = S.busy === 'd:' + d.id;
    const text = S.edits[d.id] != null ? S.edits[d.id] : str(d.text);
    return h('li', { class: 'card dr' },
      h('div', { class: 'row sp' }, h('b', { text: str(d.topic) }), h('span', { class: 'small', text: t('to_group', { g: groupName(dest) }) })),
      d.criterion ? h('p', { class: 'small' }, t('matched') + ' ', h('span', { class: 'chip', text: str(d.criterion) })) : null,
      h('div', { class: 'drw' }, imageBox(d),
        h('div', { class: 'drt' }, h('label', { class: 'sr-only', for: 't-' + d.id, text: t('text') }),
          h('textarea', { id: 't-' + d.id, class: 'field', value: text, oninput: (e) => { S.edits[d.id] = e.target.value; } }))),
      arr(d.sources).length ? h('details', { class: 'small' }, h('summary', { text: t('sources_h', { n: arr(d.sources).length }) }),
        h('ul', { class: 'srcs' }, arr(d.sources).map((s) => h('li', null, str(s.summary) + ' ', h('a', { href: str(s.url), target: '_blank', rel: 'noopener', text: t('open_src') }))))) : null,
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('button', { class: 'btn pri sm', type: 'button', id: 'ap-' + d.id, disabled: busy || d.image_state !== 'ready', onclick: () => decide(d, 'approve', { text: boxText(d) }) }, busy ? spinner() : t('approve')),
        h('button', { class: 'btn sm', type: 'button', disabled: busy, onclick: () => decide(d, 'save', { text: boxText(d) }) }, t('save_text')),
        h('button', { class: 'btn sm', type: 'button', id: 'np-' + d.id, disabled: busy || d.image_state === 'making', onclick: () => decide(d, 'image') }, t('new_pic')),
        h('button', { class: 'btn sm ghost danger', type: 'button', disabled: busy, onclick: () => decide(d, 'skip') }, t('skip'))));
  }
  function copyPill(st) {
    const cls = st === 'posted' ? 'pill sent' : st === 'pending_admin' ? 'pill live' : (st === 'failed' || st === 'unknown') ? 'pill no' : 'pill wait';
    return h('span', { class: cls, text: t('c_' + (st || 'scheduled')) });
  }
  function groupPicker(field, label, hint) {
    const f = S.form, other = field === 'sources' ? f.destinations : f.sources;
    const toggle = (k) => (e) => { const a = f[field], i = a.indexOf(k); if (e.target.checked && i < 0) a.push(k); if (!e.target.checked && i >= 0) a.splice(i, 1); render(); };
    const addLink = (ev) => {
      ev.preventDefault();
      const u = str(S.addFor === field ? S.addUrl : '').trim();
      if (!u) return;
      api('/solo/groupposts/groups/add', { client: S.client, url: u }).then((res) => {
        if (!res.ok || !res.data) { toast(msgOf(res)); return; }
        S.addUrl = ''; S.addFor = '';
        if (f[field].indexOf(res.data.key) < 0) f[field].push(res.data.key);
        refreshState().then(render);
      }).catch(() => toast(t('net_err')));
    };
    return h('div', null, h('label', { class: 'lbl', text: label }), h('p', { class: 'small', text: hint }),
      h('div', { class: 'chks' }, S.groups.filter((g) => other.indexOf(g.key) < 0).map((g) => h('label', { class: 'chk' },
        h('input', { type: 'checkbox', checked: f[field].indexOf(g.key) >= 0, onchange: toggle(g.key) }),
        h('span', { style: 'flex:1 1 auto;min-width:0' }, h('span', { class: 't', text: groupName(g) }), h('br'),
          h('span', { class: 'm', text: (g.members != null ? t('g_members', { n: fmtNum(num(g.members)) }) : t('g_members_unknown')) + ' · ' + t('m_' + str(g.member)) }))))),
      h('form', { class: 'row', style: 'margin-top:8px', onsubmit: addLink },
        h('input', { class: 'field', type: 'url', placeholder: t('g_add_ph'), 'aria-label': t('g_add') + ' · ' + label, value: S.addFor === field ? S.addUrl : '',
          style: 'flex:1 1 240px', oninput: (e) => { S.addUrl = e.target.value; S.addFor = field; } }),
        h('button', { class: 'btn sm', type: 'submit' }, t('g_add_btn'))));
  }
  function settingsCard() {
    const f = S.form;
    const fld = (k, label, attrs) => h('div', null, h('label', { class: 'lbl', for: 'f-' + k, text: label }),
      h(attrs && attrs.area ? 'textarea' : 'input', Object.assign({ id: 'f-' + k, class: 'field', value: str(f[k] == null ? '' : String(f[k])), oninput: (e) => { f[k] = e.target.value; } }, attrs && attrs.area ? { rows: attrs.rows || 4, style: 'min-height:' + (attrs.min || 110) + 'px' } : { type: 'text' })),
      attrs && attrs.hint ? h('p', { class: 'small', style: 'margin-top:4px', text: attrs.hint }) : null);
    const numBox = (k, lo, hi) => h('input', { class: 'field', type: 'number', inputmode: 'numeric', min: String(lo), max: String(hi), value: String(f[k]), 'aria-label': t('f_' + k), oninput: (e) => { f[k] = parseInt(e.target.value, 10) || lo; } });
    return h('section', { class: 'card', id: 'settings' }, h('h2', { text: f.id ? t('settings_h') : t('new_cm') }),
      fld('name', t('f_name')),
      fld('focus', t('f_focus'), { area: true, hint: t('f_focus_h') }),
      fld('include', t('f_include'), { area: true, min: 140, hint: t('f_include_h') }),
      fld('exclude', t('f_exclude'), { area: true, hint: t('f_exclude_h') }),
      fld('keywords', t('f_keywords'), { hint: t('f_keywords_h') }),
      h('div', null, h('label', { class: 'lbl', for: 'f-language', text: t('f_language') }),
        h('select', { id: 'f-language', class: 'field', style: 'max-width:220px', onchange: (e) => { f.language = e.target.value; } },
          [['en', 'English'], ['vi', 'Tiếng Việt']].map((x) => h('option', { value: x[0], selected: f.language === x[0], text: x[1] })))),
      fld('tone', t('f_tone'), { area: true, min: 70, hint: t('f_tone_h') }),
      groupPicker('sources', t('f_sources'), t('f_sources_h')),
      groupPicker('destinations', t('f_dests'), t('f_dests_h')),
      h('div', { class: 'caps', style: 'margin-top:14px' }, numBox('posts_per_day', 1, 5), t('f_ppd'), t('f_from'), numBox('window_start', 0, 23), t('f_to'), numBox('window_end', 1, 24), t('f_hours')),
      fld('tz', t('f_tz'), { hint: t('f_tz_h') }),
      h('div', { class: 'caps', style: 'margin-top:10px' }, t('f_buffer'), numBox('buffer_days', 2, 14), t('f_buffer2')),
      f.id ? h('div', null, h('label', { class: 'lbl', for: 'f-status', text: t('f_status') }),
        h('select', { id: 'f-status', class: 'field', style: 'max-width:220px', onchange: (e) => { f.status = e.target.value; } },
          ['active', 'paused', 'archived'].map((x) => h('option', { value: x, selected: f.status === x, text: t('st_' + x) })))) : null,
      S.err ? h('p', { class: 'err', role: 'alert', text: S.err }) : null,
      h('div', { class: 'row', style: 'margin-top:16px' }, h('button', { class: 'btn pri', type: 'button', disabled: S.busy === 'save', onclick: saveForm }, S.busy === 'save' ? [spinner(), t('saving')] : t('save'))));
  }
  function editView() {
    const c = S.cm;
    const back = h('div', null, h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { stopPoll(); S.view = 'list'; S.cm = null; refreshState().then(render); syncUrl(); } }, '← ' + t('back')));
    if (!c) return h('div', { class: 'stack' }, reachRow(), back, settingsCard());
    const drafts = arr(c.drafts);
    const waiting = drafts.filter((d) => d.state === 'awaiting_review');
    const sched = drafts.filter((d) => d.state === 'approved').sort((a, b) => num(a.due_at) - num(b.due_at));
    return h('div', { class: 'stack' }, reachRow(), back,
      h('div', null, h('h1', { class: 'pg', text: str(c.name) }), h('p', { class: 'sub', text: str(c.focus) })),
      c.status === 'paused' && c.paused_reason ? h('div', { class: 'note bad', role: 'status', text: t('why_' + str(c.paused_reason)) }) : null,
      h('section', { class: 'card' }, h('h2', { text: t('dests_h') }), h('div', { class: 'stack', style: 'margin-top:10px;gap:8px' }, arr(c.destinations).map(destLine)),
        arr(c.destinations).some((d) => d.low) ? h('div', { class: 'note warn', style: 'margin-top:10px', text: t('low_note') }) : null),
      h('section', null, h('h2', { class: 'h2', text: t('review_h', { n: fmtNum(waiting.length) }) }),
        h('p', { class: 'small', text: t('review_p') }),
        waiting.length ? h('ul', { class: 'list', style: 'margin-top:10px' }, waiting.map(draftCard)) : h('p', { class: 'small', style: 'margin-top:8px', text: t('review_none') })),
      sched.length ? h('section', { class: 'card' }, h('h2', { text: t('sched_h') }),
        h('ul', { class: 'list', style: 'margin-top:10px' }, sched.map((d) => h('li', { class: 'grp' },
          d.image_url ? h('img', { class: 'thumb', src: d.image_url, alt: '' }) : null,
          h('div', { class: 'n' }, h('b', { text: str(d.topic) }), h('span', { class: 'small', text: groupName(gByKey(d.destination)) + ' · ' + fmtDay(d.due_at) })),
          copyPill(d.copy_state),
          d.post_url ? h('a', { href: d.post_url, target: '_blank', rel: 'noopener', text: t('open_post') }) :
            d.copy_state === 'scheduled' ? h('button', { class: 'btn sm ghost', type: 'button', onclick: () => decide(d, 'cancel') }, t('cancel')) : null)))) : null,
      settingsCard());
  }

  function render() {
    app.textContent = '';
    if (S.mode === 'loading' || S.busy === 'open') { app.appendChild(h('p', { class: 'small', 'aria-busy': 'true' }, spinner(), ' ', t('loading'))); }
    else if (S.mode === 'login') app.appendChild(loginView());
    else if (S.mode === 'error') app.appendChild(h('div', { class: 'note bad stack', role: 'alert' }, h('p', { text: S.pageErr || t('err') }), h('div', null, h('button', { class: 'btn', type: 'button', onclick: () => { S.mode = 'loading'; render(); load(); } }, t('retry_load')))));
    else app.appendChild(S.view === 'edit' ? editView() : listView());
    foot.textContent = '';
    const s = session();
    if (s && S.mode === 'view') foot.appendChild(h('span', { text: s.user_email }));
  }
  render();
  load();
})();
</script>
</body>
