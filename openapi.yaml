      tags: [Skills]
      operationId: getVideoScriptSkill
      deprecated: true
      summary: "Deprecated — use getWritingSkill with format=video. Transparent alias kept so existing Custom GPT Actions don't break."
      description: |
        Transparent alias for `/v1/skills/writing?format=video`. Returns
        the same body. New integrations should call `getWritingSkill` so
        they can also reach the `blog` and `social` skills with the same
