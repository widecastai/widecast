            examples:
              saas:
                summary: Ideas from a product description
                value:
                  product_service_input: "A budgeting app for freelancers with tax estimates"
                  target_location: "California, United States"
      responses:
        '200':
          description: |
            Either the generated ideas OR a clarification asking for missing
            input (currently only `target_location`). Distinguish by `object`:
              * `object: "ideas"` → IdeasResponse with the ideas array.
              * `object: "clarification"` → `needs_input` names the missing
                field; `message` is the prompt to relay to the user. No credit
                was charged — call again with the missing field set.
          headers: *commonHeaders
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IdeasResponse'
                  - $ref: '#/components/schemas/ClarificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/upload_asset:
    post:
      tags: [Videos]
      operationId: uploadAsset
      summary: Upload an audio / video / image / document (or mint a pre-signed S3 PUT URL).
      description: |
        Get an asset into WideCast's `widecast-assets` S3 bucket and back
        out as a **public URL** the AI agent can feed into `/v1/create_video`
        (as `audio_url` or `video_url`), paste into `script_text` as an
        inline `![alt](url)` for images, OR `curl <get_url>` to fetch a
        document body before passing it as `blog_text` / `script_text`.
        This is the **canonical upload path** for AI agents handling
        user-attached files — it removes the need to shop for third-party
        hosts (transfer.sh / catbox / S3 of your own) or inline-base64
        binary content into create_video.

        **Lifecycle: the bucket prefix `assets/` auto-deletes after 24
        hours.** Call `/v1/create_video` with the returned URL within that
        window. Free (no credits).

        **Allowed kinds**:
          * Media: `audio/*` / `video/*` / `image/*`
          * Document: `text/html` / `application/pdf` / `text/markdown`
            (HTML / PDF / Markdown — for blog drafts, research notes,
            articles the user attached to feed `source=blog`)
        Anything else returns `400 unsupported_asset_type`.

        **Three request shapes**:
          * `multipart/form-data` with `file=@/path/to/asset` — the standard
            multipart form upload. Best for SDKs / curl / Postman / ChatGPT
            Custom GPT Action. Server cap 500 MB. Returns
            `AssetResponse { object:"asset", url, ... }` — bytes are already
            on S3 and the URL resolves immediately.
          * `application/json` with `{ mode: "presign", filename,
            content_type }` — **the path the MCP tool dispatches through**
            (the MCP transport can't carry binary). Server mints a
            1-hour-lived pre-signed S3 PUT URL; the caller then `PUT`s the
            bytes straight to S3. Returns
            `AssetPresignResponse { object:"asset_presign", put_url, get_url, ... }`.
            The `get_url` resolves for 24 hours after the PUT lands. The
            signature binds **only the host** — the caller does NOT need to
            echo back any Content-Type / metadata header. `headers_required`
            is empty by design so `curl -X PUT --upload-file <file>
            "<put_url>"` works as-is across HTTP clients.
          * `application/json` with `{ file_data: <base64>, filename,
            content_type }` — legacy / small-file convenience for callers
            that already have the bytes inline and don't want a second
            request. Server cap 500 MB decoded; in practice the MCP
            transport caps tool args to ~25 MB, so MCP agents use the
            `mode:"presign"` shape instead.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio / video / image / document (HTML / PDF / Markdown) file to upload.
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AssetPresignRequest'
                - $ref: '#/components/schemas/AssetUploadJSONRequest'
      responses:
        '200':
          description: |
            Upload succeeded (multipart / base64 → `AssetResponse`) OR
            pre-signed URL minted (presign → `AssetPresignResponse`).
          headers: *commonHeaders
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AssetResponse'
                  - $ref: '#/components/schemas/AssetPresignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/telegram/send:
    post:
      tags: [Notifications]
      operationId: sendTelegramMessage
      summary: Push a self-notify message — Telegram preferred, email fallback.
      description: |
        Synchronous, free. Self-notify only — the recipient is the user who
        owns this API key (delivery target is resolved server-side from
        their account, never accepted as input), so this cannot be used to
        message anyone else.

        **Delivery channel is auto-chosen**:
          * `telegram` — preferred when the user has completed `Connect
            Telegram` at https://widecast.ai/#setup. The message lands in
            their Telegram chat with the WideCast bot.
          * `email` — fallback when Telegram is not connected. The same
            message is delivered to the account's email address with an
            in-mail banner explaining WHY (Telegram not connected) and a
            CTA to connect. Response carries `delivery: "email"`,
            `fallback_reason: "telegram_not_connected"`, and `setup_url`.

        Only returns 400 `telegram_not_connected` if the account has
        NEITHER Telegram NOR an email on file. Rate-limited to 60
        messages/hour/account.

        Payload modes:
          * **text** — `message` only.
          * **photo** — `message` is the caption, `photo_url` is a public
            http(s) URL Telegram downloads.
          * **video** — `message` is the caption, `video_url` is a public
            http(s) URL Telegram downloads.

        `photo_url` and `video_url` are mutually exclusive (Telegram can't
        attach both to one message). `parse_mode` is opt-in (`Markdown` /
        `MarkdownV2` / `HTML`); omit for plain text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramSendRequest' }
      responses:
        '200':
          description: Message delivered.
          headers: *commonHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramMessageResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Telegram API rejected the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/publish:
    post:
      tags: [Distribution]
      operationId: publish
      summary: Publish a video / blog / text to connected social platforms.
      description: |
        Distribute content to the social platforms connected to your account
        (via Upload-Post). Provide **exactly one** content mode:

        - `topic_id` — publish a WideCast video OR blog/social post you already
          created (`/v1/create_video` or `/v1/create_content`). Auto-detects
          article vs video. A video must be finished (export the final MP4 with
          `/v1/export_video` first) else `publish_not_ready` (409).
        - `text` — post arbitrary text (optionally with `photo_urls`).
        - `video_url` — a **direct video file URL** (mp4/mov/…) to post; requires
          `title`. WideCast downloads it, then publishes.

        `platforms` defaults to **all connected** platforms. Charges 1 credit.

        Publishing is asynchronous on the platform side: this returns the
        upstream `request_ids` immediately (HTTP 202). Poll
        `GET /v1/status/{request_id}` for per-platform post URLs. An article
        spanning text + photo platforms may return up to two `request_ids`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
            examples:
              topic:
                summary: Publish an existing WideCast video to two platforms
                value: { topic_id: "widecast7c0d4f8a9b1e2d3f", platforms: ["youtube", "x"] }
              text:
                summary: Post arbitrary text to all connected platforms
                value: { text: "We just shipped v2 — try it free today!" }
              external_video:
                summary: Post an external video file URL
                value: { video_url: "https://cdn.example.com/clip.mp4", title: "Launch teaser" }
      responses:
        '202':
          description: Publish accepted — poll the returned request_id(s).
          headers: *commonHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/videos:
    get:
      tags: [Library]
      operationId: listVideos
      summary: List the account's recent videos.
      description: Synchronous, read-only, free. Returns recent videos/scripts (20 per page).
      parameters:
        - { name: from_record, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of recent videos.
          headers: *commonHeaders
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        language: { type: string }
                        created_at: { type: string, format: date-time }
                  total_count: { type: integer }
                  from_record: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # /v1/search withdrawn from the public surface 2026-06-21 (Round 29).
  # REST endpoint still serves the dashboard UI; SDK + MCP tool removed.
  # Agents that need to find a topic use /v1/videos + a local title filter.

  /v1/video_data:
    post:
      tags: [Library]
      operationId: getVideoData
      summary: Read structured scene data (data-first audit/edit entry point).
      description: |
        Synchronous, free. **First step for data-first scene audit/edit** —
        call this before `/v1/modify_scene` or `/v1/scene_inspector`.

        **URL-RESPONSE CONTRACT** (default `delivery_mode="download_url"`):
        the HTTP response is a small JSON envelope; the full video_data tree
        (annotated `segments[]`, `scene_identity`, `global_settings`,
        Remotion spec metadata) is published to a temporary public JSON file
        on `origin.widecast.ai` and the envelope carries `data.url` +
        `data.bytes` + `data.expires_at` + `data.ttl_seconds=900` (15-min
        TTL) plus a 3-step `instructions` block. The agent must
        `mkdir -p ./.widecast-video-data && cd ./.widecast-video-data` +
        `curl -fsSL '<data.url>' -o video_data.json` + Read locally — the
        full tree is NOT inlined in the HTTP response. This bypasses MCP
        per-tool-call output caps that previously truncated 50–300 KB
        payloads mid-JSON. Every call publishes a NEW unique file (token =
        16 hex chars), so URLs are never reused — matches the realtime
        semantics of video data. Host is `origin.widecast.ai` (CF-bypassed)
        + `?v=<mtime>` cache-bust. Server only responds AFTER the JSON is
        fsynced + atomically renamed to its final path, so the URL is
        guaranteed readable when the agent fetches it (no race). Operators
        can flip to legacy inline mode via env flag
        `WIDECAST_VIDEO_DATA_DELIVERY_MODE=inline_content` — in that mode
        the HTTP response carries the full tree inline as before.

        The published JSON file shape is the same as the legacy inline
        response. To keep MCP payloads usable the API trims per-segment
        `words` timing arrays, top-level `captions`, and internal
        preview-cache fields (`savedVideos`, `savedImages`,
        `_previewInstanceId`, `_remotionSpecFetching`,
        `_forceNarratorRefit`). UI routes still get full data; this is the
        agent-safe slim view.

        **Scene identity rule** (also returned as `scene_identity` in the
        response): use `voice_file` as the stable per-scene UID.
        `segment.id` is only display/order metadata and may change after
        reorder/add/delete. The Remotion spec for a scene is
        `{voice_file}_spec.json`.

        **Per-segment fields agents care about**:
          * `voice_file` (stable scene UID; use for modify/inspect).
          * `id` / `order_id` / `scene_index` (current order; UNSTABLE).
          * `type` (`A-roll` | `B-roll` | `thumbnail`).
          * `text` (narration), `talking_point`, `visual`, `quote`,
            `keyword`.
          * `mediaUrl`, `mediaType`, `thumbnailUrl`, `videoTrim`.
          * `overlay.caption`, `overlay.narrator` — legacy 280×498 editor
            preview coordinates.
          * `remotion_spec` — `"none"` means the user intentionally
            disabled the overlay on that scene; agents must NOT auto-edit
            or re-enable unless the user asks.
          * `remotion_spec_file` — `{voice_file}_spec.json`.
          * `remotion_spec_url` — cache-busted
            `https://widecast.ai/downloads/{company_id}/{topic_id}/{voice_file}_spec.json?v={mtime}`;
            present only when `remotion_spec_state="ready"`.
          * `remotion_spec_version`, `remotion_spec_exists`,
            `remotion_spec_state` (`ready` | `missing` | `disabled`).
          * `agent_meta` — same metadata bundled for quick consumption
            (`stable_scene_id`, `coordinate_spaces`, `scene_index`, etc.).

        **Coordinate warning**: Remotion spec objects use **720×1280
        canvas** coordinates; legacy `overlay.caption` and
        `overlay.narrator` use **280×498 editor preview** coordinates. Pass
        `coordinate_space` to `/v1/modify_scene`'s `remotion.group.rect`
        accordingly.

        **Remotion spec is NOT inlined** — it can carry large base64
        images. Fetch `remotion_spec_url` only when
        `remotion_spec_state="ready"` and you actually need object-level
        overlay boxes; otherwise use the metadata only.

        **Internal poster diagnostics are stripped by default.** Per-segment
        `remotion_poster_file`, `remotion_poster_url`,
        `remotion_poster_version`, `remotion_poster_state`,
        `remotion_poster_exists`, and `remotion_poster_warnings` (and
        their copies inside `agent_meta.remotion_spec`) describe the
        server-side `{voice_file}_overlay_poster.png` used by
        `/v1/scene_inspector` fallback. Pass
        `include_diagnostics: true` to surface them for server/debug
        audits.

        Mirrors the same engine the dashboard's scene editor uses on open
        (rebalance A/B rolls + ensure background music + persist if
        changed), so the data here matches what the user sees in
        `#scene_editor?topic_id=…` exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_id]
              properties:
                video_id:
                  type: string
                  description: |
                    Topic id from `/v1/create_video` / scene_editor. Accepts
                    `widecast...`, `gubo...`, or current topic ids. Same id
                    used by `/v1/status`, `/v1/export_video`,
                    `/v1/modify_scene`, `/v1/scene_inspector`.
                include_diagnostics:
                  type: boolean
                  default: false
                  description: |
                    Optional debug flag. When `true`, per-segment
                    `remotion_poster_*` diagnostic keys (and their
                    copies inside `agent_meta.remotion_spec`) are
                    returned. Default is `false` because those keys
                    describe the server-side poster used by scene
                    inspector fallback — agents don't act on them.
              example:
                video_id: "widecastABCDEFGHIJKL"
      responses:
        '200':
          description: Video data.
          headers: *commonHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoDataResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            `video_not_found` — no video with this id on the account. Check
            the id is the topic_id returned by `/v1/create_video` and that
            it belongs to the API key's account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `script_not_ready` — video is still processing or never had a
            script generated. Poll `/v1/status` until
            `status=="completed"`, then retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: |
            `video_data_publish_failed` — the response tree was assembled
            but could not be persisted to disk (no readable URL to return).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            `script_parse_failed` — stored video_script is malformed.
            Contact support with the request_id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/scene_inspector:
    post:
      tags: [Videos]
      operationId: sceneInspector
      summary: Live browser inspector — expensive last-resort, use AFTER scene_geometry.
      description: |
        Synchronous live browser inspector. **More expensive than
        `/v1/scene_geometry`** — use only when data + geometry are not
        enough: typically when the agent needs browser truth (mounted DOM,
        computed boxes, current preview play state) or a small 280×498
        visual screenshot for aesthetic judgment. Do NOT use as the first
        step if `/v1/scene_geometry` already gives the boxes you need.

        **How it works**: server broadcasts a tiny MQTT probe to every
        open editor tab for this video, elects ONE healthy foreground /
        active browser within ~800ms, then sends the real inspector
        command only to that tab. `/v1/modify_scene` realtime broadcasts
        to all editors separately — this tool's election only affects
        which tab returns the live inspection. Presence alone is not
        usability: tabs on the workflow page, on a different video, or
        any page without a mounted scene preview are ignored for scene-
        bound commands.

        **`screenshot_scene_280x498` response shape — temporary public
        URL.** On success (live editor capture OR server-fallback
        composite from thumbnails + `{voice_file}_overlay_poster.png`),
        the HTTP response is a regular JSON `SceneInspectorResponse`
        whose `result.screenshot` carries a *temporary public URL* —
        NOT bytes, NOT base64:

          * `url` — `https://origin.widecast.ai/downloads/<co>/<topic>/inspector/<voice>_<token>.jpg?v=<mtime>`.
            Fetch the JPEG bytes with `curl <url>`. No
            `Authorization` header required — the path is served
            publicly by nginx. The host is ``origin.widecast.ai`` (not
            ``widecast.ai``) — bypasses Cloudflare so 15-min ephemeral
            URLs never get pinned in CF edge cache. The cache-bust
            ``?v=<mtime>`` is belt-and-suspenders.
          * `mime_type` — `image/jpeg`.
          * `width` / `height` — pixel dimensions (typically 280 / 498).
          * `bytes` — JPEG byte length on disk.
          * `expires_at` — ISO 8601 UTC; the URL is guaranteed
            readable until this moment.
          * `ttl_seconds` — `900` (15 minutes).

        Every call publishes a fresh unique file (16-hex token), so
        the URL is never reused across calls — matches the realtime
        semantics of inspector data. The server only responds after
        the JPEG is `fsync`-ed and atomically renamed to its final
        path, so the URL is guaranteed readable when the agent reads
        the response (no race).

        **All other actions still return JSON
        `SceneInspectorResponse`** as before.

        **No live editor → graceful behaviour**:
          - For non-screenshot actions, the response is HTTP 200 with
            `status: "unavailable"` and `code: "no_live_editor"` (no
            presence) or `"no_active_editor"` (presence but unresponsive).
            Fall back to `/v1/video_data` + `/v1/scene_geometry` +
            fetching `remotion_spec_url`.
          - `screenshot_scene_280x498` and `overlay_poster` are always
            served via the same 15-minute URL contract whether or not a
            live editor was elected — both are pure server-side
            compositors.

        **`overlay_poster` — audit the overlay in isolation.** Companion
        action to `screenshot_scene_280x498`. The server composites ONLY
        the Remotion overlay poster on a solid black 280×498 canvas (no
        background image, no narrator, no caption). Purpose: catch
        text-quality issues the composite screenshot hides —
        readability, typos, grammar, semantic drift, missing Vietnamese
        diacritics, glyph rendering (□ tofu, cut characters),
        punctuation. Response shape mirrors screenshot but uses
        `result.overlay_poster.{url, mime_type, width, height, bytes,
        expires_at, ttl_seconds}` and adds `result.review_checklist` —
        a bilingual reminder that walks the agent through 8 audit
        dimensions. Filename is STABLE (`<voice>_poster.jpg`,
        overwritten each call); the `?v=<mtime>` cache-bust bumps every
        write so the URL string is fresh in every response. Server
        still fsync+atomic-renames BEFORE responding so the file is
        guaranteed readable. Errors specific to overlay_poster: 409
        `overlay_not_available` (scene has no poster —
        `remotion_spec="none"` or spec not yet built), 500
        `overlay_publish_failed` (disk write / rename failed).

        **Actions** (`action`):
          * `list_live_editors` — presence list of open editor tabs
            (browser / OS / last_seen) — debug/discovery only.
          * `list_instances` — preview instance ids mounted in the elected
            tab.
          * `get_preview_state` — current playing/paused/scene/time in the
            preview player.
          * `get_scene_dom_snapshot` — DOM subtree for a scene (scoped via
            optional `selector` — keep narrow).
          * `get_computed_boxes` — `getBoundingClientRect` for scene
            elements. **Prefer `/v1/scene_geometry` for structural
            audits** — it is cheaper, always-available (no browser
            needed), and returns the same boxes plus collision violations
            and safe zones in pure JSON.
          * `screenshot_scene_280x498` — small JPEG (~280×498) showing
            the FULL composite: background + Remotion overlay poster +
            narrator + caption. **Response is JSON with a 15-minute
            public URL** (see above). Fetch the bytes with
            `curl <result.screenshot.url>`.
          * `overlay_poster` — small JPEG (~280×498) showing ONLY the
            overlay poster on solid black. **Response is JSON with a
            URL + a `review_checklist` reminder** — use to catch
            typos / diacritic loss / glyph tofu / grammar / semantic
            drift the background image would otherwise mask.
          * `activate_scene` — bring the elected tab to scene N (may
            visibly switch the editor for that user).
          * `reload_preview` / `pause_preview` / `play_preview` /
            `seek_preview` — preview transport controls.

        **No arbitrary JavaScript eval is exposed.** Use `voice_file` as
        the scene selector wherever possible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SceneInspectorRequest' }
            examples:
              presence:
                summary: Check who has the editor open
                value:
                  id: widecast7c0d4f8a9b1e2d3f
                  action: list_live_editors
              boxes:
                summary: Computed bounding boxes for one scene
                value:
                  id: widecast7c0d4f8a9b1e2d3f
                  action: get_computed_boxes
                  voice_file: XcR0k
              screenshot:
                summary: Small 280×498 capture — JSON response with 15-minute public URL
                description: |
                  Response is a regular `SceneInspectorResponse` whose
                  `result.screenshot.url` is a public path the agent
                  fetches with `curl` (no auth header). The URL is
                  unique per call and valid for 15 minutes.
                value:
                  id: widecast7c0d4f8a9b1e2d3f
                  action: screenshot_scene_280x498
                  voice_file: XcR0k
                  activate: true
              overlay_poster:
                summary: Overlay only on solid black — audit typos / diacritics / glyph rendering
                description: |
                  Response carries `result.overlay_poster.url` (public,
                  valid 15 min) + `result.review_checklist` — a
                  bilingual reminder for the agent to walk 8 audit
                  dimensions (readability / typos / grammar /
                  semantic / diacritic / glyph / numbers / punctuation).
                  Filename is stable (`<voice>_poster.jpg`) but
                  `?v=<mtime>` freshens the URL every call.
                value:
                  id: widecast7c0d4f8a9b1e2d3f
                  action: overlay_poster
                  voice_file: XcR0k
      responses:
        '200':
          description: |
            Inspector outcome. Always JSON `SceneInspectorResponse`:
              * **`screenshot_scene_280x498`** → JSON carrying
                `result.screenshot.{url, mime_type, width, height,
                bytes, expires_at, ttl_seconds}`. The agent fetches
                the JPEG by `curl <result.screenshot.url>` — the URL
                is public, fresh per call, and valid 15 minutes.
              * **`overlay_poster`** → JSON carrying
                `result.overlay_poster.{url, mime_type, width,
                height, bytes, expires_at, ttl_seconds}` plus
                `result.review_checklist` — a bilingual reminder
                covering readability / typos / grammar / semantic /
                diacritic / glyph / numbers / punctuation. Filename
                is stable (`<voice>_poster.jpg`); `?v=<mtime>` bumps
                every call. Fetch bytes with
                `curl <result.overlay_poster.url>`.
              * **All other actions** → JSON `SceneInspectorResponse`
                with `status` discriminating:
                  * `"completed"` — elected tab returned a `result`.
                  * `"unavailable"` — no editor available; `code` is
                    `no_live_editor` (no presence) or `no_active_editor`
                    (presence but unresponsive).
                  * `"error"` — browser-side failure; `code` carries the
                    provider error.
          headers: *commonHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SceneInspectorResponse' }
        '400':
          description: |
            `unsupported_action` (not in the action enum) or
            `publisher_missing` (server MQTT publisher unavailable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            `video_not_found` — no video with this id on the account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            * `script_not_ready` — video still processing or never had
              a script generated (compositor needs the video_script).
            * `overlay_not_available` — `overlay_poster` action only.
              The scene has no Remotion overlay poster to render —
              either the overlay was disabled
              (`segment.remotion_spec="none"`) or the spec has not been
              built yet. Upload an overlay first (see
              `/v1/modify_scene` Upload Overlay branch), then retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: |
            * `screenshot_publish_failed` — screenshot was composed but
              could not be persisted to disk (no readable URL to
              return).
            * `overlay_publish_failed` — `overlay_poster` JPEG was
              composed but could not be persisted (no readable URL to
              return).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            `script_parse_failed` — stored video_script is malformed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

