  /v1/status/{id}:
    get:
      tags: [Videos]
      operationId: getStatus
      summary: Poll the current state of a video or publish job.
      description: |
        Universal status endpoint. Accepts the `widecast*` ids returned by
        `/v1/create_video` / `/v1/create_content` / `/v1/enhance_script`, AND
        the publish `request_id`s returned by `/v1/publish` (for a publish id,
        `type` is `"publish"` and `result.posts[]` carries per-platform post
        URLs).

        Recommended polling cadence: **5s initial, ×1.5 exponential backoff,
        cap at 60s**. The SDKs' `video.wait()` implements this automatically.

        `result.review_url` is the URL where the user reviews the rendered
        scenes + audio. **It's present from the first response** (every
        state — pending / processing / completed) because the review page
        handles early arrival itself (spinner + in-page polling) — safe to
        share with the user before completion. `result.script` is the full
        rendered video script JSON (with `segments` populated) — only set
        when `status == "completed"`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: widecast7c0d4f8a9b1e2d3f
      responses:
        '200':
          description: Current state.
          headers: *commonHeaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /openapi.json:
    get:
      tags: [Spec]
      operationId: getOpenapiJson
      summary: Fetch this OpenAPI spec as JSON.
      responses:
        '200':
          description: OpenAPI 3.1 spec.
          content:
            application/json:
              schema: { type: object }

  /openapi.yaml:
    get:
      tags: [Spec]
      operationId: getOpenapiYaml
      summary: Fetch this OpenAPI spec as YAML.
      responses:
        '200':
          description: OpenAPI 3.1 spec.
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: WideCast API Key (wc_live_*)

  headers:
    XRequestId:
      schema: { type: string, example: req_c0a8f9e8d7b6a5f4e3d2c1b0 }
      description: Unique ID for this request — include in any support ticket.
    XRateLimitLimit:
      schema: { type: integer, example: 1000 }
    XRateLimitRemaining:
      schema: { type: integer, example: 999 }
    XRateLimitReset:
      schema: { type: integer, example: 1747680000 }
    XWideCastVersion:
      schema: { type: string, example: "0.1.0" }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
        example: 1d4f9c8a-9b71-4c5a-93b3-7c8e4d2e8f10
      description: |
        Client-generated UUID. Two requests with the same key within 24h return
        the SAME video and do NOT create a new one. **Read but not enforced
        in pilot.**

  schemas:
    CreateVideoRequest:
      type: object
      description: |
        Conditional shape based on `source`:
          * source="text" (default) → `script_text` required.
          * source="idea" → `idea_text` required; `language`, `video_length`,
            `research_enabled` optional with defaults.
        The other text field is ignored when not matching `source`.
      required: [source]
      properties:
        script_approved:
          type: boolean
          description: |
            Confirmation flag for AI agents calling via MCP or ChatGPT Action.
            **MCP callers**: REQUIRED (the MCP wrapper rejects calls where this
            is missing or false). **ChatGPT Action callers**: should set true
            after showing the user the full hand-off and getting explicit
            approval. **SDK / curl / Postman callers**: this field is ignored
            by the REST endpoint; SDK consumers are trusted to handle their
            own UX. The point of the flag is to enforce that the dialog flow
            with the end user actually happened — a bare "make a video about X"
            from the user is the REQUEST, not the approval.
        production_mode:
          type: string
          enum: [faceless, face_clone, teleprompter]
          description: |
            User's explicit answer to the three-way production question.
            Applies to source=text/idea/blog AND source=audio_url
            (ignored for video sources — the footage IS the visuals).
            Three valid values, each with a different downstream UX:
              * `faceless` — B-roll only, no narrator on screen. The video
                is fully automated; user just reviews and renders.
              * `face_clone` — the user's pre-trained Face clone + Voice
                clone speaks the script. The user **must have set both up
                at https://widecast.ai/#setup** before the render runs —
                if they haven't, the AI agent should point them there
                during the dialog.
              * `teleprompter` — the user records themselves reading the
                script via WideCast's built-in teleprompter (after the
                scenes prepare). No clone needed; user physically records.
            Both `face_clone` and `teleprompter` produce a "normal" video
            (narrator on screen) and map to the legacy `faceless=false`
            on the REST endpoint — the distinction is purely so the AI
            agent tells the user the right next step.
            **Audio-source nuance** (source=audio_url): the user's original
            voice in the recording IS the narration in every mode — it is
            never re-synthesized via TTS. `face_clone` here means the clone's
            face is on screen lip-synced to the user's original audio (not
            to a clone-voice resynthesis); the clone contributes only the
            visual face, the voice stays the user's.
            **MCP / Action callers**: pass the user's answer here; the MCP
            wrapper performs the mapping. **SDK / curl callers**: skip this
            field, set `faceless` directly as before.
        source:
          type: string
          enum: [text, idea, blog, video_url, video_file, audio_url, audio_file]
          default: text
          description: |
            Discriminates the input flow:
              * `text` (default — backward-compat): provide `script_text`
                used VERBATIM by the narrator.
              * `idea`: provide `idea_text`; server writes a narration from
                the idea (AI) then continues into the same scene-sourcing
                pipeline as `text`.
              * `blog`: provide `blog_text` (an article to repurpose);
                identical pipeline to `idea`, just a longer input.
              * `video_url` / `audio_url`: provide `video_url` / `audio_url`
                — **any public http(s) URL**. Direct file links (S3, R2,
                transfer.sh, file.io, your own CDN — anywhere an AI agent or
                user can drop the file and copy back a URL) AND platform pages
                (YouTube / TikTok / Facebook) both work. Loopback / private /
                link-local hosts are rejected (`unsupported_media_url`).
                Media-ingest (A49) — the script already lives in the media.
                The footage becomes the B-roll (video) / the audio becomes
                the narration (audio).
              * `video_file` / `audio_file`: upload the media file. Send the
                request as **multipart/form-data** with the file in the
                `video_file` / `audio_file` part (mirrors the UI upload).
            **AI agent path for "user attached a file in chat":** call
            `POST /v1/upload_asset` first (or the MCP `widecast_upload_asset`
            tool), get back a public S3 URL with a 24-hour TTL, then pass
            that URL here as `audio_url` / `video_url`. Do NOT inline-base64.
            `idea` and `blog` are generative sources — they support
            `output_type: "text"` (stop at the editable script). Media sources
            support `output_type: "text"` too = Remake (A50): extract the
            transcript only, no footage/scene build.
          x-widecast-enum-locked: true
        script_text:
          type: string
          description: |
            **Required when `source="text"`.** Plain text script — pasted
            narration. Used VERBATIM by the narrator (no AI rewriting).
            Bounds are LOCKED:
              * minimum 80 words (~20s of narration)
              * maximum 500 words (~120s / 2 min of narration)

            Word count = whitespace split (`len(text.split())`) — works for
            English + Vietnamese. Outside the bounds → HTTP 400 with
            `error.code` = `script_too_short` / `script_too_long`.

            **Inline media (use your own images/videos).** You can drop a
            direct image or video URL straight into the script, right after
            (or before) the sentence it should illustrate. WideCast (1) strips
            the URL (or markdown image construct) from the spoken narration
            and (2) uses that asset as the visual for the matching scene,
            instead of auto-sourced B-roll. Two equivalent forms — pick by
            caller:

              * **Markdown image syntax** (recommended for AI-chat callers
                like Claude / ChatGPT / Grok / Gemini):
                `![brief scene description](https://cdn.acme.com/photo.jpg)`.
                Chat hosts render the picture inline so the end-user can
                visually approve each scene before the script is submitted.
                Alt text doubles as the strongest scene anchor.
              * **Raw URL** on its own line, surrounded by descriptive words
                (the v0.1.0 default; still works):
                `Our cold brew steeps for 16 hours.
                https://cdn.acme.com/coldbrew.jpg That mellow finish…`.

            Mix both freely. Supported = direct file links ending in an image
            extension (`.png .jpg .jpeg .gif .webp .bmp .avif .svg`) or video
            extension (`.mp4 .webm .mov .m4v .avi`), optionally with a
            `?query`. Page links (e.g. `https://youtube.com/watch?...`) are
            NOT used as inline assets — to turn a whole YouTube/TikTok clip
            into a video use `source="video_url"` instead. Keep a few
            descriptive words (or alt text) next to the URL so it anchors to
            the right scene; multiple URLs are supported; scenes without a
            URL still get automatic B-roll.
          x-widecast-min-words: 80
          x-widecast-max-words: 500
          x-widecast-required-when: 'source == "text"'
          example: "California parents should encourage their teens to get a driver's license at 16. Driving builds independence, responsibility, and confidence — three things every teenager needs more of, and three things you can't teach from a couch..."
        idea_text:
          type: string
          description: |
            **Required when `source="idea"`.** Short description of what you
            want the video about. The server writes a narration from this
            (AI) and continues into the scene-sourcing pipeline. Bounds:
              * minimum 5 words — `idea_too_short` if shorter.
              * maximum 1000 words — longer is auto-truncated at a whitespace
                boundary (NOT rejected). Original word count surfaces in
                `details.input_truncated_from` on `/v1/status`.

            Word count = whitespace split.
          x-widecast-min-words: 5
          x-widecast-max-words: 1000
          x-widecast-overflow-policy: truncate
          x-widecast-required-when: 'source == "idea"'
          example: "Why teens should get their driver's license at 16, not 18 — independence, responsibility, and stake-low practice."
        blog_text:
          type: string
          description: |
            **Required when `source="blog"`.** A blog post or article to
            repurpose into a video. The server condenses it into a narration
            (same AI script-writer as `idea`) then continues into the
            scene-sourcing pipeline. Bounds:
              * minimum 30 words — `blog_too_short` if shorter (use
                `source=idea` for a one-liner brief instead).
              * maximum 3000 words — longer is auto-truncated at a whitespace
                boundary (NOT rejected). Original word count surfaces in
                `details.input_truncated_from` on `/v1/status`.

            Word count = whitespace split.
          x-widecast-min-words: 30
          x-widecast-max-words: 3000
          x-widecast-overflow-policy: truncate
          x-widecast-required-when: 'source == "blog"'
          example: "Every hurricane season, thousands of homeowners discover the same painful fact: their homeowner's insurance does not cover flood damage. Standard policies exclude rising-water damage entirely..."
        video_url:
          type: string
          format: uri
          description: |
            **Required when `source="video_url"`.** A YouTube / TikTok /
            Facebook video URL. The server downloads it, then the footage
            becomes the B-roll (Auto-Edit). Non-allowed hosts → HTTP 400
            `unsupported_media_url`; media over 5 minutes → `media_too_long`.
          x-widecast-required-when: 'source == "video_url"'
          x-widecast-max-duration-seconds: 300
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        audio_url:
          type: string
          format: uri
          description: |
            **Required when `source="audio_url"`.** A YouTube / TikTok /
            Facebook URL whose audio becomes the narration (Audio-to-Video).
            Same host allow-list + 5-minute cap as `video_url`.
            **Voice handling**: the user's original voice in the audio is kept
            verbatim as the narration in every production_mode (it is never
            re-synthesized via TTS). If they pick `production_mode="face_clone"`,
            the clone's face is lip-synced TO the user's original audio —
            voice stays the user's, only the on-screen face is the clone.
          x-widecast-required-when: 'source == "audio_url"'
          x-widecast-max-duration-seconds: 300
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        video_file:
          type: string
          format: binary
          description: |
            **Required when `source="video_file"`.** The video file, sent as
            multipart/form-data. Caps: **≤ 100 MB** (`file_too_large`) and
            **≤ 5 minutes** (`media_too_long`). Only present in the multipart
            request variant.
          x-widecast-required-when: 'source == "video_file"'
          x-widecast-max-bytes: 104857600
          x-widecast-max-duration-seconds: 300
        audio_file:
          type: string
          format: binary
          description: |
            **Required when `source="audio_file"`.** The audio file, sent as
            multipart/form-data. Caps: **≤ 100 MB** (`file_too_large`) and
            **≤ 5 minutes** (`media_too_long`). Only present in the multipart
            request variant.
          x-widecast-required-when: 'source == "audio_file"'
          x-widecast-max-bytes: 104857600
          x-widecast-max-duration-seconds: 300
        language:
          type: string
          enum: [English, Vietnamese]
          default: English
          description: |
            **Used when `source="idea"`** (ignored for source=text).
            Narration language. v0.1.0 enum locked to English + Vietnamese.
            Expanding requires a parity-test bump per A38.
          x-widecast-enum-locked: true
        video_length:
          type: string
          enum: [short, normal]
          default: short
          description: |
            **Used when `source="idea"`** (ignored for source=text).
            Target video length. Maps to legacy `content_type` 9 / 10.
              * `short` — ~90 seconds of narration (content_type 9).
              * `normal` — longer-form, capped at ~3 minutes total
                (content_type 10).
          x-widecast-enum-locked: true
        research_enabled:
          type: boolean
          default: true
          description: |
            **Used when `source="idea"`** (ignored for source=text).
            If true, the AI runs research / fact-check during narration
            generation. Default true (matches the UI's default-on behavior).
            Disable only if you know your idea is self-contained and
            doesn't need external facts.
        output_type:
          type: string
          enum: [text, scene, video]
          default: scene
          description: |
            How far down the pipeline to run (pipeline depth). For ALL three,
            `result.review_url` ships in the create response itself (safe to
            share with the user immediately — the page handles early arrival
            with an in-page spinner). `video_url` is the field that gates on
            completion (output_type=video / after export_video).
              * `text` — stops after the source→script-text phase.
                `review_url` opens the Script Editor.
                ONLY valid for generative sources (source != "text").
                source="text" + output_type="text" → HTTP 400
                `invalid_output_type` (you already supplied the script).
              * `scene` (default) — stops at scenes-ready-for-review.
                `review_url` opens the Scene Editor. Caller can then inspect /
                edit and call `POST /v1/export_video` to render the MP4 — or
                stop there.
              * `video` — auto-chains into the renderer once scenes are ready.
                `result.video_url` populated on completion. Use when you
                trust generated scenes.
          x-widecast-enum-locked: true
          x-widecast-requires-generative-source: text
        faceless:
          type: boolean
          default: false
          description: |
            **Used when `output_type` is `scene` or `video`** for sources
            text / idea / blog AND for audio sources (`audio_url` /
            `audio_base64`) — the script comes from a text input OR from
            transcribing the user's audio, but the visuals must still be
            generated, so the same A/B-roll toggle applies. When `true`,
            EVERY scene is rendered as B-roll (stock video / AI image) with
            NO narrator A-roll anywhere — a "faceless" video. When `false`
            (default), scenes mix narrator A-roll + B-roll as usual.
            Rejected with HTTP 400 `invalid_faceless` when `output_type="text"`
            (no scenes are produced) or for video sources (`video_url` /
            `video_file` — the footage IS the visuals).
          x-widecast-applies-when: 'output_type in ("scene","video") and source in ("text","idea","blog","audio_url","audio_base64")'
        media_pool:
          type: array
          items: { type: string, format: uri }
          description: |
            Optional list of **direct image/video file URLs** that aren't placed
            inline in the script. WideCast downloads each (image → + thumbnail)
            and adds them to the **first scene's** media library, so the scene
            editor lists them and the user can drop any into any scene — no
            separate media-picker step. Use for images you have but can't
            confidently match to a beat (inline the ones you can). Best-effort:
            applies on the scene-producing path (text/idea/blog, output_type
            scene/video); ignored for output_type='text' / media sources. Same
            rule as inline URLs: direct file links only, never fabricated.
        wait_for_render:
          type: boolean
          default: false
          description: |
            If true, block up to 60s waiting for completion. If the deadline hits
            before completion, return the in-flight state and let the client poll.
        callback_url:
          type: string
          format: uri
          nullable: true
          description: |
            HTTPS URL that will receive a POST when the video completes or fails.
            **Accepted but not delivered in pilot — see ROADMAP Phase 1 webhooks.**
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary key-value pairs stored alongside the video and echoed back on status. Max 16 keys, 500 chars each.

    ExportVideoRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: '^widecast[a-zA-Z0-9]{12,32}$'
          description: |
            `topic_id` returned by `/v1/create_video`. The video must have
            reached `scenes_ready_for_review` (HTTP 409 otherwise).
          example: widecast7c0d4f8a9b1e2d3f
        user_confirmed_render:
          type: boolean
          description: |
            Confirmation flag for AI agents calling via MCP or ChatGPT Action.
            **MCP callers**: REQUIRED (the MCP wrapper rejects calls where
            this is missing or false). **ChatGPT Action callers**: should set
            true after asking the user "Render the final video now, or do
            you want to review the scenes first?" and getting an explicit
            yes. **SDK / curl / Postman callers**: this field is ignored by
            the REST endpoint. Each export is a new decision — never infer
            from earlier in the conversation; even if the user wanted the
            final video originally, ask again each time.

    ModifySceneRequest:
      type: object
      required: [id, by, value, fields]
      properties:
        id:
          type: string
          description: |
            `topic_id` from `/v1/create_video` / `/v1/video_data`. Same id
            used by `/v1/status` and `/v1/export_video`. Accepts both
            `widecast...` and legacy/current `gubo...`. The video must have
            reached `scenes_ready_for_review` (HTTP 409 otherwise).
          example: widecast7c0d4f8a9b1e2d3f
        by:
          type: string
          enum: [id, voice_file, text]
          description: |
            How to pick the scene.
              * `voice_file` — **preferred**. Exact match on the stable
                per-scene UID (also the base of `{voice_file}_spec.json`).
                `segment.id` is only display/order metadata and may change
                after reorder/add/delete.
              * `id` — exact match on the current `segment.id` order/display.
                Use only when you already have it.
              * `text` — fuzzy match against `segment.text`. Multi-match
                returns a 200 `ClarificationResponse` — pass `candidates`
                to the user and re-call with `by="voice_file"`.
          example: voice_file
        value:
          oneOf:
            - { type: string }
            - { type: number }
          description: The voice_file / id / narration snippet to match.
          example: XcR0k
        fields:
          type: array
          minItems: 1
          description: |
            Edits to apply. Pick exactly **one family** per call. The only
            intentional multi-family call is `layout.batch`, which composes
            layout-only children.

            **(A) Background media swap** — `mediaUrl` (+ optional
            `mediaType`). Roll-aware.

            **(B) Upload Overlay** — `remotion.upload_overlay`. Free, agent-
            supplied image → Remotion spec (NOT Regenerate, which is paid).

            **(C) Remotion object-layer rect** (PREFERRED overlay layout) —
            `remotion.object.rect`. Read `boxes.remotion.object_layer.objects`
            from `/v1/scene_geometry` first; pass back `{layout_id, x?, y?,
            w?, h?, coordinate_space:"preview"|"canvas"}`. Server maps the
            rect onto raw Storyboard objects while keeping the group wrapper
            unchanged. For `one_by_one`, scene_geometry exposes ONE logical
            `*.one_by_one` rect that transforms all timed sequence items
            together.

            **(D) Remotion group rect** — `remotion.group.rect` (low-level
            wrapper edit; prefer (C) for visible overlay layout).
            `{element_id?, x?, y?, w?, h?, coordinate_space, resize_mode?}`.

            **(E) Narrator layout rect** — `overlay.narrator.rect` (or
            field-by-field `overlay.narrator.x|y|w|h`) in 280×498 preview
            coords. Preserves narrator metadata + source-space
            `segment.narrator_face`.

            **(F) Caption Y layout** — `overlay.caption.y` (number) in
            280×498 preview coords. Only Y; no text / x / w / h / style.

            **(G) Layout batch** — `layout.batch` with
            `value:{fields:[...]}` OR multiple layout fields directly.
            Allowed children: `overlay.narrator.*`, `overlay.caption.y`,
            `remotion.object.rect`, `remotion.group.rect`.

            **(H) Upload voice** — `voice.upload` (URL string or `{url,
            filename?, content_type?}`); async; queued.

            **(I) Upload narrator video** — `narrator.upload_video` (URL
            string or `{url, filename?, content_type?}`); async; queued.

            **(J) Roll switch** — `roll.active` (`"A"|"B"`) or
            `roll.switch` (`"toggle"`); sync data switch.

            **(K) Segment text** — `segment.text` (string or `{text}`);
            sync, rebuilds word timings from existing audio.

            **(L) Scene metadata** — pick from `pattern`, `visual`,
            `keyword`, `quote`, `talking_point`, `type`, `sub_mode` (or
            `segment.<name>`/`scene.<name>` forms). `pattern`/`type` are
            validated against ai_segment_text allow-lists.

            **(M) Remotion add element** — `remotion.add_element`. Send
            ONE field, append-only. `value = {kind, value?, label?,
            url?, position?, rect?, style_token?, emphasis?}` OR a bare
            string for `kind="text"`. `kind` ∈ {`text`, `stat`, `label`,
            `callout`, `image`}. Returns a new `layout_id` — follow up
            with `layout.batch` carrying a matching `remotion.object.rect`
            for safe-zone placement.

            **(N) Disable overlay** — `disable_overlay` (aliases:
            `remotion.disable_overlay`, `overlay.disable`,
            `remotion_spec.none`). `value` may be `true`, the string
            `"none"`, or `{enabled:false}`. Sets
            `segment.remotion_spec="none"` without deleting the
            `{voice_file}_spec.json` / overlay-poster files. Must be
            sent ALONE. Re-enable later via (B) Upload Overlay.
          items:
            type: object
            required: [field_name, value]
            properties:
              field_name:
                type: string
                enum:
                  - mediaUrl
                  - mediaType
                  - remotion.upload_overlay
                  - remotion.add_element
                  - disable_overlay
                  - remotion.disable_overlay
                  - overlay.disable
                  - remotion_spec.none
                  - remotion.object.rect
                  - remotion.group.rect
                  - overlay.narrator.rect
                  - overlay.narrator.x
                  - overlay.narrator.y
                  - overlay.narrator.w
                  - overlay.narrator.h
                  - overlay.caption.y
                  - layout.batch
                  - voice.upload
                  - narrator.upload_video
                  - roll.active
                  - roll.switch
                  - segment.text
                  - pattern
                  - visual
                  - keyword
                  - quote
                  - talking_point
                  - type
                  - sub_mode
                example: remotion.object.rect
              value:
                description: |
                  Family-dependent. URL string for `mediaUrl` /
                  `remotion.upload_overlay` / `voice.upload` /
                  `narrator.upload_video`. `"image"`|`"video"` for
                  `mediaType`. Object `{layout_id, x?, y?, w?, h?,
                  coordinate_space}` for `remotion.object.rect`. Object
                  `{element_id?, x?, y?, w?, h?, coordinate_space,
                  resize_mode?}` for `remotion.group.rect`. Object
                  `{x, y, w, h, visible?, animation?, borderRadius?}` for
                  `overlay.narrator.rect`. Number for individual narrator
                  axes and `overlay.caption.y`. Object `{fields:[...]}`
                  for `layout.batch`. `"A"`|`"B"` for `roll.active`,
                  `"toggle"` for `roll.switch`. String for `segment.text`
                  and metadata fields. Object `{kind, value?, label?,
                  url?, position?, rect?, style_token?, emphasis?,
                  entry?, delay_sec?, z_index?, element_z_index?}` (or
                  bare string for kind=text) for `remotion.add_element`.
        op:
          type: string
          default: set
          description: Reserved. Defaults to `set`.
        min_score:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: |
            Only when `by="text"`. Acceptance threshold for fuzzy match.
            Lower cautiously for paraphrases; raising past 0.9 usually
            causes false negatives because exact text rarely matches
            verbatim.
      description: |
        Body for POST /v1/modify_scene. SYNCHRONOUS, no credit charged. On
        ambiguous text match the response is a 200 `ClarificationResponse`
        — no edit applied, retry with `by="voice_file"`. Successful edits
        publish MQTT realtime to every open editor for this video.

    SceneCandidate:
      type: object
      description: |
        One ambiguous-match candidate returned when `by="text"` could not
        decide between two or more scenes. Use `voice_file` (preferred) or
        `segment_id` to call /v1/modify_scene again with `by="voice_file"`.
      properties:
        segment_id: { type: integer, description: "segment.id of the candidate." }
        voice_file: { type: string, description: "Stable per-scene uid." }
        score: { type: number, description: "Fuzzy-match score 0..1." }
        text: { type: string, description: "First ~80 chars of the scene's narration (preview)." }

    SceneModifiedResponse:
      type: object
      required: [object, id, voice_file]
      description: |
        Success body for POST /v1/modify_scene. Shape varies slightly
        across the three edit families (media / upload_overlay /
        group_rect); fields not relevant to the family are omitted.
      properties:
        skill_required:
          $ref: '#/components/schemas/SkillRequiredHint'
          description: |
            Backup signal — see SkillRequiredHint. Tells the agent to load the editing skill BEFORE continuing.
        object: { type: string, const: scene_modified }
        id: { type: string, description: "topic_id (same as the request)." }
        topic_id: { type: string }
        company_id: { type: string }
        action: { type: string, const: scene_modified }
        event: { type: string, const: scene_modified }
        scene_id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: 'null' }
          description: "segment.id of the scene that was edited (current display/order only — voice_file is the stable id)."
        voice_file: { type: string, description: "Stable per-scene UID of the edited scene." }
        score:
          type: number
          description: |
            Resolution confidence (1.0 for `by="id"`/`by="voice_file"`; fuzzy
            score for `by="text"`).
        applied:
          oneOf:
            - { type: string }
            - { type: object }
          description: |
            Which family of edits ran + family-specific details. Older
            media-only responses carried a string (`"media"`); current
            responses carry an object with `cost`, `uploaded_overlay_url`,
            or `group_rect_summary` depending on the family.
        media_type:
          type: string
          enum: [image, video]
          description: Set when the background media branch ran. Resolved asset type.
        media_url:
          type: string
          description: Set when the background media branch ran. The URL agent supplied.
        segment:
          type: object
          description: |
            The full updated segment as stored after the edit (deep-copy,
            so caller can compare before/after). Includes `mediaUrl`,
            `brollUrl`, `overlay.*`, `remotion_spec`, etc. — same shape as
            entries in `/v1/video_data.segments`.
        remotion_spec_updated:
          type: boolean
          description: True when the edit produced a new `{voice_file}_spec.json` (overlay upload / group rect).
        remotion_spec_file:
          type: string
          description: Canonical `{voice_file}_spec.json`.
        remotion_spec_url:
          type: string
          format: uri
          description: Cache-busted public spec URL (`?v=<mtime>`); empty when state ≠ ready.
        remotion_spec_version:
          type: string
          description: mtime token used for cache-busting.
        remotion_spec_state:
          type: string
          enum: [ready, missing, disabled]
        remotion_spec_exists:
          type: boolean
        uploaded_overlay_url:
          type: string
          description: Set on the Upload Overlay branch (the image URL the agent supplied).
        cost:
          type: number
          description: Set on the Upload Overlay branch — always 0 (free path).
        layout_batch_updated:
          type: boolean
          description: True when the call ran the `layout.batch` composer.
        narrator_layout_updated:
          type: boolean
          description: True when a narrator rect / axis edit was applied (single-field or as a layout.batch child).
        caption_layout_updated:
          type: boolean
          description: True when an `overlay.caption.y` edit was applied (single-field or as a layout.batch child).
        remotion_object_updated:
          type: boolean
          description: True when `remotion.object.rect` was applied (single-field or as a layout.batch child).
        remotion_element_added:
          type: boolean
          description: |
            True when the (M) `remotion.add_element` branch ran. The
            `applied` object on this branch carries the new
            `element_id`, `object_id`, `layout_id` (= `{element_id}.{object_id}`),
            `rect` (280×498 preview), `rect_canvas` (720×1280),
            `auto_fit: false`, `cost: "free_spec_append"`, and a
            `follow_up` hint pointing at the recommended
            `layout.batch` + `remotion.object.rect` placement step.
        overlay_disabled:
          type: boolean
          description: |
            True when the (N) `disable_overlay` branch ran —
            `segment.remotion_spec` was set to `"none"` (no
            `{voice_file}_spec.json` / overlay-poster files deleted).
            The `applied` object on this branch carries `before` (the
            prior `remotion_spec` value), `after: "none"`, and
            `idempotent: true` when the scene was already disabled.
        remotion_poster_file:
          type: string
          description: Canonical `{voice_file}_overlay_poster.png` — derived static overlay poster used by server-side scene_inspector screenshot fallback.
        remotion_poster_url:
          type: string
          format: uri
          description: Cache-busted public poster URL (`?v=<mtime>`); empty when state ≠ ready.
        remotion_poster_version:
          type: string
        remotion_poster_state:
          type: string
          enum: [ready, missing, disabled]
        remotion_poster_exists:
          type: boolean
        remotion_poster_warnings:
          type: array
          items: { type: object }
          description: Warnings emitted while rendering the static overlay poster (e.g. missing assets).
        roll_switched:
          type: boolean
          description: True on the A/B-roll branch.
        active_roll:
          type: string
          description: Set on the A/B-roll branch — the new active roll (`"A"` or `"B"`).
        show_narrator:
          type: boolean
          description: Set on the A/B-roll branch — whether the narrator is shown after the switch.
        message:
          type: string
          description: Short human-readable status (e.g. `"Scene layout updated."`).

    SceneUploadQueuedResponse:
      type: object
      required: [object, id, queue_id, status]
      description: |
        Async queued response for the `voice.upload` and
        `narrator.upload_video` branches of `/v1/modify_scene`. The edit is
        not yet visible — wait for MQTT
        `scene_voice_upload_applied` /
        `scene_narrator_upload_applied`, then call `/v1/video_data` to
        verify.
      properties:
        object:
          type: string
          enum: [scene_voice_upload_queued, scene_narrator_upload_queued]
        id: { type: string }
        topic_id: { type: string }
        company_id: { type: string }
        scene_id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: 'null' }
        voice_file: { type: string }
        score: { type: number }
        queue_id:
          type: string
          description: e.g. `gs_{topic_id}_{voice_file}` — share with the worker via MQTT.
        status:
          type: string
          enum: [queued]
        media_type:
          type: string
          enum: [audio, video]
        action: { type: string }
        event: { type: string }
        message: { type: string }
        applied:
          type: object
          properties:
            field_name:
              type: string
              enum: [voice.upload, narrator.upload_video]
            audio_url: { type: string, format: uri }
            video_url: { type: string, format: uri }
            queue_id: { type: string }
            bytes: { type: integer }
            extension: { type: string }
            cost: { type: string }
            async: { type: boolean, const: true }
        segment:
          type: object
          description: Snapshot of the resolved segment at queue time.

    SceneGeometryRequest:
      type: object
      required: [id]
      description: |
        Body for POST /v1/scene_geometry. Provide exactly one of:
          - `voice_file` (preferred shortcut),
          - `scene_id` (display/order; fallback),
          - or `by` + `value`.
        When neither shortcut is set and `by` is omitted, the request is
        rejected with `invalid_by`.
      properties:
        id:
          type: string
          description: |
            Topic id from `/v1/video_data` / `/v1/create_video`. Accepts
            `widecast...`, `gubo...`, or current ids.
          example: widecast7c0d4f8a9b1e2d3f
        by:
          type: string
          enum: [id, voice_file, text]
          description: |
            How to pick the scene. Prefer `voice_file`. Use `text` only
            when the user names a scene by narration; multi-match returns
            a `ClarificationResponse`.
        value:
          oneOf:
            - { type: string }
            - { type: number }
          description: The id / voice_file / narration snippet to inspect.
        voice_file:
          type: string
          description: Stable per-scene UID — preferred shortcut (server folds into `by="voice_file"`).
          example: XcR0k
        scene_id:
          oneOf:
            - { type: string }
            - { type: number }
          description: Current display/order id — fallback only.
        min_score:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: Only when `by="text"`. Fuzzy-match threshold.
        include_diagnostics:
          type: boolean
          default: false
          description: |
            Optional debug flag. When `true`, the response also carries
            `violations[]`, `warnings[]`, `summary.error_count` /
            `summary.warning_count`, and the `remotion_poster_*` keys
            inside `remotion_spec`. Default is `false` because mechanical
            linter output is debug-only — vision-capable agents should
            judge aesthetics from a screenshot via `/v1/scene_inspector`,
            and LLM-only agents should proceed with the rects +
            `boxes.narrator.face` to keep overlays out of the face.

    SceneGeometryResponse:
      type: object
      required: [object, topic_id, voice_file, coordinate_space, boxes]
      description: |
        Data-only scene layout geometry. Every box is in
        **280×498 editor-preview** coordinates unless explicitly suffixed
        with `_canvas` (Remotion 720×1280 canvas).

        **Mechanical linter output is stripped by default.** `violations`,
        `warnings`, `summary.error_count`, and `summary.warning_count`
        are only present when the request included
        `include_diagnostics: true`.
      properties:
        skill_required:
          $ref: '#/components/schemas/SkillRequiredHint'
          description: |
            Backup signal — see SkillRequiredHint. Tells the agent to load the editing skill BEFORE continuing.
        object: { type: string, const: scene_geometry }
        id: { type: string, description: topic_id (echoed). }
        topic_id: { type: string }
        company_id: { type: string }
        scene_id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: 'null' }
        voice_file: { type: string }
        score: { type: number }
        coordinate_space:
          type: object
          description: '{width: 280, height: 498, unit: editor_preview_px}'
        safe_zones:
          type: object
          properties:
            dead_top: { type: object, description: 'Top 10% reserved.' }
            dead_bottom: { type: object, description: 'Bottom 25% reserved.' }
            safe_rect: { type: object }
        scene:
          type: object
          properties:
            text: { type: string }
            talking_point: { type: string }
            type: { type: string }
            pattern: { type: string }
            keyword: { type: string }
            visual: { type: string }
            quote: { type: string }
            show_narrator: { type: boolean }
            active_roll: { type: string }
        boxes:
          type: object
          properties:
            narrator:
              type: object
              description: |
                `{rect, visible, face_source, face, face_center,
                face_coordinate_space_note}`. `face` is the displayed face
                box — converted from source-space `segment.narrator_face`
                through the current `overlay.narrator.rect`. Do NOT mutate
                `segment.narrator_face` for layout edits.
              properties:
                rect: { type: object }
                visible: { type: boolean }
                face_source: { type: object, nullable: true }
                face: { type: object, nullable: true }
                face_center: { type: object, nullable: true }
                face_coordinate_space_note: { type: string }
            caption:
              type: object
              description: |
                `{container_rect, text_rect_estimate, visible}`. Read-only
                for layout decisions; only `overlay.caption.y` is mutable.
              properties:
                container_rect: { type: object }
                text_rect_estimate: { type: object, nullable: true }
                visible: { type: boolean }
            remotion:
              type: object
              description: |
                Remotion Storyboard boxes.
                  - `object_layer.objects[]` is the **agent-facing**
                    layer: each item has `layout_id`, `rect`,
                    `rect_canvas`, `temporal_policy`, and the update
                    field name to pass back to `/v1/modify_scene`
                    (`remotion.object.rect`).
                  - `groups[]`, `objects[]`, `sequence_objects[]` are
                    lower-level debug data.
              properties:
                groups: { type: array, items: { type: object } }
                objects: { type: array, items: { type: object } }
                object_layer:
                  type: object
                  properties:
                    objects:
                      type: array
                      items:
                        type: object
                        properties:
                          layout_id: { type: string }
                          rect: { type: object }
                          rect_canvas: { type: object }
                          temporal_policy: { type: string }
                          update_field:
                            type: string
                            const: remotion.object.rect
                sequence_objects: { type: array, items: { type: object } }
        remotion_spec:
          type: object
          description: |
            Metadata for the loaded `{voice_file}_spec.json` —
            file/url/version/state. The internal `remotion_poster_*`
            keys (file, url, version, state, exists, warnings) are
            stripped by default; pass `include_diagnostics: true` to
            surface them.
        violations:
          type: array
          items: { type: object }
          description: |
            **Diagnostic only — present only when
            `include_diagnostics=true`.** Collision codes (error /
            warning / info severity) such as
            `remotion_object_overlaps_narrator_face`,
            `remotion_object_in_top_dead_zone`,
            `remotion_group_in_bottom_dead_zone`,
            `caption_text_overlaps_narrator_face`. Vision-capable
            agents should judge collisions from a screenshot instead.
        warnings:
          type: array
          items: { type: object }
          description: |
            **Diagnostic only — present only when
            `include_diagnostics=true`.** Soft signals such as
            `remotion_object_too_small_for_mobile`,
            `narrator_face_outside_narrator`, `missing_narrator_face`.
        summary:
          type: object
          properties:
            error_count:
              type: integer
              description: '**Diagnostic only — present only when `include_diagnostics=true`.**'
            warning_count:
              type: integer
              description: '**Diagnostic only — present only when `include_diagnostics=true`.**'
            remotion_object_count: { type: integer }
            remotion_object_layer_count: { type: integer }
            remotion_sequence_object_count: { type: integer }
            remotion_group_count: { type: integer }
            remotion_temporal_policies:
              type: array
              items: { type: string }
            remotion_geometry_basis: { type: string }
        request_id: { type: string }

    AssetResponse:
      type: object
      required: [object, url, content_type, size_bytes, expires_at, ttl_hours]
      description: |
        Success body for POST /v1/upload_asset (multipart or JSON+base64). The
        `url` is publicly reachable (S3 anonymous-read), valid for **24
        hours** before the bucket lifecycle rule on the `assets/` prefix
        deletes the object.
      properties:
        object:
          type: string
          const: asset
        url:
          type: string
          format: uri
          description: Public S3 URL — pass into /v1/create_video as audio_url / video_url, or use as an inline `![](url)` in script_text.
          example: "https://widecast-assets.s3.us-west-1.amazonaws.com/assets/huubinhnguyen/4f1a3b9c…d2.mp3"
        content_type:
          type: string
          description: The Content-Type the object was stored with (may differ from the request if defaulted from the extension).
          example: "audio/mpeg"
        size_bytes:
          type: integer
          description: Bytes stored.
        filename:
          type: string
          description: Original basename of the upload (≤128 chars). For tracking only; not part of the URL path.
          example: "voice_memo.mp3"
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the bucket lifecycle rule will delete the object.
          example: "2026-06-16T12:36:39Z"
        ttl_hours:
          type: integer
          description: TTL relative to upload time, in hours.
          example: 24

    AssetPresignRequest:
      type: object
      required: [mode, filename]
      description: |
        Request body for POST /v1/upload_asset with `mode: "presign"` — the
        path AI agents take (MCP can't carry binary). Server mints an S3 PUT
        URL the caller uses directly. No bytes through this call.
      properties:
        mode:
          type: string
          const: presign
        filename:
          type: string
          maxLength: 256
          description: Original filename — used to pick the S3 extension (`.mp4`, `.mp3`, `.png`, …). Basename only; any path is stripped.
        content_type:
          type: string
          description: Optional MIME type. Used by the downstream pipeline only (informational) — NOT bound to the S3 signature, so the caller does NOT need to echo it back on the PUT.

    AssetUploadJSONRequest:
      type: object
      required: [file_data, filename]
      description: |
        Legacy / small-file JSON body — bytes inline as base64. Server cap
        500 MB decoded; the MCP transport caps you to ~25 MB per call, so
        agents take the `AssetPresignRequest` path instead.
      properties:
        file_data:
          type: string
          format: byte
          description: Raw asset bytes, **base64-encoded**. No `data:...;base64,` prefix needed (silently stripped).
        filename:
          type: string
          maxLength: 256
          description: Original filename — used to pick the on-disk extension (`.mp4`, `.mp3`, `.png`, …).
        content_type:
          type: string
          description: Optional MIME type (e.g. `audio/mpeg`, `video/mp4`, `image/jpeg`, `text/html`, `application/pdf`, `text/markdown`). Falls back to detection from the filename extension if omitted.

    AssetPresignResponse:
      type: object
      required: [object, put_url, get_url, url, key, content_type, headers_required, max_bytes, put_expires_at, expires_at, ttl_hours]
      description: |
        Success body for POST /v1/upload_asset with `mode: "presign"`. The
        caller PUTs the asset bytes to `put_url` (must echo back the
        `headers_required` Content-Type), then uses `get_url` as their public
        URL. `put_url` is valid for 1 hour; `get_url` resolves for 24 hours
        after the PUT lands (bucket lifecycle).
      properties:
        object:
          type: string
          const: asset_presign
        put_url:
          type: string
          format: uri
          description: Pre-signed S3 PUT URL. PUT your bytes here with the headers in `headers_required`. Valid for 1 hour.
        get_url:
          type: string
          format: uri
          description: Public S3 URL — pass into /v1/create_video as audio_url / video_url, or use as an inline `![](url)` in script_text.
        url:
          type: string
          format: uri
          description: Alias for `get_url`.
        key:
          type: string
          description: S3 object key (`assets/{company_id}/...`).
        content_type:
          type: string
          example: "audio/mpeg"
        filename:
          type: string
        headers_required:
          type: object
          additionalProperties:
            type: string
          description: |
            Headers the caller MUST add to the PUT. Empty by design — the
            signature only binds `host`, so `curl -X PUT --upload-file <file>
            "<put_url>"` (no extra headers) works as-is across HTTP clients.
        max_bytes:
          type: integer
          description: Hard server cap on the PUT body size, in bytes.
        put_expires_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when `put_url` stops being accepted.
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the bucket lifecycle rule will delete the object.
        ttl_hours:
          type: integer
          description: TTL relative to upload time, in hours.
          example: 24

    TelegramSendRequest:
      type: object
      required: [message]
      description: |
        Body for `POST /v1/telegram/send`. The recipient chat is resolved
        server-side from the API key's company doc — there is no
        `chat_id` / `to` field by design (prevents using WideCast as a
        Telegram spam relay).
      properties:
        message:
          type: string
          maxLength: 4000
          description: |
            Text body in plain-text mode, OR the caption when `photo_url` /
            `video_url` is set. Telegram caps captions at 1024 bytes — the
            server pre-validates and returns `message_too_long` (400) if
            you exceed that in caption mode.
        parse_mode:
          type: string
          enum: [Markdown, MarkdownV2, HTML]
          description: |
            Optional Telegram formatting mode. Omit for plain text. `HTML`
            supports a small tag subset (b, i, u, s, code, pre, a); the
            server strips other tags.
        photo_url:
          type: string
          format: uri
          description: |
            Optional photo to attach. Public http(s) URL — Telegram
            downloads it server-side. Mutually exclusive with `video_url`.
        video_url:
          type: string
          format: uri
          description: |
            Optional video to attach. Public http(s) URL — Telegram
            downloads it server-side. Mutually exclusive with `photo_url`.

    TelegramMessageResponse:
      type: object
      required: [object, status, delivery, media_kind, request_id]
      description: |
        Success body for POST /v1/telegram/send. `delivery` discriminates
        which channel was used:
          * `telegram` → `chat_id_masked` + `telegram_message_id` are set,
            email-fallback fields are absent.
          * `email` → `recipient_email_masked`, `fallback_reason`, `setup_url`,
            and `note` are set; Telegram fields are absent.
      properties:
        object:
          type: string
          const: telegram_message
        status:
          type: string
          const: sent
        delivery:
          type: string
          enum: [telegram, email]
          description: |
            Which channel actually delivered the message. `telegram` when
            the user has connected; `email` when they haven't (fallback).
        media_kind:
          type: string
          enum: [text, photo, video]
        chat_id_masked:
          type: string
          example: "…1234"
          description: Set only when `delivery="telegram"`. `…` + last 4 digits of the user's chat_id.
        telegram_message_id:
          type: integer
          nullable: true
          description: Set only when `delivery="telegram"`. Upstream Telegram message_id for later edit/delete.
        recipient_email_masked:
          type: string
          example: "u***n@example.com"
          description: Set only when `delivery="email"`. Email of the account that received the fallback.
        fallback_reason:
          type: string
          example: telegram_not_connected
          description: Set only when `delivery="email"`. Why the fallback fired.
        setup_url:
          type: string
          format: uri
          example: "https://widecast.ai/#setup"
          description: Set only when `delivery="email"`. Send the user here to connect Telegram so future calls land in Telegram instead.
        note:
          type: string
          description: Set only when `delivery="email"`. Human-readable explanation the caller can relay to the user.
        request_id:
          type: string

    CreateContentRequest:
      type: object
      required: [content, content_type, language]
      properties:
        content:
          type: string
          description: |
            What the content is created from: a URL, an idea/topic description,
            or pasted text.
          example: "https://example.com/some-article"
        content_type:
          type: string
          enum: [blog, facebook, x, linkedin]
          default: blog
          description: |
            What to write: `blog` (long-form), `facebook`, `x` (Twitter/X), or
            `linkedin` post. Maps to the legacy content_type 3/4/5/6 internally.
          x-widecast-enum-locked: true
        language:
          type: string
          description: Output language (e.g. "English", "Vietnamese").
          example: English
        callback_url:
          type: string
          format: uri
          description: Optional HTTPS webhook for completion events.
        metadata:
          type: object
          description: Optional key-value pairs echoed back on /v1/status.
      description: |
        Body for POST /v1/create_content. Async — returns a widecast* id +
        `result.review_url` (the content viewer) in the create response itself
        (share immediately; viewer shows a spinner). Poll GET /v1/status/{id}
        until `completed` for the final state.

    # EnhanceScriptRequest schema withdrawn 2026-06-21 (Round 28) along
    # with the /v1/enhance_script operation. REST endpoint still serves the
    # dashboard UI but the request shape isn't part of the public spec
    # anymore (SDK + MCP tool also removed).

    CreateImageRequest:
      type: object
      required: [prompt]
      description: |
        Body for POST /v1/create_image. Charges 1 credit per image
        generated (count=4 → 4 credits).
      properties:
        prompt:
          type: string
          maxLength: 2000
          description: |
            Image description. Concrete visual nouns work better than
            abstract concepts — "a wooden ladder against a red brick wall,
            morning light" beats "climbing the corporate ladder".
        ratio:
          type: string
          enum: [portrait, landscape, square]
          default: portrait
          description: |
            Output aspect ratio. `portrait`=768×1344 (Reels/TikTok/Shorts),
            `landscape`=1344×768 (YouTube/blog hero), `square`=768×768 (IG feed).
        count:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
          description: |
            How many variations to generate in one call. Each = 1 credit.
            Use `count=3..4` when the user wants options to pick from.
        topic_id:
          type: string
          description: |
            Optional. Link the generated image to an existing video's asset
            folder so the scene editor can reuse it. Omit for freeform.

    GeneratedImage:
      type: object
      required: [number, url, thumbnail_url, ratio]
      properties:
        number:
          type: integer
          description: 1-based index — agents render a numbered thumbnail list keyed off this.
        url:
          type: string
          format: uri
          description: Public URL to the full-resolution image asset.
        thumbnail_url:
          type: string
          format: uri
          description: URL to use as the thumbnail (currently same as `url`).
        ratio:
          type: string
          enum: [portrait, landscape, square]

    ImageSetResponse:
      type: object
      required: [object, status, count, ratio, prompt, images, request_id]
      properties:
        object: { type: string, const: image_set }
        status:
          type: string
          enum: [completed, partial]
          description: |
            `completed` if every requested variant succeeded; `partial` if
            some variants failed (see `error` + the surviving `images`).
        count: { type: integer }
        ratio: { type: string, enum: [portrait, landscape, square] }
        prompt: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/GeneratedImage' }
        error:
          type: object
          description: Present only when `status == "partial"`.
          properties:
            code: { type: string }
            message: { type: string }
            failed_at_number: { type: integer }
        request_id: { type: string }

    SearchBrollRequest:
      type: object
      required: [keyword, kind]
      description: |
        Body for POST /v1/search_broll. Free.
      properties:
        keyword:
          type: string
          description: |
            Search keyword (1-3 words work best). Pexels/Pixabay token-match
            poorly with sentence-long queries — keep it tight.
          example: "umbrella rain"
        kind:
          type: string
          enum: [video, image]
          description: |
            What to search: `video` = stock CLIPS (Pexels/Pixabay/Shutterstock,
            broll.js Stock tab); `image` = real PHOTOS (Google, broll.js
            Photos tab).
        ratio:
          type: string
          enum: [portrait, landscape, square]
          default: portrait
          description: |
            Orientation hint. Only filters when `kind == "video"`. Image
            search ignores it (crop client-side if needed).
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
          description: Max results to return.

    BrollResult:
      type: object
      required: [number, type, url, thumbnail_url]
      properties:
        number:
          type: integer
          description: 1-based index — agents render a numbered thumbnail list keyed off this.
        type:
          type: string
          enum: [video, image]
        url:
          type: string
          format: uri
          description: Public URL to the full-resolution asset.
        thumbnail_url:
          type: string
          format: uri
        title: { type: string }
        source:
          type: string
          description: Origin (e.g. `pexels`, `pixabay`, `shutterstock`, `google_image`).
        duration:
          type: number
          description: Seconds. 0 for images.
        width: { type: number }
        height: { type: number }
        author:
          type: string
          description: Original creator/uploader (videos only).
        context_url:
          type: string
          description: Web page the image was crawled from (image results only).

    BrollSearchResponse:
      type: object
      required: [object, kind, keyword, total, results, request_id]
      properties:
        object: { type: string, const: list }
        kind: { type: string, enum: [video, image] }
        keyword: { type: string }
        ratio: { type: string, enum: [portrait, landscape, square] }
        total: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/BrollResult' }
        request_id: { type: string }

    VideoDataSegmentNarrator:
      type: object
      description: |
        Narrator block on a scene segment (face/voice clone or recorded
        media). All fields optional — populated only when the scene has a
        narrator configured (A-roll, or B-roll that opted-in to voiceover).
      properties:
        name: { type: string }
        voice_id: { type: string, description: Voice clone id. }
        face_id: { type: string, description: Face clone id. }
        audio_url: { type: string, format: uri }
        video_url: { type: string, format: uri }

    VideoDataSegment:
      type: object
      required: [voice_file, text, type]
      description: |
        One annotated scene/segment in the video_data response. Includes
        stable-identity fields and Remotion spec metadata for agent
        editing.
      additionalProperties: true
      properties:
        id:
          oneOf:
            - { type: string }
            - { type: number }
          nullable: true
          description: |
            Current display/order id. UNSTABLE — may change after
            reorder/add/delete. Use `voice_file` as the stable scene UID.
        order_id:
          oneOf:
            - { type: string }
            - { type: number }
          nullable: true
          description: Same as `id` (alias for clarity).
        voice_file:
          type: string
          description: |
            Stable per-scene UID. Pass as `value` with `by="voice_file"` to
            `/v1/modify_scene`. Also the base of the Remotion spec filename
            `{voice_file}_spec.json`.
        scene_uid:
          type: string
          description: Alias of `voice_file` for clarity.
        scene_index:
          type: integer
          description: 0-based index into the segments array (current order).
        text:
          type: string
          description: Narration (what the narrator says on this scene).
        talking_point:
          type: string
        visual:
          type: string
          description: Visual-direction hint (what the scene's visual should convey).
        quote:
          type: string
          description: Pull-quote (when the scene type uses one).
        keyword:
          type: string
          description: Single-word search keyword used for stock B-roll fallback.
        type:
          type: string
          description: Scene role — `A-roll` (narrator on screen), `B-roll` (background only), `thumbnail`, or empty.
        duration:
          type: number
          description: Length in seconds.
        mediaUrl:
          type: string
          description: Currently-shown background or A-roll overlay asset URL.
        mediaType:
          type: string
          description: '`image` or `video`.'
        brollUrl:
          type: string
          description: Pure B-roll URL (may differ from `mediaUrl` when an A-roll overlay was added).
        thumbnailUrl: { type: string }
        videoTrim:
          type: object
          description: '`{start, end}` trim values when the scene uses a video clip.'
        overlay:
          type: object
          description: |
            Legacy overlay block — `caption` + `narrator` rects in **280×498**
            editor preview coordinates. Distinct from the Remotion spec
            (which uses 720×1280 canvas coords).
          additionalProperties: true
        narrator: { $ref: '#/components/schemas/VideoDataSegmentNarrator' }
        remotion_spec:
          oneOf:
            - { type: string }
            - { type: 'null' }
          description: |
            Per-scene Remotion spec filename token (or `null`). `"none"`
            means the user intentionally disabled the overlay for that
            scene — agents must NOT auto-edit or re-enable unless the user
            asks.
        remotion_spec_file:
          type: string
          description: Canonical `{voice_file}_spec.json`.
        remotion_spec_url:
          type: string
          format: uri
          description: |
            Cache-busted public URL
            `https://widecast.ai/downloads/{company_id}/{topic_id}/{voice_file}_spec.json?v={mtime}`.
            Empty when state is `missing` or `disabled`.
        remotion_spec_version:
          type: string
          description: mtime token used for cache-busting.
        remotion_spec_exists:
          type: boolean
        remotion_spec_state:
          type: string
          enum: [ready, missing, disabled]
        remotion_poster_file:
          type: string
          description: |
            **Diagnostic only — present only when
            `include_diagnostics=true`.** Canonical
            `{voice_file}_overlay_poster.png` — derived static overlay
            poster used by server-side scene_inspector screenshot
            fallback.
        remotion_poster_url:
          type: string
          format: uri
          description: '**Diagnostic only — present only when `include_diagnostics=true`.** Cache-busted public poster URL (`?v=<mtime>`).'
        remotion_poster_version:
          type: string
          description: '**Diagnostic only — present only when `include_diagnostics=true`.**'
        remotion_poster_state:
          type: string
          enum: [ready, missing, disabled]
          description: '**Diagnostic only — present only when `include_diagnostics=true`.**'
        remotion_poster_exists:
          type: boolean
          description: '**Diagnostic only — present only when `include_diagnostics=true`.**'
        remotion_poster_warnings:
          type: array
          items: { type: object }
          description: '**Diagnostic only — present only when `include_diagnostics=true`.** Warnings emitted while rendering the static overlay poster.'
        agent_meta:
          type: object
          description: |
            Same metadata bundled for quick consumption:
            `stable_scene_id_field="voice_file"`, `stable_scene_id`,
            `order_field="id"`, `order_value`, `scene_index`,
            `remotion_spec` (same metadata; the inner `remotion_poster_*`
            keys are diagnostic-only — only present when
            `include_diagnostics=true`), `coordinate_spaces` (the
            720×1280 canvas + 280×498 preview maps).

    VideoDataGlobalSettings:
      type: object
      description: |
        Slim subset of the script's globalSettings — only user-facing
        fields surfaced (deeply nested render-only knobs are not in this
        public response). Currently: `aspectRatio`, `voice_type`,
        `avatar_type`, `last_voice_type`, `last_avatar_type`.
      additionalProperties: true
      properties:
        aspectRatio:
          type: string
          enum: [portrait, landscape, square]
        voice_type: { type: string }
        avatar_type: { type: string }
        last_voice_type: { type: string }
        last_avatar_type: { type: string }

    SceneIdentityGuide:
      type: object
      description: Machine-readable scene-identity rules embedded in /v1/video_data responses.
      properties:
        stable_scene_id_field:
          type: string
          const: voice_file
        order_field:
          type: string
          const: id
        notes:
          type: array
          items: { type: string }

    SkillRequiredHint:
      type: object
      description: |
        Backup signal stamped on every successful JSON response from the 4
        edit-flow endpoints (`/v1/video_data`, `/v1/scene_geometry`,
        `/v1/scene_inspector`, `/v1/modify_scene`). Tells the agent: "you
        reached this endpoint without first loading the editing skill — do
        so now." Skip it only if you have ALREADY loaded
        `GET /v1/skills/editing` earlier in the session. Idempotent;
        emitting on every call is cheap, and the agent learns once.
      properties:
        name:
          type: string
          example: video-editing
        load_via_tool:
          type: string
          description: "MCP tool name to call (when running via MCP)."
          example: widecast_get_editing_skill
        load_via_rest:
          type: string
          description: "REST endpoint to call (when running via HTTP/SDK)."
          example: "GET /v1/skills/editing"
        reason:
          type: string
        user_intent_hint:
          type: string

    VideoDataResponse:
      type: object
      required: [object, id, topic_id, delivery_mode, data, instructions, review_url, request_id]
      description: |
        **URL-RESPONSE ENVELOPE.** Default delivery mode is
        `download_url`: the server publishes the full video_data tree to
        a temporary public JSON file on `origin.widecast.ai` and the
        response carries `data.url` + size + 15-min TTL + a 3-step
        `instructions` block. The agent must `curl <data.url> -o
        video_data.json` and Read locally; the full tree is NOT inlined
        in this response. This bypasses MCP per-tool-call output caps
        that previously truncated 50–300 KB payloads mid-JSON. Every
        call publishes a NEW unique file (token = 16 hex chars) so URLs
        are never reused — matches the realtime semantics of video
        data. Host is `origin.widecast.ai` (CF-bypassed) +
        `?v=<mtime>` cache-bust. Server only responds AFTER the JSON is
        fsynced + atomically renamed, so the URL is guaranteed
        readable. The published JSON file shape is unchanged: top-level
        `object`/`id`/`topic_id`/`aspect_ratio`/`title`/`language`/
        `total_segments`/`total_duration`/`scene_identity`/`segments[]`/
        `global_settings`/`review_url`/`request_id`. Operators can flip
        to legacy inline mode with env flag
        `WIDECAST_VIDEO_DATA_DELIVERY_MODE=inline_content`.
      properties:
        skill_required:
          $ref: '#/components/schemas/SkillRequiredHint'
          description: |
            Backup signal — see SkillRequiredHint. Tells the agent to load the editing skill BEFORE continuing.
        object: { type: string, const: video_data }
        id: { type: string }
        topic_id: { type: string }
        delivery_mode:
          type: string
          enum: [download_url, inline_content]
          description: |
            `download_url` (default) → `data` carries a URL pointer; agent fetches the JSON file.
            `inline_content` → legacy mode (set via env flag); the full video_data tree is inlined.
        data:
          type: object
          required: [url, mime_type, bytes, expires_at, ttl_seconds]
          description: Pointer to the published JSON file. Set when `delivery_mode="download_url"`.
          properties:
            url:
              type: string
              format: uri
              description: Public `origin.widecast.ai` URL with `?v=<mtime>` cache-bust.
            mime_type: { type: string, const: application/json }
            bytes: { type: integer }
            expires_at:
              type: string
              format: date-time
              description: ISO-8601 UTC timestamp — ~15 min after publish.
            ttl_seconds: { type: integer, const: 900 }
        instructions:
          type: string
          description: 3-step setup the agent should follow (mkdir + curl + Read).
        next_action: { type: string }
        meta: { type: object }
        review_url:
          type: string
          format: uri
          description: Scene-editor URL — opens this video in the dashboard's editor for review/edit.
        request_id: { type: string }

    SceneInspectorRequest:
      type: object
      required: [id, action]
      description: Body for POST /v1/scene_inspector.
      properties:
        id:
          type: string
          description: Topic id from `/v1/video_data` / scene_editor. Accepts widecast..., gubo..., or current topic ids.
        action:
          type: string
          enum:
            - list_live_editors
            - list_instances
            - get_preview_state
            - get_scene_dom_snapshot
            - get_computed_boxes
            - screenshot_scene_280x498
            - overlay_poster
            - activate_scene
            - reload_preview
            - pause_preview
            - play_preview
            - seek_preview
          description: |
            Inspector action. Prefer `get_computed_boxes` /
            `get_scene_dom_snapshot` for structural audit. Use
            `screenshot_scene_280x498` for the composite scene visual
            (background + Remotion overlay poster + narrator +
            caption). Use `overlay_poster` to audit ONLY the overlay
            on a solid black canvas — the composite screenshot can
            hide readability / typos / grammar / diacritic / glyph
            issues that the background image masks. Both actions
            return a 15-minute public JPEG URL and are pure
            server-side compositors.
        scene_id:
          oneOf:
            - { type: string }
            - { type: number }
          description: Current display/order scene id. Prefer `voice_file` when available.
        voice_file:
          type: string
          description: Stable per-scene UID from `/v1/video_data`; preferred selector.
        selector:
          type: string
          description: Optional DOM selector scoped to the target preview root (used by `get_scene_dom_snapshot` / `get_computed_boxes`). Avoid broad selectors.
        activate:
          type: boolean
          description: Allow the elected browser to activate/load the requested scene before inspecting. May visibly switch the open editor scene for that user.
        seek_seconds:
          type: number
          description: Optional seek time for `seek_preview` or screenshot capture.
        timeout_ms:
          type: integer
          description: Command timeout. Default ~7000ms (server clamps 1000-15000ms).
        probe_timeout_ms:
          type: integer
          description: Foreground election window. Default ~800ms (server clamps 150-2000ms).
        options:
          type: object
          description: Advanced action-specific options.

    SceneInspectorResponse:
      type: object
      required: [object, status, code, request_id, action, topic_id]
      description: |
        Outcome of a live inspector call. `status` discriminates the
        downstream branches an agent should take.
      properties:
        skill_required:
          $ref: '#/components/schemas/SkillRequiredHint'
          description: |
            Backup signal — see SkillRequiredHint. Tells the agent to load the editing skill BEFORE continuing.
        object: { type: string, const: scene_inspector_result }
        status:
          type: string
          enum: [completed, error, unavailable]
        code:
          type: string
          description: |
            `ok` | `no_live_editor` | `no_active_editor` |
            `unsupported_action` | `publisher_missing` |
            `mqtt_publish_failed` | `browser_error` |
            `screenshot_publish_failed` (composed but couldn't be
            persisted to disk — HTTP 500) | `overlay_not_available`
            (scene has no Remotion overlay poster — HTTP 409) |
            `overlay_publish_failed` (overlay JPEG couldn't be
            persisted — HTTP 500). Successful `screenshot_scene_280x498`
            calls return this JSON envelope with `code: "ok"` and
            `result.screenshot.url`; successful `overlay_poster` calls
            return `code: "ok"` and `result.overlay_poster.url` plus
            `result.review_checklist`. Both actions are pure
            server-side compositors — successful compose is always
            `code: "ok"` regardless of live-editor presence.
        request_id: { type: string }
        action: { type: string }
        topic_id: { type: string }
        company_id: { type: string }
        selected_browser:
          type: object
          description: Tab metadata for the elected browser (set only when `status="completed"`).
        result:
          type: object
          description: Action-specific result payload from the elected browser.
        editors:
          type: array
          items: { type: object }
          description: Set only when `action="list_live_editors"`.

    CollectIdeasRequest:
      type: object
      required: [product_service_input]
      properties:
        product_service_input:
          type: string
          minLength: 10
          description: Describe the product/service to brainstorm ideas from (≥ 10 chars).
          example: "A budgeting app for freelancers with tax estimates"
        sub_industry:
          type: string
        user_location:
          type: string
          description: |
            Where the user is based (city/state/country). Used as a hint; can
            differ from `target_location` (a Vietnam-based agency may target
            a US audience).
          example: "Vietnam"
        target_location:
          type: string
          description: |
            **Required (semantically).** Audience market the videos should
            target (city/state/country). Drives which local trends, sources,
            and language are used. If you call without this AND the account
            doesn't have one cached, the API returns **HTTP 200** with
            `{object: "clarification", needs_input: "target_location", message: …}`
            and DOES NOT charge a credit — relay the message to the user,
            get their answer, then retry. Do NOT infer from chat context —
            ask explicitly; the target market can differ from where the user
            is based.
          example: "California, United States"
      description: Body for POST /v1/collect_ideas (synchronous → IdeasResponse OR Clarification).

    Idea:
      type: object
      properties:
        title: { type: string, description: "The idea's hook / title." }
        description: { type: string }
        industry: { type: string }
        audience: { type: string }
        professional: { type: string }
        level: { type: string, description: "Idea level tag (e.g. industry_topic, related_questions)." }

    IdeasResponse:
      type: object
      description: Synchronous response for /v1/collect_ideas.
      properties:
        object:
          type: string
          example: ideas
        ideas:
          type: array
          items: { $ref: '#/components/schemas/Idea' }

    ClarificationResponse:
      type: object
      description: |
        Returned by endpoints that need an additional input from the user
        before they can produce a result. The server returns HTTP 200 (NOT
        an error) so AI agents can relay the prompt without surfacing it as
        a failure. No credits are charged for this response. The endpoint
        is safe to retry as soon as the named field is provided.

        Currently emitted by:
          * POST /v1/collect_ideas — when `target_location` is missing AND
            the account has no cached target market.
          * POST /v1/modify_scene — when `by="text"` matches two or more
            scenes too closely; `candidates` carries the list to disambiguate
            with the user.
      required: [object, needs_input, message]
      properties:
        object:
          type: string
          const: clarification
        needs_input:
          type: string
          description: |
            Name of the missing input field — match it against the request
            schema. Set the value the user provides on this field and retry
            the same endpoint.
          example: target_location
        message:
          type: string
          description: |
            Prompt to relay to the user (in their language if appropriate).
            Already explains what the field is, why it matters, and what
            format to expect.
          example: "Which target market / audience location should these video ideas target? e.g. 'California, United States', 'Texas, US', or 'Vietnam'."
        candidates:
          type: array
          description: |
            Only set by /v1/modify_scene when `by="text"` is ambiguous. List
            of scenes that matched the supplied text closely enough to be
            plausible. Show the `text` previews to the user, then call
            /v1/modify_scene again with `by="voice_file"` and the chosen
            scene's `voice_file`.
          items: { $ref: '#/components/schemas/SceneCandidate' }

    PublishRequest:
      type: object
      description: |
        Body for POST /v1/publish. Provide EXACTLY ONE of `topic_id`, `text`,
        or `video_url`.
      properties:
        topic_id:
          type: string
          description: |
            Publish an existing WideCast video OR blog/social post (the id from
            /v1/create_video or /v1/create_content). Article vs video is
            auto-detected.
          example: widecast7c0d4f8a9b1e2d3f
        text:
          type: string
          description: Arbitrary text to post (optionally with photo_urls).
        video_url:
          type: string
          format: uri
          description: A direct video file URL (mp4/mov/…) to download + publish. Requires `title`.
        title:
          type: string
          description: Caption/title. Required when `video_url` is given; optional override for `topic_id`.
        description:
          type: string
          description: Optional body/description text.
        photo_urls:
          type: array
          items: { type: string, format: uri }
          description: Optional image URLs to attach (with `text`).
        platforms:
          type: array
          items:
            type: string
            enum: [youtube, tiktok, instagram, facebook, linkedin, x, threads, pinterest, reddit, bluesky, google_business]
          description: Target platforms. Defaults to ALL connected platforms.
        scheduled_date:
          type: string
          description: Optional ISO date/time to schedule the post (with `timezone`).
        timezone:
          type: string
          default: UTC
        callback_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties: true

    PublishResponse:
      type: object
      description: |
        Accepted-publish envelope (HTTP 202). Poll GET /v1/status/{id} with any
        of `request_ids` for per-platform results.
      required: [object, id, request_ids, status, platforms]
      properties:
        object:
          type: string
          const: publish
        id:
          type: string
          description: Primary upstream request_id — poll GET /v1/status/{id}.
        request_ids:
          type: array
          items: { type: string }
          description: All upstream request_ids (an article spanning text+photo may return two).
        status:
          type: string
          enum: [processing]
        platforms:
          type: array
          items: { type: string }
          description: Platforms the publish was dispatched to.
        skipped:
          type: array
          items: { type: string }
          description: Platforms skipped (not connected / missing required config).
        metadata:
          type: object
          additionalProperties: true
        links:
          type: object
          properties:
            status: { type: string, example: /v1/status/abc123 }
        meta:
          type: object
          properties:
            request_id: { type: string }
            widecast_version: { type: string }

    Status:
      type: object
      description: Unified async-task status envelope returned by `create_video` and `get_status`.
      required: [object, id, topic_id, type, status, stage, progress, details, result, error, metadata, usage, links, meta]
      properties:
        object:
          type: string
          const: status
        id:
          type: string
          pattern: '^widecast[a-zA-Z0-9]{12,32}$'
          example: widecast7c0d4f8a9b1e2d3f
        topic_id:
          type: string
          pattern: '^widecast[a-zA-Z0-9]{12,32}$'
          example: widecast7c0d4f8a9b1e2d3f
          description: |
            Mirrors `id` 1:1. Exposed separately because the legacy `/checkProgress`
            response and the scene-editor URL (`?topic_id=`) use this name —
            clients can pick whichever field name reads more clearly.
        type:
          type: string
          description: |
            Resource type. `video` for create_video / enhance_script ids;
            `content` for create_content (written blog/social — `details.status`
            carries the blog_status stage: Queued / Processing / Researching /
            Deep research completed / Checking media / Completed); `publish` when
            polling a /v1/publish request_id (then `result.posts[]` carries
            per-platform post URLs).
          enum: [video, content, publish]
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: |
            * `pending` — id issued, worker hasn't written the topic row yet
              (race window, usually <2s). The server caches issued ids in memory
              for 10 minutes so polling clients never see 404 during this window.
            * `processing` — topic row exists, worker is on it. Stays in this
              state for the ENTIRE run (the abroll worker doesn't increment
              `step` until the final flip — don't expect granular progress).
            * `completed` — scenes ready for review. (`result.review_url` is already populated from earlier states too — the completion signal is `stage` + `result.script`, not `review_url`.)
            * `failed` — unrecoverable error (`error.code` + `error.message` populated).
        stage:
          type: string
          description: Fine-grained internal stage (informational, may evolve — don't gate logic on it).
          example: "step_0"
        progress:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: |
            Honest progress estimate (not step-based, since the worker stays at
            step=0 for most of the run):
              * 0.05 — id issued, no topic row yet (pending / race)
              * 0.30 — topic row exists, no rendered script yet (worker starting)
              * 0.80 — script with segments present, finalisation pending
              * 1.00 — completed
        skill_hint:
          type: string
          nullable: true
          description: |
            Informational nudge present on the `POST /v1/create_video` response
            (NOT on `/v1/status` polls) when the supplied `script_text` looks
            like the caller skipped `widecast_get_writing_skill` — e.g. no
            inline `![alt](url)` markdown and no raw image/video URLs anywhere
            in the script. The render still proceeds (auto-B-roll fills the
            gap); this just teaches the AI to fetch the writing method next
            time. The method is vendor-neutral — applies to any LLM.
          example: "script_text contains no inline media URLs. WideCast's writing method recommends …"
        progress_hint:
          oneOf:
            - { type: "null" }
            - $ref: '#/components/schemas/ProgressHint'
          description: |
            UX-friendly sub-stage label derived from elapsed time (NOT from real
            worker state). Present only while `status == "processing"`. Polling
            AIs should relay `progress_hint.label` to the user every poll to
            keep the wait feeling alive. The label includes an ETA suffix in
            English (e.g. "Generating scene visuals · ~7 min left") — the AI is
            expected to translate to the user's language. Pseudo-progress: the
            stage may not exactly match what the worker is doing internally.
        details:
          oneOf:
            - { type: "null" }
            - $ref: '#/components/schemas/ProcessingDetails'
          description: |
            Fine-grained worker state surfaced from the legacy topic / queue row.
            `null` during the pending race window (no topic row yet). For abroll
            (current pilot endpoint), most fields stay at default until the
            worker flips to step=5+Completed at the end; the render pipeline
            (future endpoint) will populate these progressively.
        result:
          oneOf:
            - { type: "null" }
            - $ref: '#/components/schemas/StatusResult'
          description: Populated only when `status == "completed"`.
        error:
          oneOf:
            - { type: "null" }
            - $ref: '#/components/schemas/StatusError'
          description: Populated only when `status == "failed"`.
        callback_url:
          type: string
          format: uri
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        usage:
          type: object
          nullable: true
          description: |
            Cost & credit info. **`null` in pilot** — populated once billing
            lands (ROADMAP Phase 1).
        links:
          type: object
          properties:
            self:
              type: string
              example: "/v1/status/widecast7c0d4f8a9b1e2d3f"
        meta:
          type: object
          properties:
            request_id: { type: string }
            widecast_version: { type: string }

    StatusResult:
      type: object
      description: |
        Minimal user-facing output. The v0.1.0 pilot returns `review_url` for
        every completed video (auth-adaptive: read-only embeddable player when
        not signed in, full editor when signed in), and additionally `video_url`
        when the video was created with `output_type: "video"` (or when
        `/v1/export_video` finished). The rendered video script (with
        segments) is intentionally NOT inlined to keep status responses cheap.
        A future `GET /v1/videos/{id}/script` endpoint will serve the full
        script explicitly when needed.
      required: [review_url]
      properties:
        review_url:
          type: string
          format: uri
          description: |
            URL where the end user views / edits the rendered scenes + audio.
            Append **`&readonly=true`** to get a public, **read-only player**
            (no sign-in) that does NOT block iframe embedding — use that variant
            as an `<iframe>` src to show the result inline. The plain URL opens
            the full editor for a signed-in user. Keyed by `topic_id`
            (+ `company_id`). Default template:
            `https://widecast.ai/#scene_editor?topic_id=<id>` (overridable
            server-side via `WIDECAST_REVIEW_URL_TEMPLATE` env); embeddable
            variant: `https://widecast.ai/#scene_editor?topic_id=<id>&readonly=true`.
          example: https://widecast.ai/#scene_editor?topic_id=widecast7c0d4f8a9b1e2d3f
        video_url:
          type: string
          format: uri
          description: |
            Direct URL to the rendered MP4. Populated only for videos created
            with `output_type: "video"` or exported via `POST /v1/export_video`.
          example: https://widecast.ai/exports/huubinhnguyen/widecast7c0d4f8a9b1e2d3f/final.mp4

    ProgressHint:
      type: object
      description: |
        Time-based pseudo-progress for UX during the 15-min create_video render
        (and ~3-min export_video encode). Derived in the server from elapsed
        time since the id was issued — NOT from real worker state — so the
        stage label may not exactly match what the worker is doing internally.
        Good enough for "show the user something" UX; not for gating logic.

        Polling AIs should relay `label` to the user verbatim (translating to
        the user's language as needed). `remaining_ms_estimate` is provided
        separately for clients that want to format ETA differently than the
        baked English "· ~N min left" suffix in `label`.
      required: [stage, label, elapsed_ms, remaining_ms_estimate]
      properties:
        stage:
          type: string
          description: |
            Machine-readable sub-stage key. Stable for code; not for display.
            The set varies by what's running:
              * `create_video` `output_type=video` (full pipeline, ~15 min):
                queued / research / script / segmentation / voice_gen /
                image_gen / broll_fetch / composition / encoding / uploading
              * `create_video` `output_type=scene` (stops at scene editor, ~3 min):
                queued / research / script / segmentation / finalizing
              * `create_video` `output_type=text` (media-source Remake, ~3 min):
                queued / ingest / transcribe / script
              * `export_video` (post-review MP4 render, ~3 min):
                preparing / encoding_video / encoding_audio / muxing / uploading
          example: image_gen
        label:
          type: string
          description: |
            Human-readable English label with ETA suffix appended. Format:
            `"<Sentence> · ~N min left"` (or `· Almost done` near the end).
          example: "Generating scene visuals · ~7 min left"
        elapsed_ms:
          type: integer
          minimum: 0
          description: Milliseconds since the id was issued.
          example: 270000
        remaining_ms_estimate:
          type: integer
          minimum: 0
          description: |
            Estimated milliseconds until completion (best-effort, ≥15 sec floor).
            Drifts off if the worker is faster or slower than the typical timing.
          example: 420000

    ProcessingDetails:
      type: object
      description: |
        Raw worker state for fine-grained progress visibility. Field names
        mirror the legacy `topics_table` (or `video_queue_table`) schema.

        ⚠ **DELIBERATE NAME CLASH**: `details.status` is a free-form legacy
        string ("Completed", "Error", "Avatar videos downloaded", …),
        DISTINCT from the top-level `status` enum. Gate logic on the
        top-level value; treat `details.status` as a human/debug hint.
      required: [step, status, notes]
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 5
          description: Legacy `step` value (0 during abroll, 5 at completion). Render pipeline cycles 0→2→5.
        status:
          type: string
          description: Free-form legacy state string. NOT our top-level status enum.
          example: ""
        notes:
          type: string
          description: Free-form note from the worker (errors, assignment messages, etc.).
          example: ""
        updated_at:
          type: string
          format: date-time
          description: When the worker last touched the row (ISO 8601 UTC).
          example: "2026-05-20T12:34:56Z"
        input_truncated_from:
          type: integer
          description: |
            Original word count when the server auto-truncated a generative
            input to its max (idea_text → 1000, blog_text → 3000). Only
            present when the input exceeded the bound. Lets clients show
            "your 4200-word article was trimmed to 3000 words" UX hints.
          example: 4200

    StatusError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - account_expired
            - credit_exhausted
            - render_failed
            - unknown_error
            - scenes_not_ready
            - export_failed
            - script_too_short
            - script_too_long
            - invalid_output_type
            - invalid_source
            - idea_too_short
            - missing_idea_text
            - blog_too_short
            - missing_blog_text
            - missing_video_url
            - missing_audio_url
            - missing_media_file
            - unsupported_media_url
            - media_too_long
            - file_too_large
            - missing_api_key
            - invalid_api_key
            - invalid_language
            - invalid_video_length
            - invalid_research_enabled
        message:
          type: string

    ListEnvelope:
      type: object
      description: |
        **Pagination convention** for every future list endpoint.
        Cursor-based — no list endpoint in v0.1.0 yet; this schema is reserved.
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { type: object }
        has_more: { type: boolean }
        next_cursor:
          type: string
          nullable: true

    WebhookEvent:
      type: object
      description: |
        The payload WideCast POSTs to your `callback_url`. Headers:
          * `User-Agent: WideCast-Webhook/<version>`
          * `X-WideCast-Event: <event_id>`
          * `X-WideCast-Event-Type: <event_type>`
          * `X-WideCast-Signature: t=<unix_ts>,v1=<hmac_sha256_hex>` — verify against `WIDECAST_WEBHOOK_SECRET`
          * `X-WideCast-Delivery: <uuid>` — unique per delivery attempt
          * `X-WideCast-Attempt: <n>` — 1-indexed retry counter

        Retry: 10 attempts spread across 24h (offsets 0s/1m/5m/15m/30m/1h/3h/6h/12h/24h).
        Acknowledge with HTTP 2xx within 30s; non-2xx triggers retry until
        success, abandon (4xx), exhaustion (10 attempts), or 24h timeout.
      required: [event_id, event_type, created_at, api_version, data]
      properties:
        event_id:
          type: string
          example: evt_8d4f9c8a9b714c5a93b37c8e
          description: Unique per event — dedupe on this in your handler.
        event_type:
          type: string
          enum: [video.processing, video.completed, video.failed]
          description: |
            * `video.processing` — fires once, immediately after `POST /v1/create_video` (server has accepted, worker spawned).
            * `video.completed` — fires once, when status first reaches `completed`. `data.result.review_url` populated.
            * `video.failed` — fires once, when status first reaches `failed`. `data.error.{code,message}` populated.
        created_at:
          type: string
          format: date-time
        api_version:
          type: string
          example: "0.1.0"
        data:
          $ref: '#/components/schemas/Status'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id, doc_url]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - precondition_failed
                - rate_limit_error
                - api_error
            code: { type: string, example: missing_field }
            message: { type: string }
            param: { type: string, nullable: true }
            doc_url: { type: string, format: uri }
            request_id: { type: string }
            details:
              oneOf:
                - { type: "null" }
                - $ref: '#/components/schemas/CreditErrorDetails'
              description: |
                Code-specific structured data. Currently populated for
                `code == "credit_exhausted"` and `code == "account_expired"`
                (HTTP 402) — see `CreditErrorDetails`. Other error codes
                leave this `null`.

    CreditErrorDetails:
      type: object
      description: |
        Structured upgrade / wait info attached to HTTP 402 responses
        (`credit_exhausted` or `account_expired`). AI clients should surface
        both options to the user — wait until the next monthly reset
        (`reset_at`) OR upgrade now via `upgrade_url` — rather than only
        relaying the prose `message`.
      required: [upgrade_url, current_plan, credits_remaining, credits_required]
      properties:
        upgrade_url:
          type: string
          format: uri
          description: Pricing page where the user can upgrade their plan.
          example: "https://widecast.ai/#pricing_plans"
        reset_at:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 UTC timestamp when the user's current period ends and the
            quota refreshes. Sourced from `system_configs.valid_to` — same
            field that drives the `account_expired` gate (interpretation flips
            based on whether `valid_to` is past or future relative to now).
            Present for `credit_exhausted`; absent for `account_expired`.
          example: "2026-03-01T00:00:00Z"
        expired_at:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 UTC timestamp when the paid plan expired.
            Present for `account_expired`; absent for `credit_exhausted`.
          example: "2026-02-15T00:00:00Z"
        renew_url:
          type: string
          format: uri
          nullable: true
          description: |
            Where the user renews an expired plan. Present for
            `account_expired`; identical to `upgrade_url` in practice.
          example: "https://widecast.ai/#pricing_plans"
        current_plan:
          type: string
          description: User's current plan tier name.
          enum: [Free, Starter, Pro, Business, Enterprise]
          example: "Free"
        current_plan_quota:
          type: integer
          nullable: true
          description: Monthly credit allocation on the user's current plan.
          example: 50
        credits_remaining:
          type: integer
          minimum: 0
          description: Credits left in the user's current monthly allocation.
          example: 0
        credits_required:
          type: integer
          minimum: 0
          description: Credits this operation would have consumed.
          example: 5
        next_plan:
          type: string
          nullable: true
          description: |
            Suggested next plan to upgrade to (one tier above current).
            `null` when the user is already on the top tier (Enterprise).
          example: "Starter"
        next_plan_quota:
          type: integer
          nullable: true
          description: Monthly credit allocation on the suggested next plan.
          example: 500

  responses:
    BadRequest:
      description: Invalid request — see `error.code`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: |
        Missing, malformed, or revoked API key. Send a valid key as
        `Authorization: Bearer wc_live_...`. `error.code` is `missing_api_key`
        (no key) or `invalid_api_key` (malformed / unknown / revoked);
        `error.type` is `authentication_error`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: |
        The account cannot be charged for this operation — `error.code` is
        `credit_exhausted` (out of credits) or `account_expired`. The
        response carries an `error.details` object (see `CreditErrorDetails`)
        with the upgrade URL, next monthly reset, and current/next plan info
        so AI clients can format a "wait vs upgrade" choice for the user
        instead of just relaying the prose message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: |
        The request is well-formed but the resource is not in the expected
        state — e.g. trying to export a video whose scenes are not yet
        ready (`error.code = "scenes_not_ready"`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Server-side failure. Include `meta.request_id` when reporting.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
