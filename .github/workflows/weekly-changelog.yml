name: weekly-changelog

# Every Monday 09:00 UTC, regenerate CHANGELOG.md from commit history
# and open a PR. If nothing changed, the PR action no-ops.
#
# Also runnable on-demand from the Actions UI.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git-cliff

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs(changelog): weekly regeneration"
          title: "docs(changelog): weekly regeneration"
          body: |
            Automated weekly CHANGELOG.md update from commit history.

            If this PR is empty, the workflow short-circuited and no commits to merge.

            > Generated by `.github/workflows/weekly-changelog.yml`
          branch: chore/weekly-changelog
          delete-branch: true
          labels: |
            documentation
            automated
