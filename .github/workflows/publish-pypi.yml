name: publish-pypi

on:
  push:
    tags:
      - "v*.*.*"           # e.g., v0.1.0, v0.1.1
      - "!v*.*.*-rc*"      # exclude rc — use workflow_dispatch + TestPyPI for those
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0). Must match sdk-python/pyproject.toml."
        required: true
      target:
        description: "PyPI target"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

# Only one publish at a time per ref — prevents accidental double-publish race
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build sdist + wheel, publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi          # set up a GitHub Environment named "pypi" for review-required gating (optional)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine

      - name: Resolve target version + sanity-check vs pyproject.toml
        id: meta
        working-directory: sdk-python
        run: |
          # On a tag push the version comes from refs/tags/vX.Y.Z; strip the v.
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          PYPROJECT_VER=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag/input version: $VER"
          echo "pyproject version: $PYPROJECT_VER"
          if [ "$VER" != "$PYPROJECT_VER" ]; then
            echo "::error::Tag/input version $VER does not match pyproject.toml $PYPROJECT_VER. Bump pyproject.toml first."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        working-directory: sdk-python
        run: |
          rm -rf dist/
          python -m build --sdist --wheel
          ls -lh dist/

      - name: Twine check
        working-directory: sdk-python
        run: twine check dist/*

      - name: Publish to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-python/dist
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ inputs.target != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Summary
        run: |
          echo "## Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** widecast" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** ${{ inputs.target || 'pypi' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.target }}" = "testpypi" ]; then
            echo "Install: \`pip install -i https://test.pypi.org/simple/ widecast==${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Install: \`pip install widecast==${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "PyPI: https://pypi.org/project/widecast/${{ steps.meta.outputs.version }}/" >> "$GITHUB_STEP_SUMMARY"
          fi
