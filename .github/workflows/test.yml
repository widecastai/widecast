name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push lands on the same PR/branch
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Python SDK ────────────────────────────────────────────────────────
  python-sdk:
    name: Python SDK · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml

      - name: Install SDK + test deps
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: sdk-python
        run: python -m pytest tests/ -v --tb=short

  # ─── JS / TS SDK ───────────────────────────────────────────────────────
  js-sdk:
    name: JS/TS SDK · vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json

      - name: Install
        working-directory: sdk-js
        run: npm ci || npm install

      - name: Typecheck
        working-directory: sdk-js
        run: npm run typecheck

      - name: Build
        working-directory: sdk-js
        run: npm run build

      - name: Test
        working-directory: sdk-js
        run: npm test

  # ─── MCP server (TS, ships prebuilt dist/) ─────────────────────────────
  mcp-server:
    name: MCP server · build + node-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        working-directory: mcp-server
        run: npm ci || npm install

      - name: Build (tsc)
        working-directory: mcp-server
        run: npm run build

      - name: Sanity-check the published entrypoint
        working-directory: mcp-server
        run: node --check dist/index.js

      - name: Confirm bin entry resolves
        working-directory: mcp-server
        run: |
          test -x dist/index.js || chmod +x dist/index.js
          head -1 dist/index.js | grep -q '^#!' && echo "shebang OK" || (echo "missing shebang"; exit 1)
