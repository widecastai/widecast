# Dependabot — auto-PR for security + version updates.
#
# Schedule weekly (Monday morning UTC) so it's not noisy day-by-day.
# Groups all minor/patch into one PR per ecosystem so review stays quick.

version: 2
updates:
  # ─── Python SDK ────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/sdk-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "sdk-python"]
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps-py)"
      include: "scope"

  # ─── JS/TS SDK ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/sdk-js"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "sdk-js"]
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps-js)"
      include: "scope"

  # ─── MCP server ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "mcp-server"]
    groups:
      mcp-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps-mcp)"
      include: "scope"

  # ─── GitHub Actions versions ───────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps-ci)"
