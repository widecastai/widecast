<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Documentary Grit Overlay Sample</title>
  <defs>
    <filter id="grainShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>text { font-family: "Roboto Condensed", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="rough_bars" data-wc-kind="object" data-wc-anim="slide-right">
    <path d="M66 196H570L548 254H82Z" fill="#111827" opacity="0.92"/>
    <path d="M94 594H650L632 666H76Z" fill="#B91C1C" opacity="0.9"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#grainShadow)">
    <text x="92" y="330" font-size="84" font-weight="900" fill="#F8FAFC">GROUND</text>
    <text x="92" y="418" font-size="84" font-weight="900" fill="#F8FAFC">TRUTH</text>
  </g>
  <g data-wc-object="stamp" data-wc-kind="text" data-wc-anim="pop">
    <rect x="98" y="500" width="258" height="64" fill="none" stroke="#B91C1C" stroke-width="7"/>
    <text x="124" y="544" font-size="34" font-weight="900" fill="#B91C1C">FIELD NOTE</text>
  </g>
  <g data-wc-object="caption" data-wc-kind="text" data-wc-anim="fade">
    <text x="98" y="728" font-size="38" font-weight="900" fill="#111827">Raw, urgent, evidence-led.</text>
    <text x="98" y="778" font-size="30" font-weight="700" fill="#374151">Works for case studies and real-world warnings.</text>
  </g>
</svg>
