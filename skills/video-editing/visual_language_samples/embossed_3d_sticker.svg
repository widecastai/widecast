<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Embossed 3D Sticker Overlay Sample</title>
  <defs>
    <filter id="chunkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="5" flood-color="#111827" flood-opacity="0.35"/>
    </filter>
    <style>text { font-family: "Montserrat Black", Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="burst" data-wc-kind="object" data-wc-anim="pop" filter="url(#chunkShadow)">
    <path d="M360 120L401 202L493 166L468 260L560 296L466 328L498 420L405 392L360 474L315 392L222 420L254 328L160 296L252 260L227 166L319 202Z" fill="#FFE66D" stroke="#111827" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <g data-wc-object="title_shadow" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="92" y="350" font-size="94" font-weight="900" fill="#111827">STICKER</text>
    <text x="96" y="446" font-size="94" font-weight="900" fill="#111827">POWER</text>
  </g>
  <g data-wc-object="title_face" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#chunkShadow)">
    <text x="80" y="336" font-size="94" font-weight="900" fill="#FF4D6D" stroke="#FFFFFF" stroke-width="9" paint-order="stroke">STICKER</text>
    <text x="84" y="432" font-size="94" font-weight="900" fill="#4D96FF" stroke="#FFFFFF" stroke-width="9" paint-order="stroke">POWER</text>
  </g>
  <g data-wc-object="pill_one" data-wc-kind="text" data-wc-anim="pop" filter="url(#chunkShadow)">
    <rect x="88" y="560" width="250" height="86" rx="43" fill="#FFFFFF" stroke="#111827" stroke-width="7"/>
    <text x="124" y="616" font-size="34" font-weight="900" fill="#111827">THICK BODY</text>
  </g>
  <g data-wc-object="pill_two" data-wc-kind="text" data-wc-anim="pop" filter="url(#chunkShadow)">
    <rect x="384" y="640" width="248" height="86" rx="43" fill="#7CFFCB" stroke="#111827" stroke-width="7"/>
    <text x="424" y="696" font-size="34" font-weight="900" fill="#111827">BIG EDGES</text>
  </g>
  <g data-wc-object="footer_note" data-wc-kind="text" data-wc-anim="fade">
    <text x="90" y="862" font-size="42" font-weight="900" fill="#111827" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">Energetic scenes, not sober trust.</text>
  </g>
</svg>
