<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Kinetic Youth Creator Overlay Sample</title>
  <defs>
    <filter id="popShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#111827" flood-opacity="1"/>
    </filter>
    <style>text { font-family: "Anton", "Montserrat Black", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="slash_1" data-wc-kind="mark" data-wc-anim="slide-right">
    <path d="M94 180L622 124L598 190L70 246Z" fill="#FFBE0B"/>
    <path d="M126 780L650 708L622 786L98 858Z" fill="#3A86FF"/>
  </g>
  <g data-wc-object="title_stack" data-wc-kind="text" data-wc-anim="pop" filter="url(#popShadow)">
    <g transform="rotate(-5 360 350)">
      <rect x="82" y="252" width="536" height="108" rx="16" fill="#FF006E"/>
      <text x="116" y="330" font-size="76" fill="#FFFFFF">MAKE IT</text>
    </g>
    <g transform="rotate(4 360 460)">
      <rect x="118" y="384" width="490" height="112" rx="16" fill="#8338EC"/>
      <text x="154" y="464" font-size="78" fill="#FFFFFF">MOVE</text>
    </g>
  </g>
  <g data-wc-object="badge_fast" data-wc-kind="text" data-wc-anim="zoom" filter="url(#popShadow)">
    <circle cx="520" cy="578" r="82" fill="#06D6A0"/>
    <text x="470" y="590" font-size="46" fill="#111827">FAST</text>
  </g>
  <g data-wc-object="step_cards" data-wc-kind="text" data-wc-anim="slide-up">
    <rect x="90" y="650" width="238" height="88" rx="18" fill="#FFFFFF" stroke="#111827" stroke-width="6"/>
    <text x="124" y="708" font-size="36" fill="#111827">HOOK</text>
    <rect x="386" y="760" width="244" height="88" rx="18" fill="#FFFFFF" stroke="#111827" stroke-width="6"/>
    <text x="420" y="818" font-size="36" fill="#111827">PAYOFF</text>
  </g>
  <g data-wc-object="creator_note" data-wc-kind="text" data-wc-anim="fade">
    <text x="92" y="926" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="900" fill="#111827" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">Loud shapes. Short words. Big rhythm.</text>
  </g>
</svg>
