<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Neo Brutalist Editorial Overlay Sample</title>
  <defs>
    <style>text { font-family: "Arial Black", Impact, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="brutal_panel" data-wc-kind="object" data-wc-anim="slide-right">
    <rect x="58" y="144" width="590" height="300" fill="#F7FF00" stroke="#111111" stroke-width="10"/>
    <path d="M58 444L648 144" stroke="#111111" stroke-width="8"/>
  </g>
  <g data-wc-object="title_block" data-wc-kind="text" data-wc-anim="pop">
    <text x="86" y="260" font-size="80" font-weight="900" fill="#111111">BRUTAL</text>
    <text x="86" y="350" font-size="80" font-weight="900" fill="#111111">CLARITY</text>
  </g>
  <g data-wc-object="stamp" data-wc-kind="text" data-wc-anim="zoom">
    <rect x="424" y="388" width="194" height="78" fill="#FF2E63" stroke="#111111" stroke-width="8"/>
    <text x="452" y="440" font-size="36" font-weight="900" fill="#FFFFFF">NO FILTER</text>
  </g>
  <g data-wc-object="proof_cards" data-wc-kind="text" data-wc-anim="slide-up">
    <rect x="76" y="552" width="260" height="126" fill="#FFFFFF" stroke="#111111" stroke-width="8"/>
    <text x="106" y="612" font-size="34" font-weight="900" fill="#111111">RAW SHAPES</text>
    <text x="108" y="650" font-size="28" font-family="Inter, Arial" font-weight="800" fill="#111111">hard edges</text>
    <rect x="386" y="664" width="258" height="126" fill="#00D1FF" stroke="#111111" stroke-width="8"/>
    <text x="416" y="724" font-size="34" font-weight="900" fill="#111111">LOUD ORDER</text>
    <text x="418" y="762" font-size="28" font-family="Inter, Arial" font-weight="800" fill="#111111">anti-polish</text>
  </g>
  <g data-wc-object="footer" data-wc-kind="text" data-wc-anim="fade">
    <text x="76" y="900" font-size="36" font-weight="900" fill="#111111">Use when the message should feel blunt.</text>
  </g>
</svg>
