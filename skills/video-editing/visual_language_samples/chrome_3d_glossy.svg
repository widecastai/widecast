<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Chrome 3D Glossy Overlay Sample</title>
  <defs>
    <linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.18" stop-color="#A5B4FC"/>
      <stop offset="0.38" stop-color="#111827"/>
      <stop offset="0.58" stop-color="#E0F2FE"/>
      <stop offset="0.78" stop-color="#64748B"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="chromeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <style>text { font-family: "Arial Black", Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="chrome_plate" data-wc-kind="object" data-wc-anim="zoom" filter="url(#chromeShadow)">
    <rect x="78" y="190" width="564" height="290" rx="44" fill="#111827"/>
    <rect x="100" y="212" width="520" height="246" rx="34" fill="url(#chrome)"/>
    <path d="M132 248H588" stroke="#FFFFFF" stroke-width="10" opacity="0.55" stroke-linecap="round"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#chromeShadow)">
    <text x="122" y="348" font-size="76" font-weight="900" fill="#111827" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">CHROME</text>
    <text x="122" y="430" font-size="76" font-weight="900" fill="#111827" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">3D</text>
  </g>
  <g data-wc-object="gloss_cards" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#chromeShadow)">
    <rect x="106" y="612" width="506" height="108" rx="28" fill="url(#chrome)" stroke="#111827" stroke-width="4"/>
    <text x="146" y="680" font-size="38" font-weight="900" fill="#111827">high gloss, metallic drama</text>
  </g>
</svg>
