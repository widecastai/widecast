<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" data-wc-ani="all">
  <defs>
    <linearGradient id="tealHead" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.24"/>
    </filter>
    <style>
      text { font-family: "Be Vietnam Pro Black", "Inter Black", Arial, sans-serif; }
    </style>
  </defs>

  <g data-wc-object="title_panel" data-wc-kind="text" data-wc-anim="slide-down" data-wc-z="1" filter="url(#cardShadow)">
