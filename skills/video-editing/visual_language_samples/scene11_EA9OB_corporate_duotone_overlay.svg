    <rect x="54" y="132" width="612" height="18" rx="9" fill="url(#tealHead)"/>
    <text x="92" y="208" font-size="58" font-weight="900" fill="#FFFFFF">KHÔNG TỰ ĐỘNG</text>
    <text x="92" y="270" font-size="58" font-weight="900" fill="#FDE68A">CẬP NHẬT</text>
  </g>

  <g data-wc-object="left_card" data-wc-kind="object" data-wc-anim="slide-right" data-wc-z="2" filter="url(#cardShadow)">
