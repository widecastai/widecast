  </g>

  <g data-wc-object="right_card" data-wc-kind="object" data-wc-anim="slide-left" data-wc-z="2" filter="url(#cardShadow)">
    <rect x="380" y="372" width="282" height="362" rx="28" fill="#FFFFFF" opacity="0.96" stroke="#B91C1C" stroke-width="5"/>
    <rect x="380" y="372" width="282" height="82" rx="28" fill="#FEF2F2"/>
    <path d="M380 426H662" stroke="#B91C1C" stroke-width="5"/>
