    <text x="92" y="684" font-size="31" font-weight="900" fill="#0F172A">ĐÃ THÔNG BÁO</text>
  </g>
  <g data-wc-object="left_check" data-wc-kind="mark" data-wc-anim="pop" data-wc-z="4">
    <circle cx="199" cy="558" r="72" fill="#D1FAE5" stroke="#0F766E" stroke-width="6"/>
    <path d="M156 558L188 592L246 520" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
