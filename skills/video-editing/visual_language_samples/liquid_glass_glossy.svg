<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Liquid Glass Glossy Overlay Sample</title>
  <defs>
    <linearGradient id="glassA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.76"/>
      <stop offset="0.45" stop-color="#7DD3FC" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <style>text { font-family: Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="liquid_blob_1" data-wc-kind="object" data-wc-anim="pop" opacity="0.82">
    <path d="M105 280C96 190 190 144 278 172C340 192 370 132 438 166C522 208 514 306 460 352C396 406 296 372 248 418C178 486 114 390 105 280Z" fill="url(#glassA)" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g data-wc-object="liquid_blob_2" data-wc-kind="object" data-wc-anim="pop" opacity="0.74">
    <path d="M326 620C288 526 380 468 480 492C570 514 630 596 596 684C558 784 420 774 362 720C340 700 336 658 326 620Z" fill="url(#glassA)" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g data-wc-object="glass_title" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#glassShadow)">
    <rect x="78" y="238" width="564" height="210" rx="44" fill="url(#glassA)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M108 276C210 244 338 246 470 278" stroke="#FFFFFF" stroke-width="8" opacity="0.55" stroke-linecap="round"/>
    <text x="112" y="338" font-size="74" font-weight="900" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="3">Liquid</text>
    <text x="112" y="414" font-size="74" font-weight="900" fill="url(#neon)" stroke="#1E1B4B" stroke-width="3">signal</text>
  </g>
  <g data-wc-object="glossy_metric" data-wc-kind="text" data-wc-anim="zoom" filter="url(#glassShadow)">
    <rect x="112" y="550" width="236" height="146" rx="38" fill="url(#glassA)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="142" y="636" font-size="70" font-weight="900" fill="#FFFFFF" stroke="#172554" stroke-width="2">3.8x</text>
    <text x="146" y="672" font-size="26" font-weight="800" fill="#F8FAFC">more memorable</text>
  </g>
  <g data-wc-object="glass_footer" data-wc-kind="text" data-wc-anim="fade">
    <rect x="114" y="820" width="492" height="86" rx="43" fill="#0F172A" opacity="0.78"/>
    <text x="154" y="875" font-size="34" font-weight="900" fill="#E0F2FE">Gloss, refraction, soft glow</text>
