<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Corporate Duotone Overlay Sample</title>
  <defs>
    <style>text { font-family: Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="duo_blocks" data-wc-kind="object" data-wc-anim="fade">
    <rect x="68" y="150" width="584" height="758" fill="#F8FAFC"/>
    <rect x="68" y="150" width="184" height="758" fill="#0F766E"/>
    <rect x="252" y="150" width="400" height="84" fill="#0F172A"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-left">
    <text x="292" y="344" font-size="70" font-weight="900" fill="#0F172A">Stable</text>
    <text x="292" y="422" font-size="70" font-weight="900" fill="#0F172A">growth</text>
  </g>
  <g data-wc-object="left_label" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="104" y="292" font-size="28" font-weight="900" fill="#FFFFFF" transform="rotate(-90 104 292)">B2B SYSTEM</text>
  </g>
  <g data-wc-object="metrics" data-wc-kind="text" data-wc-anim="slide-up">
    <rect x="292" y="530" width="300" height="92" fill="#E6FFFA"/>
    <text x="320" y="588" font-size="38" font-weight="900" fill="#0F766E">+18% retention</text>
    <rect x="292" y="650" width="300" height="92" fill="#E2E8F0"/>
    <text x="320" y="708" font-size="38" font-weight="900" fill="#0F172A">lower churn</text>
  </g>
  <g data-wc-object="footer" data-wc-kind="text" data-wc-anim="fade">
    <text x="292" y="840" font-size="30" font-weight="800" fill="#475569">restrained, useful, boardroom-safe</text>
  </g>
</svg>
