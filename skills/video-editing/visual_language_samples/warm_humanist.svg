<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Warm Humanist Overlay Sample</title>
  <defs>
    <filter id="warmShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
    <style>text { font-family: "Source Sans 3", "Open Sans", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="warm_panel" data-wc-kind="object" data-wc-anim="slide-up" filter="url(#warmShadow)">
    <rect x="72" y="176" width="576" height="350" rx="42" fill="#FFF1E6"/>
    <circle cx="586" cy="218" r="38" fill="#FDBA74"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="112" y="304" font-size="70" font-weight="900" fill="#431407">Make it</text>
    <text x="112" y="384" font-size="70" font-weight="900" fill="#EA580C">feel human</text>
  </g>
  <g data-wc-object="support" data-wc-kind="text" data-wc-anim="fade">
    <text x="116" y="458" font-size="32" font-weight="800" fill="#7C2D12">soft language, rounded forms, honest warmth</text>
  </g>
  <g data-wc-object="cards" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#warmShadow)">
    <rect x="92" y="606" width="250" height="126" rx="30" fill="#FFFFFF"/>
    <text x="124" y="678" font-size="36" font-weight="900" fill="#431407">Care</text>
    <rect x="382" y="704" width="250" height="126" rx="30" fill="#FFFFFF"/>
    <text x="414" y="776" font-size="36" font-weight="900" fill="#431407">Clarity</text>
  </g>
</svg>
