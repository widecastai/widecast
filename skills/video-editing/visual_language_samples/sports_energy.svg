<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Sports Energy Overlay Sample</title>
  <defs>
    <filter id="hardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#111827" flood-opacity="0.9"/>
    </filter>
    <style>text { font-family: "Anton", Impact, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="speed_lines" data-wc-kind="mark" data-wc-anim="slide-right">
    <path d="M62 222H392M62 272H512M62 322H452" stroke="#FACC15" stroke-width="18" stroke-linecap="round"/>
    <path d="M658 760H328M658 812H208M658 864H288" stroke="#EF4444" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="pop" filter="url(#hardShadow)">
    <text x="86" y="426" font-size="96" fill="#FFFFFF" stroke="#111827" stroke-width="8" paint-order="stroke">GAME</text>
    <text x="86" y="526" font-size="96" fill="#FACC15" stroke="#111827" stroke-width="8" paint-order="stroke">MODE</text>
  </g>
  <g data-wc-object="score_card" data-wc-kind="text" data-wc-anim="slide-up">
    <rect x="104" y="642" width="512" height="108" rx="18" fill="#111827"/>
    <text x="132" y="714" font-size="56" fill="#FFFFFF">ENERGY + TEMPO</text>
  </g>
  <g data-wc-object="badge" data-wc-kind="text" data-wc-anim="zoom" filter="url(#hardShadow)">
    <circle cx="558" cy="360" r="76" fill="#EF4444"/>
    <text x="512" y="376" font-size="38" fill="#FFFFFF">HYPE</text>
  </g>
</svg>
