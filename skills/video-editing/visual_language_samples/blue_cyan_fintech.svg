<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Blue Cyan Fintech Overlay Sample</title>
  <defs>
    <linearGradient id="cyanBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="cleanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.18"/>
    </filter>
    <style>text { font-family: Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="fintech_panel" data-wc-kind="object" data-wc-anim="slide-up" filter="url(#cleanGlow)">
    <rect x="74" y="162" width="572" height="736" rx="36" fill="#F0FDFF" stroke="#BAE6FD" stroke-width="3"/>
    <rect x="74" y="162" width="572" height="112" rx="36" fill="url(#cyanBlue)"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-down">
    <text x="112" y="236" font-size="44" font-weight="900" fill="#FFFFFF">CYAN FINTECH</text>
    <text x="112" y="386" font-size="70" font-weight="900" fill="#0F172A">Fast</text>
    <text x="112" y="466" font-size="70" font-weight="900" fill="#0284C7">confidence</text>
  </g>
  <g data-wc-object="metric_line" data-wc-kind="bar" data-wc-anim="grow-x">
    <rect x="112" y="570" width="456" height="30" rx="15" fill="#CFFAFE"/>
    <rect x="112" y="570" width="330" height="30" rx="15" fill="url(#cyanBlue)"/>
    <text x="112" y="664" font-size="46" font-weight="900" fill="#0F172A">+42% clarity</text>
  </g>
  <g data-wc-object="footer" data-wc-kind="text" data-wc-anim="fade">
    <text x="112" y="800" font-size="30" font-weight="800" fill="#475569">clean, modern, credible tech</text>
  </g>
</svg>
