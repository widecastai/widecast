<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Neon Laser Grid Overlay Sample</title>
  <defs>
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="laserGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <style>text { font-family: "Roboto Condensed", Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="laser_lines" data-wc-kind="mark" data-wc-anim="slide-right" filter="url(#laserGlow)">
    <path d="M44 218H676M88 388H632M42 814H678" stroke="url(#laserGrad)" stroke-width="5"/>
    <path d="M120 132L600 930M600 132L120 930" stroke="#22D3EE" stroke-width="3" opacity="0.8"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="zoom" filter="url(#laserGlow)">
    <text x="92" y="356" font-size="84" font-weight="900" fill="#E0F2FE" stroke="#0F172A" stroke-width="5">LASER</text>
    <text x="92" y="446" font-size="84" font-weight="900" fill="#FFFFFF" stroke="#0F172A" stroke-width="5">FOCUS</text>
  </g>
  <g data-wc-object="cyan_panel" data-wc-kind="text" data-wc-anim="slide-up">
    <rect x="112" y="570" width="496" height="154" fill="#07111F" opacity="0.9" stroke="#22D3EE" stroke-width="3"/>
    <text x="150" y="632" font-size="32" font-weight="900" fill="#22D3EE">NEON + LASER</text>
    <text x="150" y="690" font-size="44" font-weight="900" fill="#FFFFFF">sharp, synthetic, fast</text>
  </g>
</svg>
