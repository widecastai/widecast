<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Y2K Chrome Pop Overlay Sample</title>
  <defs>
    <linearGradient id="y2k" x1="0" x2="1">
      <stop offset="0" stop-color="#F0ABFC"/>
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="y2kGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#C084FC" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#111827" flood-opacity="0.22"/>
    </filter>
    <style>text { font-family: "Arial Black", Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="orbit" data-wc-kind="mark" data-wc-anim="fade" filter="url(#y2kGlow)">
    <ellipse cx="360" cy="420" rx="284" ry="112" fill="none" stroke="#F0ABFC" stroke-width="5"/>
    <ellipse cx="360" cy="420" rx="224" ry="72" fill="none" stroke="#93C5FD" stroke-width="4"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="zoom" filter="url(#y2kGlow)">
    <text x="108" y="372" font-size="82" font-weight="900" fill="url(#y2k)" stroke="#111827" stroke-width="5" paint-order="stroke">Y2K</text>
    <text x="108" y="462" font-size="82" font-weight="900" fill="url(#y2k)" stroke="#111827" stroke-width="5" paint-order="stroke">CHROME</text>
  </g>
  <g data-wc-object="bubble" data-wc-kind="text" data-wc-anim="pop">
    <rect x="126" y="606" width="468" height="96" rx="48" fill="#FFFFFF" opacity="0.9" stroke="#C084FC" stroke-width="4"/>
    <text x="164" y="666" font-size="34" font-weight="900" fill="#6D28D9">playful retro internet gloss</text>
  </g>
</svg>
