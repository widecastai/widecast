<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Luxury Black Gloss Overlay Sample</title>
  <defs>
    <linearGradient id="blackGloss" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="0.42" stop-color="#030712"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" x2="1">
      <stop offset="0" stop-color="#A16207"/>
      <stop offset="0.5" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#92400E"/>
    </linearGradient>
    <filter id="luxShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <style>text { font-family: Georgia, "DejaVu Serif", serif; }</style>
  </defs>
  <g data-wc-object="gloss_plate" data-wc-kind="object" data-wc-anim="fade" filter="url(#luxShadow)">
    <rect x="82" y="178" width="556" height="646" rx="36" fill="url(#blackGloss)"/>
    <path d="M128 226H592" stroke="#FFFFFF" stroke-width="8" opacity="0.12" stroke-linecap="round"/>
    <path d="M128 744H592" stroke="url(#goldLine)" stroke-width="5"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="126" y="358" font-size="76" font-weight="700" fill="#FFFFFF">Black</text>
    <text x="126" y="446" font-size="76" font-weight="700" fill="url(#goldLine)">Gloss</text>
  </g>
  <g data-wc-object="support" data-wc-kind="text" data-wc-anim="fade">
    <text x="128" y="570" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#D1D5DB">premium, serious, polished</text>
    <text x="128" y="624" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#9CA3AF">use for luxury authority moments</text>
  </g>
</svg>
