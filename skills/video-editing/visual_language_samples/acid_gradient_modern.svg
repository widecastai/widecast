    <text x="126" y="436" font-size="78" font-weight="900" fill="#FFFFFF" stroke="#111827" stroke-width="5" paint-order="stroke">MODERN</text>
  </g>
  <g data-wc-object="black_tag" data-wc-kind="text" data-wc-anim="slide-right">
