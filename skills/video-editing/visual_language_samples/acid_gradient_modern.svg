<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Acid Gradient Modern Overlay Sample</title>
  <defs>
    <linearGradient id="acid" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#D9FF00"/>
      <stop offset="0.34" stop-color="#00FFC6"/>
      <stop offset="0.67" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="acidShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25"/>
