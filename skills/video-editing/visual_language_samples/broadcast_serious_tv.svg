<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Broadcast Serious TV Overlay Sample</title>
  <defs>
    <style>text { font-family: "Roboto Condensed", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="top_locator" data-wc-kind="text" data-wc-anim="slide-down">
    <rect x="54" y="128" width="216" height="56" fill="#E11D48"/>
    <rect x="270" y="128" width="396" height="56" fill="#0B1B3A"/>
    <text x="78" y="166" font-size="30" font-weight="900" fill="#FFFFFF">LIVE BRIEF</text>
    <text x="296" y="166" font-size="28" font-weight="800" fill="#DDE7FF">MARKET WATCH</text>
  </g>
  <g data-wc-object="headline_panel" data-wc-kind="text" data-wc-anim="slide-right">
    <rect x="54" y="238" width="612" height="248" fill="#081225" opacity="0.94"/>
    <rect x="54" y="238" width="12" height="248" fill="#E11D48"/>
    <text x="92" y="332" font-size="72" font-weight="900" fill="#FFFFFF">SERIOUS</text>
    <text x="92" y="410" font-size="72" font-weight="900" fill="#FFFFFF">BROADCAST</text>
    <text x="94" y="456" font-size="30" font-weight="700" fill="#A7B7D8">clear hierarchy, no cute decoration</text>
  </g>
  <g data-wc-object="data_row_1" data-wc-kind="text" data-wc-anim="slide-left">
    <rect x="88" y="556" width="544" height="74" fill="#FFFFFF" opacity="0.96"/>
    <text x="116" y="604" font-size="34" font-weight="900" fill="#0B1B3A">RISK LEVEL</text>
    <text x="456" y="604" font-size="38" font-weight="900" fill="#E11D48">HIGH</text>
  </g>
  <g data-wc-object="data_row_2" data-wc-kind="text" data-wc-anim="slide-left">
    <rect x="88" y="646" width="544" height="74" fill="#FFFFFF" opacity="0.96"/>
    <text x="116" y="694" font-size="34" font-weight="900" fill="#0B1B3A">ACTION</text>
    <text x="394" y="694" font-size="38" font-weight="900" fill="#0B1B3A">CHECK NOW</text>
  </g>
  <g data-wc-object="ticker" data-wc-kind="bar" data-wc-anim="grow-x">
    <rect x="54" y="838" width="612" height="72" fill="#E11D48"/>
    <text x="84" y="884" font-size="31" font-weight="900" fill="#FFFFFF">BROADCAST = authority, urgency, clarity</text>
  </g>
</svg>
