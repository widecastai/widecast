<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Editorial Magazine Overlay Sample</title>
  <defs>
    <style>
      .serif { font-family: Georgia, "DejaVu Serif", serif; }
      .sans { font-family: Inter, Arial, sans-serif; }
    </style>
  </defs>
  <g data-wc-object="issue_label" data-wc-kind="text" data-wc-anim="fade">
    <text x="70" y="162" class="sans" font-size="25" font-weight="800" fill="#111827">SPECIAL REPORT</text>
    <path d="M70 184H650" stroke="#111827" stroke-width="3"/>
  </g>
  <g data-wc-object="editorial_title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="68" y="306" class="serif" font-size="96" font-weight="700" fill="#111827">The</text>
    <text x="68" y="408" class="serif" font-size="110" font-weight="700" fill="#111827">Signal</text>
    <text x="68" y="510" class="serif" font-size="110" font-weight="700" fill="#111827">Issue</text>
  </g>
  <g data-wc-object="side_note" data-wc-kind="text" data-wc-anim="slide-left">
    <rect x="486" y="258" width="132" height="322" fill="#F4E7D3"/>
    <text x="518" y="316" class="sans" font-size="28" font-weight="900" fill="#111827">03</text>
    <text x="518" y="372" class="sans" font-size="26" font-weight="800" fill="#111827">ideas</text>
    <text x="518" y="410" class="sans" font-size="26" font-weight="800" fill="#111827">worth</text>
    <text x="518" y="448" class="sans" font-size="26" font-weight="800" fill="#111827">saving</text>
  </g>
  <g data-wc-object="caption_pullquote" data-wc-kind="text" data-wc-anim="fade">
    <path d="M72 632H444" stroke="#111827" stroke-width="6"/>
    <text x="72" y="704" class="sans" font-size="42" font-weight="900" fill="#111827">Elegant by restraint.</text>
    <text x="72" y="756" class="sans" font-size="30" font-weight="700" fill="#475569">Asymmetry, scale, and white space carry the frame.</text>
  </g>
</svg>
