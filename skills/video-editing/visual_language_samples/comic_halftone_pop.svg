<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Comic Halftone Pop Overlay Sample</title>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="5" fill="#111827"/>
    </pattern>
    <style>text { font-family: Impact, "Arial Black", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="halftone_panel" data-wc-kind="object" data-wc-anim="slide-right">
    <rect x="74" y="162" width="572" height="330" fill="#FFEF5A" stroke="#111827" stroke-width="10"/>
    <rect x="76" y="162" width="570" height="330" fill="url(#dots)" opacity="0.16"/>
  </g>
  <g data-wc-object="burst" data-wc-kind="mark" data-wc-anim="pop">
    <path d="M392 474L420 552L504 514L466 598L552 626L460 648L494 738L416 684L366 762L356 666L260 684L332 626L254 570L352 574Z" fill="#FF3366" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="104" y="308" font-size="92" fill="#FFFFFF" stroke="#111827" stroke-width="8" paint-order="stroke">BAM!</text>
    <text x="104" y="400" font-size="58" fill="#111827">make the point</text>
  </g>
  <g data-wc-object="bubble" data-wc-kind="text" data-wc-anim="zoom">
    <path d="M94 626H344Q374 626 374 656V782Q374 812 344 812H156L98 872L120 812H94Q64 812 64 782V656Q64 626 94 626Z" fill="#FFFFFF" stroke="#111827" stroke-width="8"/>
    <text x="116" y="706" font-size="39" fill="#111827">high punch</text>
    <text x="116" y="752" font-size="39" fill="#111827">short copy</text>
  </g>
</svg>
