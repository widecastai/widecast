<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Organic Paper Cutout Overlay Sample</title>
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#3F2E21" flood-opacity="0.22"/>
    </filter>
    <style>text { font-family: "Source Sans 3", Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="paper_blob" data-wc-kind="object" data-wc-anim="pop" filter="url(#paperShadow)">
    <path d="M100 206C170 132 322 160 396 188C520 236 618 326 580 458C548 568 426 540 340 592C260 640 128 604 98 496C70 396 42 270 100 206Z" fill="#F7E7C6"/>
  </g>
  <g data-wc-object="leaf_marks" data-wc-kind="mark" data-wc-anim="fade">
    <path d="M526 222C588 254 584 328 530 356C506 302 500 262 526 222Z" fill="#82B366"/>
    <path d="M138 614C202 620 232 692 184 736C146 694 126 658 138 614Z" fill="#F59E0B"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="132" y="332" font-size="68" font-weight="900" fill="#3F2E21">Human</text>
    <text x="132" y="406" font-size="68" font-weight="900" fill="#3F2E21">systems</text>
  </g>
  <g data-wc-object="note_card" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#paperShadow)">
    <path d="M116 684H602V852H116Z" fill="#FFF7ED"/>
    <text x="152" y="750" font-size="38" font-weight="900" fill="#3F2E21">Warm, tactile, friendly</text>
    <text x="152" y="804" font-size="30" font-weight="700" fill="#7C5E46">good for education and care</text>
  </g>
</svg>
