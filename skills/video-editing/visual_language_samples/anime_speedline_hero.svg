<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Anime Speedline Hero Overlay Sample</title>
  <defs>
    <radialGradient id="animeBurst" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#93C5FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0"/>
    </radialGradient>
    <style>text { font-family: "Noto Sans Condensed", "Roboto Condensed", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="burst_glow" data-wc-kind="object" data-wc-anim="zoom">
    <circle cx="360" cy="370" r="360" fill="url(#animeBurst)"/>
  </g>
  <g data-wc-object="speed_lines" data-wc-kind="mark" data-wc-anim="fade" opacity="0.92">
    <path d="M360 380L54 150M360 380L116 126M360 380L210 120M360 380L518 116M360 380L662 176M360 380L640 496M360 380L616 704M360 380L482 894M360 380L262 914M360 380L96 760M360 380L46 500" stroke="#111827" stroke-width="5"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="92" y="340" font-size="82" font-weight="900" fill="#FFFFFF" stroke="#111827" stroke-width="8" paint-order="stroke">ANIME</text>
    <text x="92" y="430" font-size="82" font-weight="900" fill="#FDE047" stroke="#111827" stroke-width="8" paint-order="stroke">IMPACT</text>
  </g>
  <g data-wc-object="subtitle" data-wc-kind="text" data-wc-anim="pop">
    <rect x="116" y="566" width="488" height="82" rx="10" fill="#111827" opacity="0.94"/>
    <text x="152" y="620" font-size="36" font-weight="900" fill="#FFFFFF">speed lines + dramatic scale</text>
  </g>
  <g data-wc-object="tag" data-wc-kind="text" data-wc-anim="slide-right">
    <text x="124" y="806" font-size="40" font-weight="900" fill="#111827" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">Use sparingly for peak moments.</text>
  </g>
</svg>
