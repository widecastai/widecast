<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Toy Clay 3D Overlay Sample</title>
  <defs>
    <filter id="clayShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1F2937" flood-opacity="0.2"/>
    </filter>
    <radialGradient id="clayBlue" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </radialGradient>
    <radialGradient id="clayPink" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#FFE4E6"/>
      <stop offset="1" stop-color="#FB7185"/>
    </radialGradient>
    <style>text { font-family: "Nunito", "Open Sans", Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="clay_shapes" data-wc-kind="object" data-wc-anim="pop" filter="url(#clayShadow)">
    <circle cx="190" cy="254" r="84" fill="url(#clayPink)"/>
    <rect x="356" y="186" width="188" height="156" rx="50" fill="url(#clayBlue)"/>
    <circle cx="540" cy="590" r="74" fill="#FDE68A"/>
  </g>
  <g data-wc-object="title_card" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#clayShadow)">
    <rect x="90" y="392" width="540" height="210" rx="48" fill="#FFFFFF"/>
    <text x="130" y="486" font-size="66" font-weight="900" fill="#1F2937">Toy-like</text>
    <text x="130" y="558" font-size="66" font-weight="900" fill="#3B82F6">3D</text>
  </g>
  <g data-wc-object="footer" data-wc-kind="text" data-wc-anim="fade">
    <text x="112" y="772" font-size="34" font-weight="900" fill="#1F2937">soft, rounded, friendly depth</text>
  </g>
</svg>
