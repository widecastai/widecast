<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Medical Clean Overlay Sample</title>
  <defs>
    <style>text { font-family: Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="clean_panel" data-wc-kind="object" data-wc-anim="fade">
    <rect x="70" y="154" width="580" height="754" rx="28" fill="#F8FEFF" stroke="#BEE3F8" stroke-width="3"/>
  </g>
  <g data-wc-object="cross_mark" data-wc-kind="mark" data-wc-anim="pop">
    <rect x="112" y="206" width="38" height="118" rx="10" fill="#0EA5E9"/>
    <rect x="72" y="246" width="118" height="38" rx="10" fill="#0EA5E9"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="222" y="258" font-size="52" font-weight="900" fill="#0F172A">Clean</text>
    <text x="222" y="320" font-size="52" font-weight="900" fill="#0EA5E9">guidance</text>
  </g>
  <g data-wc-object="checklist" data-wc-kind="text" data-wc-anim="slide-up">
    <circle cx="120" cy="480" r="18" fill="#14B8A6"/>
    <path d="M110 480L118 490L132 470" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="492" font-size="34" font-weight="800" fill="#0F172A">low anxiety</text>
    <circle cx="120" cy="570" r="18" fill="#14B8A6"/>
    <path d="M110 570L118 580L132 560" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="582" font-size="34" font-weight="800" fill="#0F172A">high trust</text>
    <circle cx="120" cy="660" r="18" fill="#14B8A6"/>
    <path d="M110 660L118 670L132 650" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="672" font-size="34" font-weight="800" fill="#0F172A">plain language</text>
  </g>
  <g data-wc-object="footer" data-wc-kind="text" data-wc-anim="fade">
    <rect x="104" y="794" width="510" height="70" rx="35" fill="#E0F2FE"/>
    <text x="138" y="840" font-size="30" font-weight="900" fill="#075985">health, care, safety, procedure</text>
  </g>
</svg>
