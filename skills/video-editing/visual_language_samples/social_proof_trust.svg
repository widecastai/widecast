<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Social Proof Trust Overlay Sample</title>
  <defs>
    <filter id="trustShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <style>text { font-family: Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="80" y="238" font-size="66" font-weight="900" fill="#0F172A">Trust is</text>
    <text x="80" y="314" font-size="66" font-weight="900" fill="#16A34A">visible</text>
  </g>
  <g data-wc-object="stars" data-wc-kind="mark" data-wc-anim="pop">
    <path d="M104 410L118 438L150 442L126 464L132 496L104 480L76 496L82 464L58 442L90 438Z" fill="#FBBF24"/>
    <path d="M176 410L190 438L222 442L198 464L204 496L176 480L148 496L154 464L130 442L162 438Z" fill="#FBBF24"/>
    <path d="M248 410L262 438L294 442L270 464L276 496L248 480L220 496L226 464L202 442L234 438Z" fill="#FBBF24"/>
  </g>
  <g data-wc-object="quote_card" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#trustShadow)">
    <rect x="82" y="550" width="556" height="228" rx="30" fill="#FFFFFF"/>
    <text x="120" y="626" font-size="42" font-weight="900" fill="#0F172A">"Clear and credible."</text>
    <text x="120" y="690" font-size="31" font-weight="800" fill="#475569">social proof without clutter</text>
    <rect x="120" y="722" width="166" height="12" rx="6" fill="#16A34A"/>
  </g>
  <g data-wc-object="seal" data-wc-kind="text" data-wc-anim="zoom">
    <circle cx="532" cy="854" r="72" fill="#DCFCE7" stroke="#16A34A" stroke-width="5"/>
    <text x="490" y="846" font-size="24" font-weight="900" fill="#166534">VERIFIED</text>
    <text x="502" y="880" font-size="24" font-weight="900" fill="#166534">TRUST</text>
  </g>
</svg>
