<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Soft Depth Floating Cards Overlay Sample</title>
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1E293B" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="mintCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#E9FFF6" stop-opacity="0.92"/>
    </linearGradient>
    <style>
      text { font-family: "Be Vietnam Pro", Inter, Arial, sans-serif; }
    </style>
  </defs>
  <g data-wc-object="title_card" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#softShadow)">
    <rect x="62" y="150" width="596" height="260" rx="34" fill="url(#mintCard)" stroke="#D6F5E8" stroke-width="2"/>
    <text x="102" y="248" font-size="72" font-weight="900" fill="#12322B">Soft depth</text>
    <text x="104" y="318" font-size="42" font-weight="800" fill="#2BAE82">quiet, warm, readable</text>
    <rect x="104" y="348" width="206" height="16" rx="8" fill="#2BAE82"/>
  </g>
  <g data-wc-object="card_left" data-wc-kind="text" data-wc-anim="slide-right" filter="url(#softShadow)">
    <rect x="74" y="480" width="270" height="194" rx="28" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="120" cy="536" r="20" fill="#DFFAF0"/>
    <text x="104" y="598" font-size="64" font-weight="900" fill="#102A43">01</text>
    <text x="104" y="638" font-size="30" font-weight="800" fill="#486581">gentle card lift</text>
  </g>
  <g data-wc-object="card_right" data-wc-kind="text" data-wc-anim="slide-left" filter="url(#softShadow)">
    <rect x="376" y="540" width="270" height="194" rx="28" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="422" cy="596" r="20" fill="#EDE9FE"/>
    <text x="406" y="658" font-size="64" font-weight="900" fill="#102A43">02</text>
    <text x="406" y="698" font-size="30" font-weight="800" fill="#486581">soft contrast</text>
  </g>
  <g data-wc-object="note_strip" data-wc-kind="callout" data-wc-anim="fade" filter="url(#softShadow)">
    <rect x="92" y="808" width="536" height="104" rx="30" fill="#F8FAFC" opacity="0.96"/>
    <text x="132" y="873" font-size="36" font-weight="900" fill="#12322B">Best for calm explainers</text>
  </g>
</svg>
