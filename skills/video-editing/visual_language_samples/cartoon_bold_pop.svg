<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Cartoon Bold Pop Overlay Sample</title>
  <defs>
    <style>text { font-family: "Arial Black", "Montserrat Black", Arial, sans-serif; }</style>
    <filter id="cartoonDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="7" dy="8" stdDeviation="0" flood-color="#111111" flood-opacity="1"/>
    </filter>
  </defs>
  <g data-wc-object="cloud" data-wc-kind="object" data-wc-anim="pop" filter="url(#cartoonDrop)">
    <path d="M166 214C150 154 236 118 284 158C324 94 430 118 436 196C526 184 580 272 522 340C564 416 472 490 398 444C350 518 228 500 220 410C132 430 76 338 130 272C132 248 144 228 166 214Z" fill="#FFFFFF" stroke="#111111" stroke-width="9"/>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="pop" filter="url(#cartoonDrop)">
    <text x="150" y="300" font-size="72" font-weight="900" fill="#FF4D6D" stroke="#111111" stroke-width="5" paint-order="stroke">CARTOON</text>
    <text x="206" y="380" font-size="72" font-weight="900" fill="#FFD93D" stroke="#111111" stroke-width="5" paint-order="stroke">POP!</text>
  </g>
  <g data-wc-object="sparkles" data-wc-kind="mark" data-wc-anim="zoom">
    <path d="M102 514L128 570L188 586L130 610L104 668L78 610L20 586L80 570Z" fill="#6BCB77" stroke="#111111" stroke-width="7"/>
    <path d="M574 548L596 594L646 608L598 630L576 678L552 630L504 608L554 594Z" fill="#4D96FF" stroke="#111111" stroke-width="7"/>
  </g>
  <g data-wc-object="caption_card" data-wc-kind="text" data-wc-anim="slide-up" filter="url(#cartoonDrop)">
    <rect x="94" y="724" width="532" height="126" rx="26" fill="#FFFFFF" stroke="#111111" stroke-width="8"/>
    <text x="130" y="802" font-size="42" font-weight="900" fill="#111111">friendly, loud, playful</text>
  </g>
</svg>
