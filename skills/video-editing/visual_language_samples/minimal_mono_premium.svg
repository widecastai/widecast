<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <title>Minimal Mono Premium Overlay Sample</title>
  <defs>
    <style>text { font-family: Inter, Arial, sans-serif; }</style>
  </defs>
  <g data-wc-object="fine_frame" data-wc-kind="mark" data-wc-anim="fade">
    <rect x="76" y="152" width="568" height="760" fill="none" stroke="#111827" stroke-width="2"/>
    <path d="M76 270H644M76 788H644" stroke="#111827" stroke-width="2"/>
  </g>
  <g data-wc-object="small_meta" data-wc-kind="text" data-wc-anim="slide-down">
    <text x="104" y="214" font-size="25" font-weight="800" fill="#111827">MINIMAL MONO</text>
    <text x="500" y="214" font-size="25" font-weight="800" fill="#6B7280">2026</text>
  </g>
  <g data-wc-object="title" data-wc-kind="text" data-wc-anim="slide-up">
    <text x="102" y="396" font-size="78" font-weight="900" fill="#111827">Less</text>
    <text x="102" y="486" font-size="78" font-weight="900" fill="#111827">but sharper.</text>
  </g>
  <g data-wc-object="micro_stats" data-wc-kind="text" data-wc-anim="fade">
    <text x="104" y="622" font-size="30" font-weight="800" fill="#111827">01</text>
    <text x="180" y="622" font-size="30" font-weight="700" fill="#111827">high restraint</text>
    <path d="M104 650H584" stroke="#E5E7EB" stroke-width="2"/>
    <text x="104" y="708" font-size="30" font-weight="800" fill="#111827">02</text>
    <text x="180" y="708" font-size="30" font-weight="700" fill="#111827">premium silence</text>
  </g>
  <g data-wc-object="accent" data-wc-kind="bar" data-wc-anim="grow-x">
    <rect x="104" y="832" width="180" height="8" fill="#111827"/>
  </g>
